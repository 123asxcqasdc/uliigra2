<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b3b1b">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/shared.css">

    <!-- превью в соцсетях -->
    <meta property="og:title" content="Ули · фоторамка">
    <meta property="og:description" content="Надень улитко-рамку на своё фото и скачай картинку 🖼️🐌">
    <meta property="og:url" content="https://uliigra2.c6t.ru/foto">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Ули · фоторамка">
    <meta name="twitter:description" content="Надень улитко-рамку на своё фото и скачай картинку 🖼️🐌">

    <title>Ули · фоторамка</title>
    <style>
        .main-container {
            max-width: 820px;
            text-align: center;
        }

        .header-title {
            font-size: 2.3rem;
        }

        .snail-icon-big {
            font-size: 3rem;
        }

        /* ---- Зона загрузки ---- */
        .drop-zone {
            border: 3px dashed #7eaf7a;
            border-radius: 24px;
            padding: 2.5rem 1.2rem;
            background: rgba(33, 63, 33, 0.55);
            transition: 0.2s;
            cursor: pointer;
            position: relative;
        }

        .drop-zone.drag-over {
            border-color: #d8f0b5;
            background: rgba(47, 84, 47, 0.75);
            transform: scale(1.01);
        }

        .drop-zone .dz-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.6rem;
            filter: drop-shadow(2px 4px 3px #0f2a0f);
        }

        .drop-zone .dz-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #e2f0c0;
            margin-bottom: 0.4rem;
        }

        .drop-zone .dz-sub {
            font-size: 0.85rem;
            color: #9bbc7b;
        }

        .dz-buttons {
            display: flex;
            gap: 0.7rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.2rem;
        }

        /* ---- Предпросмотр ---- */
        .preview-wrap {
            display: none;
            margin-top: 1.5rem;
        }

        .preview-wrap.show { display: block; }

        .canvas-box {
            display: inline-block;
            max-width: 100%;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 16px 40px -14px rgba(0, 0, 0, 0.8);
            background: #0e1f0e;
            line-height: 0;
        }

        #canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* ---- Настройки ---- */
        .controls {
            margin-top: 1.6rem;
            text-align: left;
        }

        .ctrl-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            color: #c7e0b0;
            letter-spacing: 0.5px;
            margin-bottom: 0.6rem;
        }

        .frames {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 1.3rem;
        }

        .frame-btn {
            padding: 0.6rem 1.1rem;
            border-radius: 30px;
            border: 2px solid #7eaf7a;
            background: rgba(47, 84, 47, 0.5);
            color: #c7e0b0;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .frame-btn:hover { background: #2f542f; color: #ffefc0; }

        .frame-btn.active {
            background: #a3c4a3;
            color: #1b3f1b;
            border-color: #d8f0b5;
            box-shadow: 0 0 16px rgba(163, 196, 163, 0.45);
        }

        .caption-row {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .caption-row input[type="text"] {
            flex: 1;
            min-width: 180px;
            padding: 0.8rem 1.1rem;
            background: #213f21;
            border: 2px solid #7eaf7a;
            border-radius: 16px;
            color: #f0f7da;
            font-family: inherit;
            font-size: 1rem;
        }

        .caption-row input[type="text"]:focus {
            outline: none;
            border-color: #c7f0b1;
            box-shadow: 0 0 0 3px rgba(167, 200, 163, 0.3);
        }

        .switch {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #c7e0b0;
            cursor: pointer;
            user-select: none;
        }

        .switch input { width: 18px; height: 18px; accent-color: #a3c4a3; cursor: pointer; }

        /* ---- Кнопки ---- */
        .actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1.8rem;
        }

        .btn {
            padding: 0.9rem 1.7rem;
            border-radius: 30px;
            border: none;
            background: #a3c4a3;
            color: #1b3f1b;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 5px 0 #446d44;
            min-height: 48px;
        }

        .btn:hover { background: #c3e6b3; transform: translateY(-2px); box-shadow: 0 7px 0 #2f542f; }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2f542f; }

        .btn.ghost {
            background: transparent;
            color: #c7e0b0;
            border: 2px solid #7eaf7a;
            box-shadow: none;
            font-weight: 700;
        }

        .btn.ghost:hover { background: #2f542f; color: #ffefc0; transform: translateY(-2px); box-shadow: none; }

        .btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .hint {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #9bbc7b;
            line-height: 1.6;
        }

        .footer-snails { margin-top: 2.5rem; }

        @media (max-width: 600px) {
            .header-title { font-size: 1.6rem; }
            .snail-icon-big { font-size: 2.1rem; }
            .btn { flex: 1 1 auto; padding: 0.85rem 1.1rem; }
            .drop-zone { padding: 1.8rem 1rem; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-row">
        <a class="home-link" href="/home">🐌 УЛИ</a>
        <div class="header-title">
            <span class="snail-icon-big">🖼️</span>
            <span>УЛИ-ФОТОРАМКА</span>
            <span class="snail-icon-big">🐌</span>
        </div>
    </div>

    <div class="drop-zone" id="dropZone">
        <span class="dz-icon">🐌</span>
        <div class="dz-title">Перетащите фото сюда</div>
        <div class="dz-sub">или выберите файл — всё обрабатывается прямо в браузере</div>
        <div class="dz-buttons">
            <button class="btn" type="button" onclick="pickFile()">выбрать фото</button>
            <button class="btn ghost" type="button" onclick="capturePhoto()">📷 сфотографировать</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    </div>

    <div class="preview-wrap" id="previewWrap">
        <div class="canvas-box">
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls">
            <span class="ctrl-label">рамка:</span>
            <div class="frames" id="frames">
                <button class="frame-btn active" data-frame="classic" onclick="setFrame('classic')">🐌 классика</button>
                <button class="frame-btn" data-frame="polaroid" onclick="setFrame('polaroid')">📷 полароид</button>
                <button class="frame-btn" data-frame="leaves" onclick="setFrame('leaves')">🍃 листва</button>
                <button class="frame-btn" data-frame="neon" onclick="setFrame('neon')">✨ неон</button>
            </div>

            <span class="ctrl-label">подпись:</span>
            <div class="caption-row">
                <input type="text" id="captionInput" value="Ули · ползём вместе" maxlength="60">
                <label class="switch"><input type="checkbox" id="captionOn" checked> показывать</label>
            </div>
        </div>

        <div class="actions">
            <button class="btn" onclick="downloadPhoto()">⬇️ скачать фото</button>
            <button class="btn ghost" onclick="reset()">другое фото</button>
        </div>
        <div class="hint">Совет: подпись и рамка не портят оригинал — можно менять сколько угодно раз.</div>
    </div>

    <div class="footer-snails">
        <span>🐌</span><span>🐌💚</span><span>🐌</span><span>🐚</span><span>🐌</span><span>🍀🐌</span>
    </div>
    <div class="footer-copyright">© Ули 2025–2026</div>
</div>

<script>
    const MAX_SIDE = 1800;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const dropZone = document.getElementById('dropZone');
    const previewWrap = document.getElementById('previewWrap');
    const fileInput = document.getElementById('fileInput');
    const cameraInput = document.getElementById('cameraInput');
    const captionInput = document.getElementById('captionInput');
    const captionOn = document.getElementById('captionOn');

    const EMOJI_FONT = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
    const TEXT_FONT = '"Segoe UI", Roboto, system-ui, sans-serif';

    let photo = null;
    let frame = 'classic';

    /* ---------------- Загрузка файла ---------------- */

    function pickFile() { fileInput.click(); }
    function capturePhoto() { cameraInput.click(); }

    fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
    cameraInput.addEventListener('change', e => loadFile(e.target.files[0]));

    dropZone.addEventListener('click', e => {
        if (e.target.tagName === 'BUTTON') return;
        pickFile();
    });

    ['dragenter', 'dragover'].forEach(ev =>
        dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('drag-over'); }));
    ['dragleave', 'drop'].forEach(ev =>
        dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('drag-over'); }));

    dropZone.addEventListener('drop', e => {
        const f = e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) loadFile(f);
    });

    function loadFile(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            alert('нужен файл-картинка');
            return;
        }
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url);
            setupCanvas(img);
            dropZone.style.display = 'none';
            previewWrap.classList.add('show');
            draw();
        };
        img.onerror = () => {
            URL.revokeObjectURL(url);
            alert('не удалось открыть изображение');
        };
        img.src = url;
    }

    function setupCanvas(img) {
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        const k = Math.min(1, MAX_SIDE / Math.max(w, h));
        w = Math.round(w * k);
        h = Math.round(h * k);
        canvas.width = w;
        canvas.height = h;
        photo = img;
    }

    /* ---------------- Рисование ---------------- */

    function draw() {
        if (!photo) return;
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(photo, 0, 0, w, h);

        const m = Math.round(Math.min(w, h) * 0.045);

        if (frame === 'classic')      drawClassic(w, h, m);
        else if (frame === 'polaroid') drawPolaroid(w, h, m);
        else if (frame === 'leaves')   drawLeaves(w, h, m);
        else if (frame === 'neon')     drawNeon(w, h, m);

        drawCaption(w, h, m);
    }

    function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function drawEmoji(ch, x, y, size, rot) {
        ctx.save();
        ctx.translate(x, y);
        if (rot) ctx.rotate(rot);
        ctx.font = size + 'px ' + EMOJI_FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ch, 0, 0);
        ctx.restore();
    }

    function drawClassic(w, h, m) {
        const bw = Math.max(6, m * 0.5);
        // внешняя тёмная рамка
        ctx.strokeStyle = '#2d4a2d';
        ctx.lineWidth = bw;
        roundedRect(bw / 2, bw / 2, w - bw, h - bw, m * 0.6);
        ctx.stroke();
        // внутренняя светлая
        ctx.strokeStyle = '#c7f0b1';
        ctx.lineWidth = Math.max(2, bw * 0.28);
        const inset = bw + Math.max(2, bw * 0.3);
        roundedRect(inset, inset, w - inset * 2, h - inset * 2, m * 0.4);
        ctx.stroke();
        // угловые улитки
        const s = Math.max(30, m * 1.4);
        drawEmoji('🐌', m * 0.95, m * 0.95, s, -Math.PI / 5);
        drawEmoji('🐌', w - m * 0.95, m * 0.95, s, Math.PI / 5);
        drawEmoji('🐌', m * 0.95, h - m * 0.95, s, Math.PI / 7);
        drawEmoji('🐌', w - m * 0.95, h - m * 0.95, s, -Math.PI / 7);
    }

    function drawPolaroid(w, h, m) {
        const side = Math.max(10, m * 0.7);
        const top = side;
        const bottom = side * 3;
        ctx.fillStyle = '#f7fbef';
        ctx.fillRect(0, 0, w, top);
        ctx.fillRect(0, h - bottom, w, bottom);
        ctx.fillRect(0, 0, side, h);
        ctx.fillRect(w - side, 0, side, h);
        // лёгкая тень внутри
        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.lineWidth = 2;
        ctx.strokeRect(side, top, w - side * 2, h - top - bottom);
        // уголок-скотч
        ctx.fillStyle = 'rgba(199, 240, 177, 0.55)';
        ctx.save();
        ctx.translate(w * 0.5, top);
        ctx.rotate(-Math.PI / 4);
        ctx.fillRect(-m * 0.9, -m * 0.18, m * 1.8, m * 0.36);
        ctx.restore();
    }

    function drawLeaves(w, h, m) {
        const r = Math.max(10, m * 0.55);
        ctx.fillStyle = '#3f7a3f';
        // верх/низ
        for (let x = r; x < w; x += r * 2) {
            ctx.beginPath();
            ctx.arc(x, 0, r, 0, Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x, h, r, Math.PI, 0);
            ctx.fill();
        }
        // лево/право
        for (let y = r; y < h; y += r * 2) {
            ctx.beginPath();
            ctx.arc(0, y, r, -Math.PI / 2, Math.PI / 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(w, y, r, Math.PI / 2, -Math.PI / 2);
            ctx.fill();
        }
        // контур
        ctx.strokeStyle = '#c7f0b1';
        ctx.lineWidth = Math.max(2, m * 0.12);
        ctx.strokeRect(r * 0.4, r * 0.4, w - r * 0.8, h - r * 0.8);
        // улитки по углам и листики
        const s = Math.max(28, m * 1.2);
        drawEmoji('🐌', m, m, s, -0.3);
        drawEmoji('🍃', w - m, m, s * 0.9, 0.4);
        drawEmoji('🐌', w - m, h - m, s, 3.4);
        drawEmoji('🍃', m, h - m, s * 0.9, -0.5);
    }

    function drawNeon(w, h, m) {
        // затемнение по краям
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, 'rgba(10, 26, 10, 0.75)');
        g.addColorStop(0.18, 'rgba(10, 26, 10, 0)');
        g.addColorStop(0.82, 'rgba(10, 26, 10, 0)');
        g.addColorStop(1, 'rgba(10, 26, 10, 0.75)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.shadowColor = '#c7f0b1';
        ctx.shadowBlur = m;
        ctx.strokeStyle = '#d8f0b5';
        ctx.lineWidth = Math.max(3, m * 0.3);
        ctx.setLineDash([m * 1.2, m * 0.7]);
        roundedRect(m * 0.7, m * 0.7, w - m * 1.4, h - m * 1.4, m * 0.8);
        ctx.stroke();
        ctx.restore();

        const s = Math.max(28, m * 1.1);
        drawEmoji('✨', m * 1.1, m * 1.1, s * 0.8);
        drawEmoji('🐌', w - m * 1.1, m * 1.1, s, 2.6);
        drawEmoji('🐌', m * 1.1, h - m * 1.1, s, -0.6);
        drawEmoji('✨', w - m * 1.1, h - m * 1.1, s * 0.8);
    }

    function drawCaption(w, h, m) {
        if (!captionOn.checked) return;
        const text = captionInput.value.trim();
        if (!text) return;

        const size = Math.max(16, Math.round(Math.min(w, h) * 0.045));
        ctx.save();
        ctx.font = '700 ' + size + 'px ' + TEXT_FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const tw = ctx.measureText(text).width;
        let bx, by;

        if (frame === 'polaroid') {
            bx = w / 2;
            by = h - Math.max(10, m * 0.7) * 1.5 + (Math.max(10, m * 0.7) * 3) / 2 - Math.max(10, m * 0.7) * 0.1;
            by = h - (Math.max(10, m * 0.7) * 3) / 2;
            ctx.fillStyle = '#2d4a2d';
            ctx.fillText(text, bx, by);
            ctx.restore();
            return;
        }

        // полупрозрачная плашка снизу
        const pad = size * 0.6;
        bx = m * 1.2;
        const bw = Math.min(w - m * 2.4, tw + pad * 2);
        by = h - m * 1.2 - size - pad;
        ctx.fillStyle = 'rgba(15, 32, 15, 0.62)';
        roundedRect((w - bw) / 2, by, bw, size + pad * 2, (size + pad * 2) / 2);
        ctx.fill();

        ctx.fillStyle = '#eaffda';
        ctx.fillText(text, w / 2, by + (size + pad * 2) / 2);
        ctx.restore();
    }

    /* ---------------- Управление ---------------- */

    function setFrame(f) {
        frame = f;
        document.querySelectorAll('.frame-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.frame === f));
        draw();
    }

    captionInput.addEventListener('input', draw);
    captionOn.addEventListener('change', draw);

    function downloadPhoto() {
        if (!photo) return;
        canvas.toBlob(blob => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'uli-foto.png';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }, 'image/png');
    }

    function reset() {
        photo = null;
        fileInput.value = '';
        cameraInput.value = '';
        previewWrap.classList.remove('show');
        dropZone.style.display = '';
    }
</script>
</body>
</html>
