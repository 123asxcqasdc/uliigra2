    <style>
      /* Экран загрузки «Кузница hammer147»: рисуется сразу, до загрузки игры.
         Все движения — transform/opacity, поэтому анимация не замирает, пока грузится игра. */
      #boot {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 42%, #3a2f58 0%, #262139 48%, #16131f 100%);
        font-family: 'Nunito', 'Segoe UI Rounded', 'Segoe UI', Roboto, system-ui, sans-serif;
        color: #2b2340; user-select: none; -webkit-user-select: none;
        transition: opacity 0.55s ease, transform 0.55s ease;
      }
      #boot.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
      #boot .ld-heat {
        position: absolute; left: 50%; bottom: -30vh; width: 120vh; height: 70vh; margin-left: -60vh;
        border-radius: 50%; background: radial-gradient(closest-side, rgba(255,140,60,0.34), rgba(255,140,60,0));
        animation: ldHeat 1.2s ease-out infinite;
      }
      #boot .ld-ember {
        position: absolute; bottom: -10px; width: 5px; height: 5px; border-radius: 50%;
        background: #ffc46b; box-shadow: 0 0 8px 2px rgba(255,150,60,0.7);
        animation: ldEmber linear infinite; opacity: 0;
      }
      #boot .ld-logo {
        font-size: clamp(30px, 7.2vh, 46px); font-weight: 900; color: #fff; line-height: 1;
        letter-spacing: 1px; white-space: nowrap; position: relative; z-index: 2;
        text-shadow: 3px 0 #2b2340, -3px 0 #2b2340, 0 3px #2b2340, 0 -3px #2b2340, 2.2px 2.2px #2b2340,
          -2.2px 2.2px #2b2340, 2.2px -2.2px #2b2340, -2.2px -2.2px #2b2340, 0 6px #2b2340, 3px 5px #2b2340, -3px 5px #2b2340;
      }
      #boot .ld-logo i {
        font-style: normal; display: inline-block; transform: translateY(-60px) scale(0.4); opacity: 0;
        animation: ldDrop 0.5s cubic-bezier(.3,1.6,.5,1) forwards;
      }
      #boot .ld-logo i.r { color: #ffc36a; }
      #boot .ld-sub {
        position: relative; z-index: 2; margin-top: 8px; padding: 3px 14px; border-radius: 12px;
        background: #ff8fa3; border: 3px solid #2b2340; box-shadow: 0 3px 0 #2b2340;
        color: #2b2340; font-weight: 900; font-size: clamp(11px, 2.4vh, 15px); letter-spacing: 2px; text-transform: uppercase;
        transform: rotate(-2deg) scale(0); animation: ldStamp2 0.4s 0.85s cubic-bezier(.3,1.7,.5,1) forwards;
      }
      @keyframes ldStamp2 { to { transform: rotate(-2deg) scale(1); } }
      #boot .ld-logo i.sp { width: 0.32em; }
      #boot .ld-stage { width: min(300px, 62vh); height: auto; margin: -1vh 0 -1vh; position: relative; z-index: 1; overflow: visible; }
      #boot .ld-hammer { transform-box: view-box; transform-origin: 210px 68px; animation: ldSwing 1.2s infinite; }
      #boot .ld-anvil { transform-box: view-box; transform-origin: 120px 146px; animation: ldShake 1.2s infinite; }
      #boot .ld-flash { transform-box: fill-box; transform-origin: center; animation: ldFlash 1.2s infinite; opacity: 0; }
      #boot .ld-hot { animation: ldHot 1.2s infinite; }
      #boot .ld-sp { animation: ldSpark 1.2s infinite; opacity: 0; }
      #boot .ld-bar {
        width: min(360px, 56vw); height: 20px; border: 3px solid #2b2340; border-radius: 12px;
        background: #1c1829; box-shadow: 0 3px 0 #2b2340, inset 0 2px 0 rgba(255,255,255,0.06);
        overflow: hidden; position: relative; z-index: 2;
      }
      #boot .ld-fill {
        height: 100%; width: 3%; border-radius: 8px;
        background: repeating-linear-gradient(-45deg, rgba(255,255,255,0.22) 0 8px, rgba(255,255,255,0) 8px 16px),
          linear-gradient(90deg, #ff7a3c, #ffd27a);
        background-size: 22.6px 22.6px, 100% 100%;
        box-shadow: 0 0 12px rgba(255,170,80,0.7);
        animation: ldStripes 0.7s linear infinite;
      }
      #boot .ld-row {
        width: min(360px, 56vw); display: flex; justify-content: space-between; margin-top: 7px;
        color: #fff3e6; font-weight: 800; font-size: 13px; text-shadow: 0 2px 0 #2b2340; position: relative; z-index: 2;
      }
      #boot .ld-pct { color: #ffd27a; }
      #boot .ld-by {
        position: absolute; bottom: max(14px, env(safe-area-inset-bottom, 0px)); left: 50%;
        display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 8px;
        background: #fff8f0; border: 3px solid #2b2340; border-radius: 14px; box-shadow: 0 3px 0 #2b2340;
        transform: translateX(-50%) scale(0); animation: ldStamp 0.45s 0.9s cubic-bezier(.3,1.7,.5,1) forwards;
      }
      #boot .ld-by svg { width: 26px; height: 26px; }
      #boot .ld-by small { display: block; font-size: 10px; font-weight: 800; color: #8a7fa8; line-height: 1; letter-spacing: 1px; text-transform: uppercase; }
      #boot .ld-by b { display: block; font-size: 17px; font-weight: 900; line-height: 1.05; color: #2b2340; }
      #boot .ld-by b span { color: #ff7a3c; }
      @keyframes ldSwing {
        0% { transform: rotate(50deg); animation-timing-function: ease-out; }
        42% { transform: rotate(60deg); animation-timing-function: cubic-bezier(.6,0,1,.6); }
        60% { transform: rotate(0deg); }
        66% { transform: rotate(7deg); }
        72% { transform: rotate(0deg); animation-timing-function: ease-in-out; }
        100% { transform: rotate(50deg); }
      }
      @keyframes ldShake {
        0%, 59% { transform: none; }
        61% { transform: translateY(2.5px) scaleY(0.97); }
        66% { transform: translateY(-1px); }
        72%, 100% { transform: none; }
      }
      @keyframes ldFlash {
        0%, 59% { opacity: 0; transform: scale(0.3); }
        61% { opacity: 1; transform: scale(1); }
        78%, 100% { opacity: 0; transform: scale(1.5); }
      }
      @keyframes ldHot { 0%, 59% { opacity: 0.35; } 61% { opacity: 1; } 100% { opacity: 0.35; } }
      @keyframes ldSpark {
        0%, 59% { opacity: 0; transform: translate(0, 0); }
        61% { opacity: 1; transform: translate(0, 0); }
        88% { opacity: 0; transform: translate(var(--dx), var(--dy)); }
        100% { opacity: 0; transform: translate(var(--dx), var(--dy)); }
      }
      @keyframes ldHeat { 0%, 59% { opacity: 0.55; } 62% { opacity: 1; } 100% { opacity: 0.55; } }
      @keyframes ldEmber {
        0% { transform: translate(0, 0) scale(1); opacity: 0; }
        12% { opacity: 1; }
        100% { transform: translate(var(--sx), -105vh) scale(0.3); opacity: 0; }
      }
      @keyframes ldDrop { to { transform: none; opacity: 1; } }
      @keyframes ldStamp { to { transform: translateX(-50%) scale(1); } }
      @keyframes ldStripes { to { background-position: 22.6px 0, 0 0; } }
    </style>

  <body>

    <script>
      // Логика экрана загрузки. Игра сообщает этапы через window.__boot.stage(p) и .done().
      (function () {
        // Язык до загрузки модулей: тот же ключ, что у src/i18n.js (значение — JSON, например "ru").
        var RU = false;
        try {
          var saved = JSON.parse(localStorage.getItem('minidungeon3d.lang') || 'null');
          RU = saved ? saved === 'ru' : /^(ru|be|uk|kk)\b/i.test(navigator.language || '');
        } catch (err) { RU = false; }
        document.documentElement.lang = RU ? 'ru' : 'en';
        if (!RU) {
          document.getElementById('ldSub').textContent = 'a dungeon roguelike';
          document.getElementById('ldBy').textContent = 'Created by';
          document.getElementById('ldText').textContent = 'Lighting the forge…';
        }
        var root = document.getElementById('boot');
        var logo = document.getElementById('ldLogo');
        var fill = document.getElementById('ldFill');
        var pct = document.getElementById('ldPct');
        var text = document.getElementById('ldText');
        // Буквы логотипа падают по одной.
        var html = '', n = 0, word = 'Bunbound';
        for (var i = 0; i < word.length; i++) {
          var c = word[i];
          var cls = c === ' ' ? 'sp' : i < 3 ? 'r' : '';
          html += '<i class="' + cls + '" style="animation-delay:' + (0.08 + n++ * 0.055).toFixed(2) + 's">' + (c === ' ' ? '&nbsp;' : c) + '</i>';
        }
        logo.innerHTML = html;
        // Искры от горна поднимаются снизу.
        for (var k = 0; k < 16; k++) {
          var e = document.createElement('div');
          e.className = 'ld-ember';
          e.style.left = (8 + Math.random() * 84).toFixed(1) + '%';
          e.style.setProperty('--sx', ((Math.random() - 0.5) * 120).toFixed(0) + 'px');
          e.style.animationDuration = (3.2 + Math.random() * 3.5).toFixed(2) + 's';
          e.style.animationDelay = (-Math.random() * 6).toFixed(2) + 's';
          var s = (3 + Math.random() * 4).toFixed(1) + 'px';
          e.style.width = s; e.style.height = s;
          root.appendChild(e);
        }
        var STAGES = RU ? [
          [0, 'Разжигаем горн…'], [22, 'Куём клинки…'], [45, 'Строим подземелье…'],
          [68, 'Прячем сундуки…'], [86, 'Будим скелетов…'], [99, 'Открываем ворота!'],
        ] : [
          [0, 'Lighting the forge…'], [22, 'Forging blades…'], [45, 'Building the dungeon…'],
          [68, 'Hiding chests…'], [86, 'Waking skeletons…'], [99, 'Opening the gates!'],
        ];
        var shown = 0, target = 28, finished = false, closing = false;
        var t0 = performance.now(), MIN = 2600;
        function tick() {
          if (!finished && target < 94) target += 0.12; // медленно ползём, пока игра не ответит
          shown += (target - shown) * 0.12;
          if (target - shown < 0.3) shown = target;
          fill.style.width = Math.max(3, shown).toFixed(1) + '%';
          pct.textContent = Math.floor(shown) + '%';
          var label = STAGES[0][1];
          for (var j = 0; j < STAGES.length; j++) if (shown >= STAGES[j][0]) label = STAGES[j][1];
          if (text.textContent !== label) text.textContent = label;
          if (finished && shown >= 99.5 && performance.now() - t0 > MIN) return close();
          setTimeout(tick, 50);
        }
        function close() {
          if (closing) return;
          closing = true;
          pct.textContent = '100%';
          root.classList.add('out');
          setTimeout(function () { root.remove(); }, 650);
        }
        window.__boot = {
          stage: function (p) { if (p > target) target = p; },
          done: function () { finished = true; target = 100; },
        };
        tick();
      })();
    </script>
