<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="/icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ули · редактор homeconfig.txt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #1b3b1b;
            background-image: radial-gradient(circle at 30% 40%, #2b5a2b 0%, #0e2f0e 90%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }
        .editor-shell {
            max-width: 1300px;
            width: 100%;
            background: rgba(30, 50, 30, 0.9);
            backdrop-filter: blur(8px);
            border: 3px solid #9bbc7b;
            border-radius: 30px;
            box-shadow: 0 25px 40px -10px #00000099, 0 0 0 2px #6f8c5d inset;
            padding: 2rem;
            color: #f0f7da;
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 2.8rem;
            font-weight: 800;
            text-shadow: 3px 3px 0 #2d4a2d;
            color: #e2f0c0;
            margin-bottom: 1.5rem;
            border-bottom: 3px dashed #7eaf7a;
            padding-bottom: 0.5rem;
        }
        h1 span { font-size: 3.5rem; transform: rotate(5deg); }
        
        .toolbar {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            background: #2a452a;
            padding: 1.2rem;
            border-radius: 60px;
            border: 2px solid #7eaf7a;
        }
        .btn {
            background: #5b8c5b;
            border: none;
            border-radius: 40px;
            padding: 0.8rem 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            color: #f0ffd0;
            border-bottom: 4px solid #2e542e;
            transition: 0.1s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn:hover {
            background: #70a570;
            transform: translateY(-2px);
            border-bottom-width: 5px;
        }
        .btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }
        .btn.secondary { background: #4d6b4d; border-bottom-color: #253f25; }
        .btn.warning { background: #a58f4d; border-bottom-color: #6b531f; }
        .btn.danger { background: #8b4e4e; border-bottom-color: #562e2e; }
        
        .file-import {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-left: auto;
        }
        .file-import label {
            background: #3f603f;
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            cursor: pointer;
            border-bottom: 4px solid #2e542e;
        }
        #fileInput { display: none; }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
            max-height: 500px;
            overflow-y: auto;
            padding: 0.5rem;
        }
        
        .card-item {
            background: #2e4d2e;
            border: 2px solid #7eaf7a;
            border-radius: 30px;
            padding: 1.5rem;
            position: relative;
            transition: 0.2s;
        }
        .card-item:hover {
            background: #386d38;
            box-shadow: 0 10px 20px #0f2a0f;
            transform: translateY(-3px);
        }
        .card-emoji-preview {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .card-field {
            margin: 0.8rem 0;
        }
        .card-field label {
            display: block;
            font-size: 0.9rem;
            color: #b4da9e;
            margin-bottom: 0.2rem;
        }
        .card-field input, .card-field textarea {
            width: 100%;
            background: #1f3a1f;
            border: 2px solid #9bbc7b;
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: #f0ffda;
            font-size: 0.95rem;
        }
        .card-field textarea {
            resize: vertical;
            min-height: 60px;
        }
        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            justify-content: flex-end;
        }
        .card-actions button {
            background: #2f542f;
            border: none;
            border-radius: 30px;
            padding: 0.4rem 1rem;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 3px solid #1b331b;
        }
        .card-actions button:hover { background: #437343; }
        
        .add-card-form {
            background: #1f3a1f;
            border-radius: 30px;
            padding: 1.5rem;
            margin: 2rem 0 1rem;
            border: 2px dashed #9bbc7b;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr auto;
            gap: 1rem;
            align-items: end;
        }
        .form-row .field {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .form-row input, .form-row textarea {
            background: #2f542f;
            border: 2px solid #9bbc7b;
            border-radius: 30px;
            padding: 0.6rem 1rem;
            color: #f0ffda;
        }
        .raw-data-panel {
            background: #143014;
            border: 2px solid #6b956b;
            border-radius: 24px;
            padding: 1.5rem;
            margin-top: 2rem;
        }
        .raw-data-panel h3 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            color: #c8e6a8;
        }
        .raw-output {
            background: #0f260f;
            border-radius: 20px;
            padding: 1.2rem;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #d4f0b0;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #5f8b5f;
            margin-bottom: 1rem;
        }
        .footer-snails {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            font-size: 2rem;
            opacity: 0.6;
            border-top: 2px dotted #61855e;
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>
<div class="editor-shell">
    <h1>
        <span>🐌</span> РЕДАКТОР homeconfig.txt <span>🐌</span>
    </h1>
    
    <!-- панель инструментов -->
    <div class="toolbar">
        <button class="btn" id="addSampleBtn"><span>➕</span> добавить пример</button>
        <button class="btn secondary" id="exportBtn"><span>📥</span> экспорт в файл</button>
        <div class="file-import">
            <label for="fileInput">📤 импорт файла</label>
            <input type="file" id="fileInput" accept=".txt,.json,text/plain">
        </div>
        <button class="btn warning" id="sortBtn"><span>🔄</span> сортировать по имени</button>
    </div>
    
    <!-- список карточек -->
    <div id="cardsContainer" class="cards-grid">
        <!-- карточки будут генерироваться динамически -->
    </div>
    
    <!-- форма добавления новой карточки -->
    <div class="add-card-form" id="addForm">
        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
            <span style="font-size: 2rem;">🐌</span>
            <span style="font-size: 1.4rem;">новая карточка</span>
        </div>
        <div class="form-row">
            <div class="field">
                <label>эмодзи (pic)</label>
                <input type="text" id="newPic" value="📄" placeholder="📄">
            </div>
            <div class="field">
                <label>имя (name)</label>
                <input type="text" id="newName" value="Новая страница" placeholder="Страница">
            </div>
            <div class="field">
                <label>описание (des)</label>
                <textarea id="newDes" rows="1" placeholder="краткое описание">пример описания</textarea>
            </div>
            <div class="field">
                <label>ссылка (link)</label>
                <input type="text" id="newLink" value="page.html" placeholder="https://...">
            </div>
            <button class="btn" id="addBtn" style="padding: 0.8rem 1.8rem;">➕</button>
        </div>
    </div>
    
    <!-- панель сырых данных -->
    <div class="raw-data-panel">
        <h3><span>🐚</span> текущий формат homeconfig.txt (с разделителем !)</h3>
        <div class="raw-output" id="rawOutput"></div>
        <button class="btn secondary" id="copyRawBtn"><span>📋</span> скопировать в буфер</button>
        <span style="margin-left: 1rem; color: #b8d9a0;" id="copyNotify"></span>
    </div>
    
    <div class="footer-snails">
        <span>🐌</span><span>🐚</span><span>🐌</span><span>🍃</span><span>🐌</span>
    </div>
</div>

<script>
    (function() {
        // ---------- данные ----------
        let cards = []; // массив объектов { pic, name, des, link }
        
        // элементы
        const container = document.getElementById('cardsContainer');
        const rawOutput = document.getElementById('rawOutput');
        const copyNotify = document.getElementById('copyNotify');
        
        // форма добавления
        const newPic = document.getElementById('newPic');
        const newName = document.getElementById('newName');
        const newDes = document.getElementById('newDes');
        const newLink = document.getElementById('newLink');
        const addBtn = document.getElementById('addBtn');
        
        // кнопки
        const addSampleBtn = document.getElementById('addSampleBtn');
        const exportBtn = document.getElementById('exportBtn');
        const fileInput = document.getElementById('fileInput');
        const sortBtn = document.getElementById('sortBtn');
        const copyRawBtn = document.getElementById('copyRawBtn');
        
        // ---------- вспомогательные функции ----------
        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        
        // обновление сырого вывода и перерисовка карточек
        function updateAll() {
            renderCards();
            updateRawOutput();
        }
        
        // генерирует текст в формате JSON с разделителем "!"
        function generateRawText() {
            return cards.map(card => JSON.stringify(card)).join('!');
        }
        
        function updateRawOutput() {
            rawOutput.textContent = generateRawText() || '// нет карточек';
        }
        
        // отрисовка карточек
        function renderCards() {
            container.innerHTML = '';
            if (cards.length === 0) {
                container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:3rem; background:#1f3a1f; border-radius:60px;">🐌 пока нет карточек. добавьте первую!</div>';
                return;
            }
            
            cards.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-item';
                cardDiv.dataset.index = index;
                
                // безопасные значения для отображения
                const safePic = card.pic || '🐌';
                const safeName = card.name || '';
                const safeDes = card.des || '';
                const safeLink = card.link || '';
                
                cardDiv.innerHTML = `
                    <div class="card-emoji-preview">${escapeHtml(safePic)}</div>
                    <div class="card-field">
                        <label>pic (эмодзи)</label>
                        <input type="text" class="edit-pic" value="${escapeHtml(safePic)}" placeholder="🐌">
                    </div>
                    <div class="card-field">
                        <label>name</label>
                        <input type="text" class="edit-name" value="${escapeHtml(safeName)}" placeholder="имя">
                    </div>
                    <div class="card-field">
                        <label>des</label>
                        <textarea class="edit-des" rows="2" placeholder="описание">${escapeHtml(safeDes)}</textarea>
                    </div>
                    <div class="card-field">
                        <label>link</label>
                        <input type="text" class="edit-link" value="${escapeHtml(safeLink)}" placeholder="https://...">
                    </div>
                    <div class="card-actions">
                        <button class="save-card" data-index="${index}">💾 сохранить</button>
                        <button class="delete-card" data-index="${index}">🗑️ удалить</button>
                    </div>
                `;
                container.appendChild(cardDiv);
            });
            
            // добавляем обработчики на кнопки карточек
            document.querySelectorAll('.save-card').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.target.dataset.index;
                    const cardDiv = e.target.closest('.card-item');
                    const newPic = cardDiv.querySelector('.edit-pic').value.trim() || '🐌';
                    const newName = cardDiv.querySelector('.edit-name').value.trim() || 'без имени';
                    const newDes = cardDiv.querySelector('.edit-des').value.trim() || '';
                    const newLink = cardDiv.querySelector('.edit-link').value.trim() || '#';
                    
                    cards[idx] = {
                        pic: newPic,
                        name: newName,
                        des: newDes,
                        link: newLink
                    };
                    updateAll();
                    copyNotify.textContent = '✅ карточка сохранена';
                    setTimeout(() => copyNotify.textContent = '', 1500);
                });
            });
            
            document.querySelectorAll('.delete-card').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.target.dataset.index;
                    cards.splice(idx, 1);
                    updateAll();
                    copyNotify.textContent = '🗑️ карточка удалена';
                    setTimeout(() => copyNotify.textContent = '', 1500);
                });
            });
        }
        
        // ---------- добавление новой карточки ----------
        addBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const pic = newPic.value.trim() || '🐌';
            const name = newName.value.trim() || 'Новая страница';
            const des = newDes.value.trim() || '';
            const link = newLink.value.trim() || '#';
            
            cards.push({ pic, name, des, link });
            updateAll();
            
            // очистить поля, но оставить заполненными для удобства
            newPic.value = '📄';
            newName.value = 'Новая страница';
            newDes.value = 'пример описания';
            newLink.value = 'page.html';
            
            copyNotify.textContent = '➕ карточка добавлена';
            setTimeout(() => copyNotify.textContent = '', 1500);
        });
        
        // ---------- добавить пример ----------
        addSampleBtn.addEventListener('click', () => {
            cards.push(
                { pic: '📁', name: 'Проекты', des: 'мои зелёные проекты', link: '/projects' },
                { pic: '🕸️', name: 'Паутина', des: 'ссылки на друзей', link: '/friends' },
                { pic: '🍃', name: 'Блог улитки', des: 'медленные записи', link: '/blog' }
            );
            updateAll();
            copyNotify.textContent = '🐌 примеры загружены';
            setTimeout(() => copyNotify.textContent = '', 1500);
        });
        
        // ---------- экспорт в файл homeconfig.txt ----------
        exportBtn.addEventListener('click', () => {
            const raw = generateRawText();
            if (!raw) {
                alert('Нет данных для экспорта');
                return;
            }
            const blob = new Blob([raw], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'homeconfig.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            copyNotify.textContent = '📥 файл сохранён';
            setTimeout(() => copyNotify.textContent = '', 1500);
        });
        
        // ---------- импорт из файла ----------
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const content = event.target.result;
                try {
                    // разделяем по "!" и парсим каждую часть
                    const parts = content.split('!').filter(p => p.trim() !== '');
                    const imported = [];
                    for (let part of parts) {
                        try {
                            const parsed = JSON.parse(part);
                            if (parsed && typeof parsed === 'object' && parsed.pic !== undefined) {
                                imported.push(parsed);
                            } else {
                                console.warn('Пропущен некорректный объект:', part);
                            }
                        } catch (err) {
                            console.warn('Ошибка парсинга JSON:', part);
                        }
                    }
                    if (imported.length > 0) {
                        cards = imported;
                        updateAll();
                        copyNotify.textContent = `✅ импортировано ${imported.length} карточек`;
                    } else {
                        alert('Не найдено валидных JSON объектов в файле');
                    }
                } catch (err) {
                    alert('Ошибка чтения файла: ' + err.message);
                }
                fileInput.value = ''; // сброс
            };
            reader.readAsText(file);
        });
        
        // ---------- сортировка по имени ----------
        sortBtn.addEventListener('click', () => {
            cards.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            updateAll();
            copyNotify.textContent = '🔄 карточки отсортированы';
            setTimeout(() => copyNotify.textContent = '', 1500);
        });
        
        // ---------- копировать сырые данные ----------
        copyRawBtn.addEventListener('click', () => {
            const raw = generateRawText();
            if (!raw) {
                copyNotify.textContent = '❌ нет данных';
                return;
            }
            navigator.clipboard.writeText(raw).then(() => {
                copyNotify.textContent = '📋 скопировано!';
                setTimeout(() => copyNotify.textContent = '', 1500);
            }).catch(() => {
                copyNotify.textContent = '❌ ошибка копирования';
            });
        });
        
        // инициализация с парой примеров (чтобы не было пусто)
        cards = [
            { pic: '🏠', name: 'Главная', des: 'домашняя страница', link: '/' },
            { pic: '📞', name: 'Контакты', des: 'как нас найти', link: '/contacts' },
        ];
        updateAll();
    })();
</script>
</body>
</html>
