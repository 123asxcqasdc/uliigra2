<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ули · Таблица рекордов Ули игры 2</title>
    <link rel="icon" type="image/png" href="/icon.png">
    
    <!-- META-ТЕГИ ДЛЯ ПРЕДПРОСМОТРА (ОБНОВЛЕНЫ) -->
    <meta property="og:title" content="Ули · Таблица рекордов Ули игры 2">
    <meta property="og:description" content="Лучшие игроки и их счёт 🐌🏆">
    <meta property="og:image" content="/preview-default.png">
    <meta property="og:url" content="https://uliigra2.c6t.ru/records">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Ули · Таблица рекордов Ули игры 2">
    <meta name="twitter:description" content="Лучшие игроки и их счёт 🐌🏆">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            background-color: #1b3b1b;
            background-image: radial-gradient(circle at 30% 40%, #2b5a2b 0%, #0e2f0e 90%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            color: #f0f7da;
            transition: all 0.2s ease;
        }

        /* декоративные гигантские улитки на фоне */
        body::before {
            content: "🐌🐌🐌";
            font-size: 8rem;
            position: absolute;
            top: 10px;
            left: 10px;
            opacity: 0.08;
            white-space: nowrap;
            transform: rotate(-10deg);
            pointer-events: none;
            letter-spacing: 2rem;
        }

        body::after {
            content: "🐌🐌🐌";
            font-size: 12rem;
            position: absolute;
            bottom: -20px;
            right: 0;
            opacity: 0.05;
            transform: rotate(15deg);
            pointer-events: none;
            white-space: nowrap;
        }

        /* ПОЛНОЭКРАННЫЙ РЕЖИМ (только таблица) */
        body.fullscreen-mode {
            padding: 0.5rem;
        }
        body.fullscreen-mode .main-container {
            padding: 1rem;
        }
        body.fullscreen-mode .dashboard {
            display: none;
        }
        body.fullscreen-mode .controls {
            margin-top: 1rem;
        }
        body.fullscreen-mode .footer-snails {
            margin-top: 1rem;
            padding-top: 0.8rem;
        }
        body.fullscreen-mode .record-item {
            padding: 12px 15px;
        }
        body.fullscreen-mode .record-score {
            font-size: 1.5rem;
        }

        /* главный контейнер - стиль как у страницы "УЛИ" */
        .main-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(30, 50, 30, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 3px solid #9bbc7b;
            border-radius: 30px;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.6), 0 0 0 2px #6f8c5d inset, 0 0 0 4px #3f6140 inset;
            padding: 2rem 2rem 1.8rem;
            transition: all 0.3s ease;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            font-size: 2.8rem;
            font-weight: 800;
            text-shadow: 3px 3px 0 #2d4a2d, 5px 5px 0 #1b331b;
            color: #e2f0c0;
            letter-spacing: 2px;
        }

        .snail-icon-big {
            font-size: 3.5rem;
            transform: rotate(10deg);
            transition: transform 0.2s;
            filter: drop-shadow(2px 4px 4px #0f2a0f);
        }

        .snail-icon-big:hover {
            transform: rotate(20deg) scale(1.1);
        }

        /* панель настроек + статистика */
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .settings-panel, .stats-panel {
            flex: 1;
            min-width: 260px;
            background: #2e4d2ecc;
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 1.2rem 1.5rem;
            border: 2px solid #7eaf7a;
            box-shadow: 0 8px 15px -7px #102310;
        }

        .panel-title {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            color: #ffefaa;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px dotted #8bb46c;
            padding-bottom: 0.4rem;
        }

        .setting-group {
            margin-bottom: 1.2rem;
        }

        .setting-label {
            font-size: 0.95rem;
            color: #dcedc4;
            display: block;
            margin-bottom: 6px;
        }

        .timer-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }

        .timer-value {
            font-size: 1.5rem;
            font-weight: bold;
            background: #1c3a1c;
            padding: 0.2rem 1rem;
            border-radius: 36px;
            min-width: 70px;
            text-align: center;
            color: #c8f0a5;
            border: 1px solid #9bbc7b;
        }

        .btn-timer {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: #5a875a;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px #0f2a0f;
        }

        .btn-timer:hover {
            background: #7caa7c;
            transform: scale(1.05);
        }

        .auto-refresh-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 54px;
            height: 28px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #5a5a5a;
            transition: .3s;
            border-radius: 34px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "🐌";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        input:checked + .toggle-slider {
            background: #6f9e6f;
        }
        input:checked + .toggle-slider:before {
            transform: translateX(26px);
            content: "🍃";
        }

        .timer-status {
            background: #234023;
            padding: 8px 12px;
            border-radius: 30px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #9bcd6c;
            animation: pulse 2s infinite;
        }
        .status-indicator.paused {
            background: #dba644;
            animation: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 12px;
        }
        .stat-item {
            background: #234823;
            padding: 10px;
            border-radius: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #d9ffa3;
        }
        .stat-label {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        /* ТАБЛИЦА РЕКОРДОВ */
        .leaderboard {
            background: rgba(20, 40, 20, 0.5);
            border-radius: 28px;
            padding: 0.8rem;
            margin: 1.2rem 0 0.8rem;
            border: 2px solid #7eaf7a;
        }

        .leaderboard-header {
            display: grid;
            grid-template-columns: 80px 1fr 140px;
            padding: 12px 20px;
            background: #3a623a;
            border-radius: 24px;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffe5a3;
        }

        .records-list {
            list-style: none;
        }

        .record-item {
            display: grid;
            grid-template-columns: 80px 1fr 140px;
            align-items: center;
            padding: 14px 20px;
            margin-bottom: 10px;
            background: #2b462bcc;
            border-radius: 24px;
            transition: all 0.2s;
            animation: fadeIn 0.3s ease;
        }

        .record-item.updated {
            animation: snailGlow 1s ease-out;
        }
        .record-score.changed {
            animation: scorePulse 0.6s ease-out;
        }

        .record-rank {
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
        }
        .top-1 .record-rank { color: #ffd966; text-shadow: 0 0 5px #b57c1c; }
        .top-2 .record-rank { color: #c0d0c0; text-shadow: 0 0 3px #8fbc8f; }
        .top-3 .record-rank { color: #cdb38c; text-shadow: 0 0 2px #aa8a5c; }

        .player-name {
            font-size: 1.3rem;
            font-weight: 600;
            padding-left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-1 .player-name { color: #ffea9e; }
        .top-2 .player-name { color: #e0f0d0; }
        .top-3 .player-name { color: #f5dbb1; }

        .record-score {
            text-align: right;
            font-size: 1.8rem;
            font-weight: bold;
            font-family: monospace;
            color: #c3f0a8;
            letter-spacing: 2px;
        }

        /* уведомление об обновлении */
        .update-toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #3f7540;
            border-left: 8px solid #f5c542;
            border-radius: 40px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px #0f2a0f;
            z-index: 999;
            transform: translateX(150%);
            transition: transform 0.3s ease;
        }
        .update-toast.show {
            transform: translateX(0);
        }
        .update-toast span:first-child { font-size: 1.6rem; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1.8rem 0 0.5rem;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            background: #5f8b5f;
            color: #faf7da;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }
        .btn:hover {
            background: #7caa7c;
            transform: translateY(-2px);
        }
        .btn-fullscreen {
            background: #b87c2e;
        }
        .btn-refresh {
            background: #3b6e3b;
        }

        .footer-snails {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            font-size: 2rem;
            opacity: 0.7;
            border-top: 2px dashed #61855e;
            padding-top: 1rem;
        }

        /* полноэкранные кнопки внутри таблицы */
        .fullscreen-controls {
            display: none;
            justify-content: center;
            gap: 12px;
            margin: 15px 0 5px;
            flex-wrap: wrap;
        }
        body.fullscreen-mode .fullscreen-controls {
            display: flex;
        }
        .fullscreen-btn {
            background: #417341;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.9rem;
            border: none;
            color: white;
            cursor: pointer;
        }

        @keyframes snailGlow {
            0% { background: #99cc66; transform: scale(1.01); box-shadow: 0 0 8px #b5ff9b; }
            100% { background: #2b462bcc; transform: scale(1); box-shadow: none; }
        }
        @keyframes scorePulse {
            0% { color: #ffd966; transform: scale(1.1); text-shadow: 0 0 6px gold; }
            100% { color: #c3f0a8; transform: scale(1); }
        }
        @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }

        @media (max-width: 680px) {
            .main-container { padding: 1.2rem; }
            .leaderboard-header, .record-item {
                grid-template-columns: 60px 1fr 100px;
                padding: 10px 12px;
            }
            .record-score { font-size: 1.3rem; }
            .player-name { font-size: 1rem; padding-left: 8px; }
            .header-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- ТАБЛИЦА ЛИДЕРОВ -->
    <div class="leaderboard">

        <div id="recordsContainer">
            <div style="text-align:center; padding:2rem;">🐌 загружаем ракушки...</div>
        </div>
        <!-- полноэкранные быстрые кнопки -->
        <div class="fullscreen-controls">
            <button class="fullscreen-btn" id="fsToggleBtn">⛶ обычный режим</button>
            <button class="fullscreen-btn" id="fsRefreshBtn">🔄 обновить</button>
            <button class="fullscreen-btn" id="fsAutoToggle">✅ авто: вкл</button>

    <div class="controls">
        <button class="btn btn-refresh" id="refreshBtn">🔄 обновить сейчас</button>
        <button class="btn" id="resetSettingsBtn">🍃 сбросить настройки</button>

    <div class="footer-snails">
        <span>🐌💚</span><span>🐌🐚</span><span>🍀🐌</span><span>🏆🐌</span>

</div>

<div id="updateToast" class="update-toast">
    <span>🐌✨</span>
    <span id="toastText">обновлено</span>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    // ---------- FIREBASE ----------
    const firebaseConfig = {
        apiKey: "AIzaSyDTx2Y9ctiWp26YeMmAHAxDZd_gVI_ZMdw",
        authDomain: "kcalls.firebaseapp.com",
        databaseURL: "https://kcalls-default-rtdb.firebaseio.com",
        projectId: "kcalls",
        storageBucket: "kcalls.firebasestorage.app",
        messagingSenderId: "990117089104",
        appId: "1:990117089104:web:278a42c037e975ebb76655",
        measurementId: "G-TK6GVEX9G5"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Глобальные переменные
    let currentRecords = [];         
    let lastDataHash = '';
    let autoInterval = null;
    let refreshSec = 10;            // секунды
    let autoEnabled = true;
    let fullscreen = false;
    let updateTimeout = null;

    // DOM элементы
    const container = document.getElementById('recordsContainer');
    const timerSpan = document.getElementById('timerValue');
    const fsTimerSpan = document.getElementById('fsTimerSpan');
    const currentTimerSpan = document.getElementById('currentTimerValue');
    const lastUpdateSpan = document.getElementById('lastUpdateTime');
    const autoToggle = document.getElementById('autoRefreshToggle');
    const statusLed = document.getElementById('statusLed');
    const statusTextSpan = document.getElementById('statusText');
    const totalPlayersSpan = document.getElementById('totalPlayers');
    const totalRecordsSpan = document.getElementById('totalRecords');
    const topScoreSpan = document.getElementById('topScore');
    const avgScoreSpan = document.getElementById('avgScore');
    const toast = document.getElementById('updateToast');
    const toastText = document.getElementById('toastText');
    
    // helpers
    function showToast(message, changes = 0) {
        toastText.innerHTML = changes ? `🐌 обновлено ${changes} записей` : message;
        toast.classList.add('show');
        if (updateTimeout) clearTimeout(updateTimeout);
        updateTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2200);
    }

    function getDataHash(data) {
        if (!data) return 'empty';
        return btoa(encodeURIComponent(JSON.stringify(data)));
    }

    // парсим строку с разделителем "!"
    function parseRecordsFromRaw(rawData) {
        if (!rawData) return [];
        const parts = rawData.split('!').filter(p => p.trim() !== '');
        const items = [];
        for (let p of parts) {
            try {
                const obj = JSON.parse(p.trim());
                if (obj && typeof obj === 'object') items.push(obj);
            } catch(e) { console.warn("json fail", p); }
        }
        return items;
    }

    // вычисление изменений и обновление UI с анимацией
    function updateUIWithAnimation(newRecords) {
        if (!newRecords.length) {
            container.innerHTML = '<div style="text-align:center; padding:2rem;">🍂 пока нет рекордов, стань первым 🐌</div>';
            updateStatistics([]);
            return;
        }
        // сортировка по value (число)
        const sorted = [...newRecords].sort((a,b) => (parseInt(b.value||0) - parseInt(a.value||0)));
        
        // сравниваем с текущими записями для анимации
        const oldMap = new Map();
        currentRecords.forEach(r => { oldMap.set(r.player, parseInt(r.value||0)); });
        
        let html = '<ul class="records-list">';
        const changedPlayers = new Set();
        // определим, у кого изменился счёт или позиция
        for (let i=0; i<sorted.length; i++) {
            const rec = sorted[i];
            const oldScore = oldMap.get(rec.player);
            const newScore = parseInt(rec.value||0);
            if (oldScore !== undefined && oldScore !== newScore) changedPlayers.add(rec.player);
            else if (oldScore === undefined) changedPlayers.add(rec.player); // новый игрок
        }
        // также проверим изменения ранга (если старый игрок сменил место)
        const oldOrder = currentRecords.map(r=>r.player);
        for(let i=0;i<sorted.length && i<oldOrder.length;i++) {
            if(sorted[i].player !== oldOrder[i]) changedPlayers.add(sorted[i].player);
        }

        for (let idx=0; idx<sorted.length; idx++) {
            const rec = sorted[idx];
            const rank = idx+1;
            const name = rec.player || "Аноним";
            const scoreVal = parseInt(rec.value||0);
            const formatted = scoreVal.toLocaleString('ru-RU');
            let rankClass = '';
            if (rank===1) rankClass='top-1';
            else if (rank===2) rankClass='top-2';
            else if (rank===3) rankClass='top-3';
            const isUpdated = changedPlayers.has(rec.player);
            html += `<li class="record-item ${rankClass} ${isUpdated ? 'updated' : ''}">
                        <div class="record-rank">${rank}</div>
                        <div class="player-name">${escapeHtml(name)}</div>
                        <div class="record-score ${isUpdated ? 'changed' : ''}">${formatted}</div>
                     </li>`;
        }
        html += '</ul>';
        container.innerHTML = html;
        currentRecords = sorted;
        updateStatistics(sorted);
        if (changedPlayers.size > 0) showToast('', changedPlayers.size);
        else showToast('🍃 данные не изменились', 0);
    }

    function updateStatistics(records) {
        if (!records.length) {
            totalPlayersSpan.innerText = '0'; totalRecordsSpan.innerText = '0';
            topScoreSpan.innerText = '0'; avgScoreSpan.innerText = '0';
            return;
        }
        const unique = new Set(records.map(r=>r.player));
        totalPlayersSpan.innerText = unique.size;
        totalRecordsSpan.innerText = records.length;
        const maxScore = Math.max(...records.map(r=>parseInt(r.value||0)));
        topScoreSpan.innerText = maxScore.toLocaleString();
        const sum = records.reduce((s,r)=>s+parseInt(r.value||0),0);
        avgScoreSpan.innerText = Math.round(sum/records.length).toLocaleString();
    }

    function escapeHtml(str) { 
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // загрузка из firebase (с умным сравнением)
    function loadRecordsAndUpdate() {
        database.ref('records').once('value').then(snap => {
            const raw = snap.val();
            const newHash = getDataHash(raw);
            if (newHash === lastDataHash && lastDataHash !== '') {
                // без изменений, просто обновим время
                const now = new Date().toLocaleTimeString('ru-RU');
                lastUpdateSpan.innerText = now;
                return;
            }
            const recordsList = parseRecordsFromRaw(raw);
            updateUIWithAnimation(recordsList);
            lastDataHash = newHash;
            const now = new Date().toLocaleTimeString('ru-RU');
            lastUpdateSpan.innerText = now;
        }).catch(err => {
            console.error(err);
            container.innerHTML = '<div style="padding:2rem;text-align:center;">🐌 ошибка загрузки ракушек 🍂</div>';
        });
    }

    // автоперезапуск интервала
    function restartAutoRefresh() {
        if (autoInterval) clearInterval(autoInterval);
        if (autoEnabled) {
            autoInterval = setInterval(() => {
                loadRecordsAndUpdate();
            }, refreshSec * 1000);
        }
    }

    function setRefreshInterval(sec) {
        if (sec < 5) sec = 5;
        if (sec > 60) sec = 60;
        refreshSec = sec;
        localStorage.setItem('snail_records_interval', refreshSec);
        timerSpan.innerText = refreshSec;
        if (fsTimerSpan) fsTimerSpan.innerText = refreshSec;
        if (currentTimerSpan) currentTimerSpan.innerText = refreshSec;
        restartAutoRefresh();
    }

    function toggleAutoMode(enable) {
        autoEnabled = enable;
        localStorage.setItem('snail_records_auto', autoEnabled);
        autoToggle.checked = autoEnabled;
        if (autoEnabled) {
            statusLed.classList.remove('paused');
            statusTextSpan.innerText = 'активно';
            restartAutoRefresh();
        } else {
            if (autoInterval) clearInterval(autoInterval);
            statusLed.classList.add('paused');
            statusTextSpan.innerText = 'пауза';
        }
        const fsAutoBtn = document.getElementById('fsAutoToggle');
        if (fsAutoBtn) fsAutoBtn.innerHTML = autoEnabled ? '✅ авто: вкл' : '❌ авто: выкл';
    }

    function toggleFullscreenMode() {
        fullscreen = !fullscreen;
        if (fullscreen) document.body.classList.add('fullscreen-mode');
        else document.body.classList.remove('fullscreen-mode');
        localStorage.setItem('snail_records_fullscreen', fullscreen);
        const fsBtn = document.getElementById('fsToggleBtn');
        if (fsBtn) fsBtn.innerHTML = fullscreen ? '⛶ обычный режим' : '⬜ полный экран';
        const enterBtn = document.getElementById('enterFullscreenBtn');
        if (enterBtn) enterBtn.innerHTML = fullscreen ? '⬜ обычный вид' : '⛶ полный экран';
    }

    function resetSettings() {
        if (confirm('🍂 вернуть настройки улитки по умолчанию?')) {
            refreshSec = 10;
            autoEnabled = true;
            fullscreen = false;
            localStorage.removeItem('snail_records_interval');
            localStorage.removeItem('snail_records_auto');
            localStorage.removeItem('snail_records_fullscreen');
            setRefreshInterval(10);
            toggleAutoMode(true);
            if (document.body.classList.contains('fullscreen-mode')) document.body.classList.remove('fullscreen-mode');
            fullscreen = false;
            const fsBtn = document.getElementById('fsToggleBtn');
            if (fsBtn) fsBtn.innerHTML = '⛶ обычный режим';
            const enterBtn = document.getElementById('enterFullscreenBtn');
            if (enterBtn) enterBtn.innerHTML = '⛶ полный экран';
        }
    }

    // слушатель реального времени firebase (только если данные реально поменялись)
    database.ref('records').on('value', (snap) => {
        const raw = snap.val();
        const newHash = getDataHash(raw);
        if (newHash !== lastDataHash || lastDataHash === '') {
            const recordsList = parseRecordsFromRaw(raw);
            updateUIWithAnimation(recordsList);
            lastDataHash = newHash;
            const now = new Date().toLocaleTimeString('ru-RU');
            lastUpdateSpan.innerText = now;
        } else {
            const now = new Date().toLocaleTimeString('ru-RU');
            lastUpdateSpan.innerText = now;
        }
    });

    // ИНИЦИАЛИЗАЦИЯ
    (function init() {
        const savedInterval = localStorage.getItem('snail_records_interval');
        if (savedInterval) refreshSec = parseInt(savedInterval);
        const savedAuto = localStorage.getItem('snail_records_auto');
        if (savedAuto !== null) autoEnabled = savedAuto === 'true';
        const savedFs = localStorage.getItem('snail_records_fullscreen');
        if (savedFs === 'true') fullscreen = true;
        
        timerSpan.innerText = refreshSec;
        if (fsTimerSpan) fsTimerSpan.innerText = refreshSec;
        if (currentTimerSpan) currentTimerSpan.innerText = refreshSec;
        autoToggle.checked = autoEnabled;
        if (fullscreen) document.body.classList.add('fullscreen-mode');
        toggleAutoMode(autoEnabled);
        setRefreshInterval(refreshSec);
        loadRecordsAndUpdate();

        // обработчики кнопок
        document.getElementById('timerMinus5').onclick = () => setRefreshInterval(refreshSec-5);
        document.getElementById('timerMinus1').onclick = () => setRefreshInterval(refreshSec-1);
        document.getElementById('timerPlus1').onclick = () => setRefreshInterval(refreshSec+1);
        document.getElementById('timerPlus5').onclick = () => setRefreshInterval(refreshSec+5);
        autoToggle.addEventListener('change', (e) => toggleAutoMode(e.target.checked));
        document.getElementById('refreshBtn').onclick = () => loadRecordsAndUpdate();
        document.getElementById('resetSettingsBtn').onclick = resetSettings;
        document.getElementById('enterFullscreenBtn').onclick = toggleFullscreenMode;
        const fsToggle = document.getElementById('fsToggleBtn');
        if (fsToggle) fsToggle.onclick = toggleFullscreenMode;
        const fsRefresh = document.getElementById('fsRefreshBtn');
        if (fsRefresh) fsRefresh.onclick = () => loadRecordsAndUpdate();
        const fsAutoBtn = document.getElementById('fsAutoToggle');
        if (fsAutoBtn) fsAutoBtn.onclick = () => toggleAutoMode(!autoEnabled);
    })();
</script>
</body>
</html>
