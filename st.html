    <style>

<body>

    <div class="main-container">
        <!-- ШАПКА -->
        <div class="header">

            </div>
            <div class="header-controls">
                <button class="btn" id="refreshBtn">🔄 обновить</button>
                <a href="https://uliigra2.c6t.ru/home" class="btn btn-green">🏠 на главную</a>

        <!-- КОНТЕЙНЕР -->
        <div id="contentContainer">
            <div class="loading-message">
                <span style="font-size:2rem;">🐌</span> загрузка статей...
            </div>
        </div>

        <!-- ПОДВАЛ -->
        <div class="footer-snails">
            <span>🐌</span><span>📄</span><span>🐌</span><span>🐚</span><span>🐌</span><span>🍀🐌</span>
        </div>
    </div>

    <script>
        // ============================================================
        //  FIREBASE КОНФИГ
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDTx2Y9ctiWp26YeMmAHAxDZd_gVI_ZMdw",
            authDomain: "kcalls.firebaseapp.com",
            databaseURL: "https://kcalls-default-rtdb.firebaseio.com",
            projectId: "kcalls",
            storageBucket: "kcalls.firebasestorage.app",
            messagingSenderId: "990117089104",
            appId: "1:990117089104:web:278a42c037e975ebb76655",
            measurementId: "G-TK6GVEX9G5"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================
        //  ПАРСЕР MARKDOWN → HTML (ПОЛНОСТЬЮ ПЕРЕПИСАН)
        // ============================================================
        function markdownToHtml(md) {
            if (!md) return '';

            // Разбиваем на строки
            let lines = md.split('\n');
            let result = [];
            let inCodeBlock = false;
            let codeBlockContent = [];
            let inList = false;
            let listItems = [];

            function flushList() {
                if (listItems.length > 0) {
                    result.push('<ul>');
                    listItems.forEach(item => {
                        // Обрабатываем вложенный Markdown внутри списка
                        result.push('<li>' + processInline(item) + '</li>');
                    });
                    result.push('</ul>');
                    listItems = [];
                    inList = false;
                }
            }

            function processInline(text) {
                // Жирный
                text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                // Курсив
                text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
                // Зачёркивание
                text = text.replace(/~~(.+?)~~/g, '<del>$1</del>');
                // Инлайн-код
                text = text.replace(/`([^`]+)`/g, function(match, code) {
                    return '<code>' + code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Ссылки
                text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
                // Изображения (ОСНОВНОЕ — работают!)
                text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(match, alt, url) {
                    const ext = url.split('.').pop().toLowerCase();
                    const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico'].includes(ext);
                    const isAudio = ['mp3', 'wav', 'ogg', 'm4a', 'flac'].includes(ext);
                    const isVideo = ['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv'].includes(ext);

                    if (isImage) {
                        return `<img src="${url}" alt="${alt || ''}" loading="lazy" />`;
                    } else if (isAudio) {
                        return `<audio controls><source src="${url}" /></audio>`;
                    } else if (isVideo) {
                        return `<video controls><source src="${url}" /></video>`;
                    } else {
                        return `<a href="${url}" target="_blank" rel="noopener">${alt || url}</a>`;
                    }
                });
                return text;
            }

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];

                // --- Блоки кода ---
                if (line.trim().startsWith('```')) {
                    if (!inCodeBlock) {
                        flushList();
                        inCodeBlock = true;
                        codeBlockContent = [];
                        continue;
                    } else {
                        inCodeBlock = false;
                        let code = codeBlockContent.join('\n');
                        let escaped = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        result.push('<pre><code class="language-plaintext">' + escaped + '</code></pre>');
                        continue;
                    }
                }

                if (inCodeBlock) {
                    codeBlockContent.push(line);
                    continue;
                }

                // --- Пустые строки ---
                if (line.trim() === '') {
                    flushList();
                    continue;
                }

                // --- Заголовки ---
                if (line.match(/^#{1,3}\s/)) {
                    flushList();
                    let match = line.match(/^(#{1,3})\s+(.*)/);
                    if (match) {
                        let level = match[1].length;
                        let text = processInline(match[2]);
                        result.push('<h' + level + '>' + text + '</h' + level + '>');
                    }
                    continue;
                }

                // --- Цитаты ---
                if (line.match(/^>\s/)) {
                    flushList();
                    let text = line.replace(/^>\s/, '');
                    result.push('<blockquote>' + processInline(text) + '</blockquote>');
                    continue;
                }

                // --- Горизонтальная линия ---
                if (line.match(/^---$/)) {
                    flushList();
                    result.push('<hr />');
                    continue;
                }

                // --- Списки ---
                if (line.match(/^[-+]\s/)) {
                    let text = line.replace(/^[-+]\s/, '');
                    if (!inList) {
                        inList = true;
                        listItems = [];
                    }
                    listItems.push(text);
                    continue;
                }

                // --- Обычный текст (абзац) ---
                flushList();
                result.push('<p>' + processInline(line) + '</p>');
            }

            // Закрываем последний список
            flushList();

            return result.join('\n');
        }

        // ============================================================
        //  ОБРЕЗКА ТЕКСТА ДЛЯ ПРЕВЬЮ
        // ============================================================
        function truncateText(text, maxLength = 120) {
            if (!text) return '';
            // Убираем Markdown-символы
            const plain = text.replace(/[#*`>\[\]()!\-+]/g, '').trim();
            if (plain.length <= maxLength) return plain;
            return plain.substring(0, maxLength) + '...';
        }

        // ============================================================
        //  ОТОБРАЖЕНИЕ СПИСКА СТАТЕЙ
        // ============================================================
        function renderArticleList(articles) {
            const container = document.getElementById('contentContainer');

            if (!articles || articles.length === 0) {
                container.innerHTML = `
                            <div class="empty-message">
                                <span class="big-snail">🐌📭</span>
                                пока нет статей
                            </div>
                        `;
                return;
            }

            let html = '<div class="articles-grid">';
            const sorted = [...articles].sort((a, b) => {
                const da = a.createdAt || a.date || '';
                const db_ = b.createdAt || b.date || '';
                return da < db_ ? 1 : -1;
            });

            for (const article of sorted) {
                const title = article.title || 'Без названия';
                const emoji = article.emoji || '🐌';
                const date = article.date || article.createdAt || '';
                const author = article.author || 'Ули';
                const tags = article.tags || [];
                const cover = article.cover || '';
                const excerpt = truncateText(article.content || '', 150);

                let coverHtml = '';
                if (cover) {
                    coverHtml = `<img src="${cover}" alt="${title}" class="preview-cover" loading="lazy" onerror="this.style.display='none'" />`;
                }

                let tagsHtml = tags.map(t => `<span class="tag">#${t}</span>`).join('');

                html += `
                            <div class="article-preview" onclick="openArticle('${article.id}')">
                                ${coverHtml}
                                <div class="preview-title">${emoji} ${title}</div>
                                <div class="preview-meta">📅 ${date} · ✍️ ${author}</div>
                                <div class="preview-excerpt">${excerpt}</div>
                                ${tagsHtml ? `<div class="preview-tags">${tagsHtml}</div>` : ''}
                            </div>
                        `;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        // ============================================================
        //  ОТОБРАЖЕНИЕ ОДНОЙ СТАТЬИ (полная страница)
        // ============================================================
        function renderSingleArticle(article) {
            const container = document.getElementById('contentContainer');

            const title = article.title || 'Без названия';
            const content = article.content || '';
            const date = article.date || article.createdAt || '';
            const author = article.author || 'Ули';
            const tags = article.tags || [];
            const files = article.files || [];
            const emoji = article.emoji || '🐌';
            const cover = article.cover || '';

            const contentHtml = markdownToHtml(content);

            let coverHtml = '';
            if (cover) {
                coverHtml = `<img src="${cover}" alt="${title}" class="article-cover" loading="lazy" onerror="this.style.display='none'" />`;
            }

            let tagsHtml = tags.map(t => `<span class="tag">#${t}</span>`).join('');

            let filesHtml = '';
            if (files.length > 0) {
                filesHtml = '<div class="article-files">';
                for (const f of files) {
                    const url = f.url || '#';
                    const name = f.name || 'файл';
                    const icon = f.icon || '📎';
                    filesHtml += `<a href="${url}" class="file-link" target="_blank" rel="noopener">${icon} ${name}</a>`;
                }
                filesHtml += '</div>';
            }

            document.title = `SnailTail · ${title}`;

            container.innerHTML = `
                        <div class="article-full">
                            <a href="https://uliigra2.c6t.ru/st" class="back-link">← ко всем статьям</a>
                            ${coverHtml}
                            <div class="article-title">${emoji} ${title}</div>
                            <div class="article-meta">
                                <span>📅 ${date}</span>
                                <span>✍️ ${author}</span>
                            </div>
                            <div class="article-content">${contentHtml}</div>
                            ${filesHtml}
                            ${tagsHtml ? `<div class="article-tags">${tagsHtml}</div>` : ''}
                            <a href="https://uliigra2.c6t.ru/st" class="back-link" style="margin-top:1.5rem;">← ко всем статьям</a>
                        </div>
                    `;

            if (typeof hljs !== 'undefined') {
                document.querySelectorAll('pre code').forEach(el => {
                    hljs.highlightElement(el);
                });
            }
        }

        // ============================================================
        //  ОТКРЫТИЕ СТАТЬИ
        // ============================================================
        function openArticle(id) {
            window.location.href = `https://uliigra2.c6t.ru/st?id=${id}`;
        }

        // ============================================================
        //  ЗАГРУЗКА ДАННЫХ
        // ============================================================
        function loadArticles() {
            const container = document.getElementById('contentContainer');
            const params = new URLSearchParams(window.location.search);
            const articleId = params.get('id');

            if (articleId) {
                container.innerHTML = `
                            <div class="loading-message">
                                <span style="font-size:2rem;">🐌</span> загрузка статьи...
                            </div>
                        `;

                db.collection('articles').doc(articleId).get()
                    .then(doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.createdAt && data.createdAt.toDate) {
                                data.createdAt = data.createdAt.toDate().toLocaleDateString('ru-RU', {
                                    day: '2-digit',
                                    month: '2-digit',
                                    year: 'numeric'
                                });
                            }
                            if (!data.date && data.createdAt) {
                                data.date = data.createdAt;
                            }
                            renderSingleArticle({ id: doc.id, ...data });
                        } else {
                            container.innerHTML = `
                                        <div style="text-align:center; padding:2rem; background:#2e4d2e; border-radius:24px; border:2px solid #d08a8a;">
                                            <div style="font-size:3rem;">🐌❓</div>
                                            <h2 style="color:#fcfad6; margin:1rem 0;">статья не найдена</h2>
                                            <a href="https://uliigra2.c6t.ru/st" class="back-link">← ко всем статьям</a>
                                        </div>
                                    `;
                            document.title = 'SnailTail · статья не найдена';
                        }
                    })
                    .catch(error => {
                        container.innerHTML = `
                                    <div class="empty-message" style="color:#e8c8a0;">
                                        <span class="big-snail">🐌💔</span>
                                        ошибка загрузки: ${error.message}<br>
                                        <button class="btn" style="margin-top:1rem;" onclick="loadArticles()">🔄 попробовать снова</button>
                                    </div>
                                `;
                    });
                return;
            }

            container.innerHTML = `
                        <div class="loading-message">
                            <span style="font-size:2rem;">🐌</span> загрузка статей...
                        </div>
                    `;

            db.collection('articles')
                .orderBy('createdAt', 'desc')
                .get()
                .then(snapshot => {
                    if (snapshot.empty) {
                        renderArticleList([]);
                        return;
                    }

                    const articles = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (data.createdAt && data.createdAt.toDate) {
                            data.createdAt = data.createdAt.toDate().toLocaleDateString('ru-RU', {
                                day: '2-digit',
                                month: '2-digit',
                                year: 'numeric'
                            });
                        }
                        if (!data.date && data.createdAt) {
                            data.date = data.createdAt;
                        }
                        articles.push({ id: doc.id, ...data });
                    });

                    renderArticleList(articles);
                    document.title = 'SnailTail · статьи';
                })
                .catch(error => {
                    console.error('Ошибка загрузки:', error);
                    container.innerHTML = `
                                <div class="empty-message" style="color:#e8c8a0;">
                                    <span class="big-snail">🐌💔</span>
                                    ошибка загрузки: ${error.message}<br>
                                    <button class="btn" style="margin-top:1rem;" onclick="loadArticles()">🔄 попробовать снова</button>
                                </div>
                            `;
                });
        }

        // ============================================================
        //  ЗАПУСК
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadArticles();

            document.getElementById('refreshBtn').addEventListener('click', function() {
                loadArticles();
            });
        });

        window.loadArticles = loadArticles;
        window.openArticle = openArticle;
    </script>

</body>
</html>
