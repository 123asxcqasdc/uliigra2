<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="/icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор разноцветной SVG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        h1 {
            color: #764ba2;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .color-control {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .color-control:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border-color: #764ba2;
        }

        .color-control label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #495057;
            font-size: 1.1em;
        }

        .color-picker {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-picker:hover {
            transform: scale(1.05);
        }

        .preview {
            text-align: center;
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .svg-container {
            width: 300px;
            height: 300px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #e9ecef;
            color: #495057;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(-1px);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .svg-container {
                width: 250px;
                height: 250px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .svg-container {
                width: 200px;
                height: 200px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 Генератор разноцветной SVG картинки</h1>
            <p class="subtitle">Настройте цвета SVG и скачайте результат</p>
        </header>

        <div class="main-content">
            <div class="controls">
                <div class="color-control">
                    <label for="color1">Основной цвет (фиолетовый)</label>
                    <input type="color" id="color1" class="color-picker" value="#9266CC">
                </div>
                
                <div class="color-control">
                    <label for="color2">Второстепенный цвет (светло-фиолетовый)</label>
                    <input type="color" id="color2" class="color-picker" value="#AA8DD8">
                </div>
                
                <div class="color-control">
                    <label for="color3">Желтый основной</label>
                    <input type="color" id="color3" class="color-picker" value="#FFCC4D">
                </div>
                
                <div class="color-control">
                    <label for="color4">Оранжевый акцент</label>
                    <input type="color" id="color4" class="color-picker" value="#FFAC33">
                </div>
            </div>

            <div class="preview">
                <h3>Предпросмотр</h3>
                <div class="svg-container">
                    <svg id="svgPreview" width="100%" height="100%" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
                        <!-- SVG будет вставлен здесь -->
                    </svg>
                </div>
                
                <div class="actions">
                    <button onclick="updateSVG()" class="btn-primary">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"/>
                        </svg>
                        Обновить
                    </button>
                    <button onclick="downloadSVG()" class="btn-secondary">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z"/>
                        </svg>
                        Скачать SVG
                    </button>
                    <button onclick="randomizeColors()" class="btn-secondary">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                            <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S2.732 14.057 1.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                        </svg>
                        Случайные цвета
                    </button>
                </div>
            </div>
        </div>

        <footer>
            <p>Генератор SVG для TurboWarp • Создано с помощью ❤️</p>
            <p>Исходная SVG картинка может быть использована для любых целей</p>
        </footer>
    </div>

    <script>
        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            updateSVG();
        });

        // Функция обновления SVG
        function updateSVG() {
            const color1 = document.getElementById('color1').value;
            const color2 = document.getElementById('color2').value;
            const color3 = document.getElementById('color3').value;
            const color4 = document.getElementById('color4').value;

            // Создаем новый SVG с обновленными цветами
            const svgContent = `
                <path fill="${color1}" d="M9 15.561c0-4 2-8 0-10s-3 2-2 2c1.414 0 2 2 1 5s1 3.999 1 3zm-3.875 0c0-4 2-8 0-10s-3 2-2 2c1.414 0 2 2 1 5s1 3.999 1 3z"></path>
                <path fill="${color2}" d="M36 34.936c0 1-1 1-2 1H11c-5 0-7.272-3.09-8-6c-1-4 2-11 0-12s-3-1-3-3s4.47-5.265 7-4c4 2 2.767 6.932 2 10c-.88 3.522 1.115 3.594 5 5c4.94 1.787 12.32 4.44 14 5c3 1 8 3 8 4z"></path>
                <path fill="${color3}" d="M10.925 24.935c2.887 1 3.849 9 13.472 9c6.377 0 8.66-5.479 8.66-11c0-5.523-5.17-10-11.547-10c-6.377.001-11.498 11.684-10.585 12z"></path>
                <path fill="${color4}" d="M24.914 33.938c1.708 0 3.389-.48 4.892-1.418c2.185-1.361 3.729-3.527 4.348-6.098c1.53-6.363-2.206-12.834-8.329-14.425c-7.393-1.923-14.919 2.768-16.768 10.455c-.258 1.072.369 2.158 1.399 2.426c1.027.271 2.076-.383 2.335-1.455c1.334-5.546 6.761-8.93 12.1-7.544c4.063 1.056 6.544 5.351 5.528 9.574c-.369 1.533-1.29 2.826-2.594 3.639a5.473 5.473 0 0 1-4.311.666a4.151 4.151 0 0 1-2.564-1.973a4.454 4.454 0 0 1-.469-3.281a3.037 3.037 0 0 1 1.344-1.887c.676-.421 1.527-.707 2.234-.345c1.298.665 1.298 2.665.336 3.665c-.752.781 1.604 1.065 2.887 0c1.15-.955 1.645-2.492 1.068-4.199c-.581-1.724-1.805-2.942-3.358-3.347a6.53 6.53 0 0 0-5.148.797c-1.557.971-2.657 2.515-3.098 4.347a8.559 8.559 0 0 0 .903 6.307c1.103 1.91 2.853 3.258 4.931 3.797a9.38 9.38 0 0 0 2.334.299z"></path>
            `;

            // Обновляем предпросмотр
            document.getElementById('svgPreview').innerHTML = svgContent;
        }

        // Функция скачивания SVG
        function downloadSVG() {
            const color1 = document.getElementById('color1').value;
            const color2 = document.getElementById('color2').value;
            const color3 = document.getElementById('color3').value;
            const color4 = document.getElementById('color4').value;

            // Создаем полный SVG файл
            const svgContent = `<?xml version="1.0" encoding="utf-8"?>
<svg width="800px" height="800px" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--twemoji" preserveAspectRatio="xMidYMid meet">
    <path fill="${color1}" d="M9 15.561c0-4 2-8 0-10s-3 2-2 2c1.414 0 2 2 1 5s1 3.999 1 3zm-3.875 0c0-4 2-8 0-10s-3 2-2 2c1.414 0 2 2 1 5s1 3.999 1 3z"></path>
    <path fill="${color2}" d="M36 34.936c0 1-1 1-2 1H11c-5 0-7.272-3.09-8-6c-1-4 2-11 0-12s-3-1-3-3s4.47-5.265 7-4c4 2 2.767 6.932 2 10c-.88 3.522 1.115 3.594 5 5c4.94 1.787 12.32 4.44 14 5c3 1 8 3 8 4z"></path>
    <path fill="${color3}" d="M10.925 24.935c2.887 1 3.849 9 13.472 9c6.377 0 8.66-5.479 8.66-11c0-5.523-5.17-10-11.547-10c-6.377.001-11.498 11.684-10.585 12z"></path>
    <path fill="${color4}" d="M24.914 33.938c1.708 0 3.389-.48 4.892-1.418c2.185-1.361 3.729-3.527 4.348-6.098c1.53-6.363-2.206-12.834-8.329-14.425c-7.393-1.923-14.919 2.768-16.768 10.455c-.258 1.072.369 2.158 1.399 2.426c1.027.271 2.076-.383 2.335-1.455c1.334-5.546 6.761-8.93 12.1-7.544c4.063 1.056 6.544 5.351 5.528 9.574c-.369 1.533-1.29 2.826-2.594 3.639a5.473 5.473 0 0 1-4.311.666a4.151 4.151 0 0 1-2.564-1.973a4.454 4.454 0 0 1-.469-3.281a3.037 3.037 0 0 1 1.344-1.887c.676-.421 1.527-.707 2.234-.345c1.298.665 1.298 2.665.336 3.665c-.752.781 1.604 1.065 2.887 0c1.15-.955 1.645-2.492 1.068-4.199c-.581-1.724-1.805-2.942-3.358-3.347a6.53 6.53 0 0 0-5.148.797c-1.557.971-2.657 2.515-3.098 4.347a8.559 8.559 0 0 0 .903 6.307c1.103 1.91 2.853 3.258 4.931 3.797a9.38 9.38 0 0 0 2.334.299z"></path>
</svg>`;

            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'custom-svg-image.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            // Показываем уведомление
            alert('SVG файл скачан!');
        }

        // Функция для случайных цветов
        function randomizeColors() {
            function randomColor() {
                return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
            }
            
            document.getElementById('color1').value = randomColor();
            document.getElementById('color2').value = randomColor();
            document.getElementById('color3').value = randomColor();
            document.getElementById('color4').value = randomColor();
            
            updateSVG();
        }

        // Обновляем SVG при изменении цветов
        document.querySelectorAll('.color-picker').forEach(picker => {
            picker.addEventListener('input', updateSVG);
        });
    </script>
</body>
</html>
