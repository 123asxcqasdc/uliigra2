<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ули · Генератор улиток</title>
    
    <!-- ФАВИКОНКА -->
    <link rel="icon" type="image/png" href="/icon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background-color: #1b3b1b;
            background-image: radial-gradient(circle at 30% 40%, #2b5a2b 0%, #0e2f0e 90%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
            color: #f0f7da;
        }

        body::before {
            content: "🐌🐌🐌";
            font-size: 8rem;
            position: absolute;
            top: 10px;
            left: 10px;
            opacity: 0.08;
            white-space: nowrap;
            transform: rotate(-10deg);
            pointer-events: none;
            letter-spacing: 2rem;
        }

        body::after {
            content: "🐌🐌🐌";
            font-size: 12rem;
            position: absolute;
            bottom: -20px;
            right: 0;
            opacity: 0.05;
            transform: rotate(15deg);
            pointer-events: none;
            white-space: nowrap;
        }

        .main-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(30, 50, 30, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 3px solid #9bbc7b;
            border-radius: 30px;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.6), 0 0 0 2px #6f8c5d inset, 0 0 0 4px #3f6140 inset;
            padding: 2rem 2rem 2.5rem;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem 1.2rem;
            flex-wrap: wrap;
            margin-bottom: 1.8rem;
            font-size: 2.8rem;
            font-weight: 800;
            text-shadow: 3px 3px 0 #2d4a2d, 5px 5px 0 #1b331b;
            color: #e2f0c0;
            letter-spacing: 2px;
        }

        .snail-icon-big {
            font-size: 3.2rem;
            transform: rotate(15deg);
            transition: transform 0.2s;
            filter: drop-shadow(2px 4px 4px #0f2a0f);
        }

        .snail-icon-big:hover {
            transform: rotate(25deg) scale(1.1);
        }

        .generator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin: 1.5rem 0;
        }

        @media (max-width: 700px) {
            .generator-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .main-container {
                padding: 1.5rem;
            }
            .header-title {
                font-size: 2rem;
            }
        }

        /* блок управления цветами */
        .colors-panel {
            background: #2e4d2e;
            border: 2px solid #7eaf7a;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 8px 15px -5px #102310, 0 0 0 2px #a7c8a3 inset;
        }

        .colors-panel h3 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.2rem;
            color: #fcfad6;
            border-bottom: 2px dotted #8bb46c;
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            background: #385f38;
            padding: 0.8rem 1rem;
            border-radius: 20px;
            margin-bottom: 1rem;
            border: 1px solid #8ab47a;
        }

        .color-row label {
            font-weight: 600;
            font-size: 0.95rem;
            flex: 1;
            min-width: 120px;
        }

        .color-preview {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            border: 2px solid #c7e9a8;
            box-shadow: 0 2px 6px black;
        }

        .color-input {
            width: 80px;
            height: 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #1e331e;
            border: 2px solid #9bbc7b;
        }

        .color-hex {
            background: #1e331e;
            border: 1px solid #7eaf7a;
            border-radius: 20px;
            padding: 0.3rem 0.8rem;
            font-family: monospace;
            font-size: 0.85rem;
            color: #dcedc4;
            width: 85px;
            text-align: center;
        }

        /* кнопки */
        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .snail-btn {
            background: #a3c4a3;
            color: #1b3f1b;
            border: none;
            font-weight: 700;
            padding: 0.7rem 1.5rem;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.15s;
            border: 2px solid #d6f0be;
            box-shadow: 0 4px 0 #446d44;
        }

        .snail-btn:hover {
            background: #c3e6b3;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #2f542f;
        }

        .snail-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #2f542f;
        }

        /* блок предпросмотра */
        .preview-panel {
            background: #2e4d2e;
            border: 2px solid #7eaf7a;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 8px 15px -5px #102310, 0 0 0 2px #a7c8a3 inset;
            display: flex;
            flex-direction: column;
        }

        .preview-panel h3 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1rem;
            color: #fcfad6;
            border-bottom: 2px dotted #8bb46c;
            padding-bottom: 0.5rem;
        }

        .svg-preview-box {
            background: #f0f5ea;
            border-radius: 20px;
            padding: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
            border: 3px solid #9bbc7b;
            margin-bottom: 1rem;
        }

        .svg-preview-box svg {
            max-width: 220px;
            max-height: 220px;
            width: auto;
            height: auto;
        }

        .download-info {
            text-align: center;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #bddc9c;
        }

        .footer-snails {
            margin-top: 2.5rem;
            display: flex;
            justify-content: center;
            gap: 0.8rem 2rem;
            flex-wrap: wrap;
            font-size: 1.8rem;
            color: #a2c78d;
            border-top: 2px dashed #61855e;
            padding-top: 1.5rem;
            opacity: 0.8;
        }

        .footer-snails span {
            filter: drop-shadow(0 5px 5px #172e17);
            transition: 0.2s;
            cursor: default;
        }

        .footer-snails span:hover {
            transform: scale(1.2) rotate(5deg);
            color: #e2ffb3;
        }

        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2e4d2e;
            border: 2px solid #c7e9a8;
            color: #f0f7da;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: bold;
            z-index: 1000;
            animation: fadeOut 2s ease forwards;
            pointer-events: none;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); visibility: hidden; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-title">
        <span class="snail-icon-big">🎨</span>
        <span>Генератор улиток</span>
        <span class="snail-icon-big">🐌</span>
    </div>

    <div class="generator-grid">
        <!-- панель управления цветами -->
        <div class="colors-panel">
            <h3><span>🎨</span> раскрась улитку <span>🐌</span></h3>
            
            <div class="color-row">
                <label>🐚 цвет 1 (основной)</label>
                <div class="color-preview" id="preview1" style="background-color: #9266CC;"></div>
                <input type="color" id="color1" class="color-input" value="#9266CC">
                <span class="color-hex" id="hex1">#9266CC</span>
            </div>

            <div class="color-row">
                <label>🍃 цвет 2 (светло-фиол)</label>
                <div class="color-preview" id="preview2" style="background-color: #AA8DD8;"></div>
                <input type="color" id="color2" class="color-input" value="#AA8DD8">
                <span class="color-hex" id="hex2">#AA8DD8</span>
            </div>

            <div class="color-row">
                <label>⭐ цвет 3 (жёлтый)</label>
                <div class="color-preview" id="preview3" style="background-color: #FFCC4D;"></div>
                <input type="color" id="color3" class="color-input" value="#FFCC4D">
                <span class="color-hex" id="hex3">#FFCC4D</span>
            </div>

            <div class="color-row">
                <label>🔥 цвет 4 (оранж акцент)</label>
                <div class="color-preview" id="preview4" style="background-color: #FFAC33;"></div>
                <input type="color" id="color4" class="color-input" value="#FFAC33">
                <span class="color-hex" id="hex4">#FFAC33</span>
            </div>

            <div class="button-group">
                <button class="snail-btn" id="randomizeBtn">
                    <span>🎲</span> случайные цвета
                </button>
                <button class="snail-btn" id="downloadBtn">
                    <span>💾</span> скачать SVG
                </button>
            </div>
        </div>

        <!-- блок предпросмотра -->
        <div class="preview-panel">
            <h3><span>👀</span> предпросмотр <span>🐌</span></h3>
            <div class="svg-preview-box" id="svgPreviewBox">
                <svg id="liveSvg" width="200" height="200" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
                    <!-- динамические пути будут вставлены скриптом -->
                </svg>
            </div>
            <div class="download-info">
                🐌 кликни «скачать SVG» — получишь файл для турбоварпа
            </div>
        </div>
    </div>

    <div class="footer-snails">
        <span>🐌</span><span>🎨</span><span>🐌</span><span>🖌️</span><span>🐌</span><span>✨🐌</span>
    </div>
</div>

<script>
    (function() {
        // цвета
        const colorInputs = {
            1: document.getElementById('color1'),
            2: document.getElementById('color2'),
            3: document.getElementById('color3'),
            4: document.getElementById('color4')
        };
        
        const previewDivs = {
            1: document.getElementById('preview1'),
            2: document.getElementById('preview2'),
            3: document.getElementById('preview3'),
            4: document.getElementById('preview4')
        };
        
        const hexSpans = {
            1: document.getElementById('hex1'),
            2: document.getElementById('hex2'),
            3: document.getElementById('hex3'),
            4: document.getElementById('hex4')
        };

        // SVG элементы (пути)
        const svgContainer = document.getElementById('liveSvg');
        
        // базовые пути без цветов
        const pathsData = [
            'M9 15.561c0-4 2-8 0-10s-3 2-2 2c1.414 0 2 2 1 5s1 3.999 1 3zm-3.875 0c0-4 2-8 0-10s-3 2-2 2c1.414 0 2 2 1 5s1 3.999 1 3z',
            'M36 34.936c0 1-1 1-2 1H11c-5 0-7.272-3.09-8-6c-1-4 2-11 0-12s-3-1-3-3s4.47-5.265 7-4c4 2 2.767 6.932 2 10c-.88 3.522 1.115 3.594 5 5c4.94 1.787 12.32 4.44 14 5c3 1 8 3 8 4z',
            'M10.925 24.935c2.887 1 3.849 9 13.472 9c6.377 0 8.66-5.479 8.66-11c0-5.523-5.17-10-11.547-10c-6.377.001-11.498 11.684-10.585 12z',
            'M24.914 33.938c1.708 0 3.389-.48 4.892-1.418c2.185-1.361 3.729-3.527 4.348-6.098c1.53-6.363-2.206-12.834-8.329-14.425c-7.393-1.923-14.919 2.768-16.768 10.455c-.258 1.072.369 2.158 1.399 2.426c1.027.271 2.076-.383 2.335-1.455c1.334-5.546 6.761-8.93 12.1-7.544c4.063 1.056 6.544 5.351 5.528 9.574c-.369 1.533-1.29 2.826-2.594 3.639a5.473 5.473 0 0 1-4.311.666a4.151 4.151 0 0 1-2.564-1.973a4.454 4.454 0 0 1-.469-3.281a3.037 3.037 0 0 1 1.344-1.887c.676-.421 1.527-.707 2.234-.345c1.298.665 1.298 2.665.336 3.665c-.752.781 1.604 1.065 2.887 0c1.15-.955 1.645-2.492 1.068-4.199c-.581-1.724-1.805-2.942-3.358-3.347a6.53 6.53 0 0 0-5.148.797c-1.557.971-2.657 2.515-3.098 4.347a8.559 8.559 0 0 0 .903 6.307c1.103 1.91 2.853 3.258 4.931 3.797a9.38 9.38 0 0 0 2.334.299z'
        ];

        function updateSVG() {
            const colors = {
                1: colorInputs[1].value,
                2: colorInputs[2].value,
                3: colorInputs[3].value,
                4: colorInputs[4].value
            };
            
            // обновляем превью цветов и hex
            for (let i = 1; i <= 4; i++) {
                if (previewDivs[i]) previewDivs[i].style.backgroundColor = colors[i];
                if (hexSpans[i]) hexSpans[i].textContent = colors[i];
            }
            
            // генерируем пути в SVG
            let svgContent = '';
            for (let i = 0; i < pathsData.length; i++) {
                const colorKey = (i + 1);
                svgContent += `<path fill="${colors[colorKey]}" d="${pathsData[i]}"></path>`;
            }
            
            svgContainer.innerHTML = svgContent;
        }

        // функция полного SVG для скачивания
        function getFullSVGString() {
            const colors = {
                1: colorInputs[1].value,
                2: colorInputs[2].value,
                3: colorInputs[3].value,
                4: colorInputs[4].value
            };
            
            let paths = '';
            for (let i = 0; i < pathsData.length; i++) {
                const colorKey = (i + 1);
                paths += `<path fill="${colors[colorKey]}" d="${pathsData[i]}"></path>\n    `;
            }
            
            return `<?xml version="1.0" encoding="utf-8"?>
<svg width="800px" height="800px" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--twemoji" preserveAspectRatio="xMidYMid meet">
    ${paths}
</svg>`;
        }

        // скачивание
        function downloadSVG() {
            const svgString = getFullSVGString();
            const blob = new Blob([svgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ulitka_generator.svg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            // маленькое уведомление
            showToast('🐌 SVG скачан!');
        }

        function showToast(msg) {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // случайный цвет
        function randomColor() {
            return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
        }
        
        function randomizeColors() {
            for (let i = 1; i <= 4; i++) {
                const newColor = randomColor();
                colorInputs[i].value = newColor;
            }
            updateSVG();
            showToast('🎨 новые цвета улитки!');
        }

        // подписка на события
        for (let i = 1; i <= 4; i++) {
            colorInputs[i].addEventListener('input', updateSVG);
        }
        
        document.getElementById('randomizeBtn').addEventListener('click', randomizeColors);
        document.getElementById('downloadBtn').addEventListener('click', downloadSVG);
        
        // начальная отрисовка
        updateSVG();
    })();
</script>
</body>
</html>
