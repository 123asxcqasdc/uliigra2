<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ули · сократитель ссылок</title>
    
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/shared.css">
    <!-- превью в соцсетях -->
    <meta property="og:title" content="Ули · Сократитель ссылок">
    <meta property="og:description" content="Создай короткую ссылку и QR-код — следи за переходами">
    <meta property="og:url" content="https://uliigra2.c6t.ru/lnk">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Ули · Сократитель ссылок">
    <meta name="twitter:description" content="Создай короткую ссылку и QR-код — следи за переходами">
    
    <style>
        .main-container {
            max-width: 700px;
        }

        .header-title {
            font-size: 2.5rem;
        }

        .snail-icon-big {
            font-size: 3rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #dcedc4;
            font-weight: 600;
            font-size: 1rem;
        }

        input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: #2e4d2e;
            border: 2px solid #7eaf7a;
            border-radius: 20px;
            font-size: 1rem;
            color: #f0f7da;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #c7f0b1;
            background: #386d38;
            box-shadow: 0 0 0 3px rgba(167, 200, 163, 0.3);
        }

        input::placeholder {
            color: #8aaa7a;
        }

        button {
            width: 100%;
            padding: 0.9rem 1.5rem;
            background: #a3c4a3;
            color: #1b3f1b;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #446d44;
            font-family: inherit;
            margin-top: 0.5rem;
        }

        button:hover {
            background: #c3e6b3;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #2f542f;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2f542f;
        }

        .result {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #2f542f;
            border-radius: 24px;
            border: 2px dashed #9bbc7b;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            color: #e2ffb3;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .short-url-box {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .short-url-box input {
            flex: 1;
            background: #1b3b1b;
            border-color: #a3c4a3;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .copy-btn {
            width: auto;
            background: #7eaf7a;
            box-shadow: 0 5px 0 #446d44;
            margin-top: 0;
            padding: 0.9rem 1.5rem;
        }

        .copy-btn:hover {
            background: #9bcb97;
        }

        .info-text {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #b3d49b;
            text-align: center;
            word-break: break-all;
        }

        .info-text a {
            color: #e2ffb3;
            text-decoration: underline wavy #a3d683;
        }

        .footer-snails {
            margin-top: 2rem;
            font-size: 1.5rem;
            padding-top: 1.5rem;
        }

        .divider {
            margin: 2.5rem 0;
            border: none;
            border-top: 2px dashed #61855e;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #dff0c0;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 1rem;
        }

        .qr-wrap {
            margin-top: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .qr-img {
            width: 200px;
            height: 200px;
            max-width: 60vw;
            background: #ffffff;
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
            image-rendering: pixelated;
        }

        @media (max-width: 600px) {
            .header-title { font-size: 1.8rem; }
            .snail-icon-big { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-row">
        <a class="home-link" href="/home">🐌 УЛИ</a>
        <div class="header-title">
            <span class="snail-icon-big">🐌</span>
            <span>СОКРАТИТЕЛЬ ССЫЛОК</span>
            <span class="snail-icon-big">🐌</span>
        </div>
    </div>

    <div class="input-group">
        <label>длинная ссылка</label>
        <input type="url" id="longUrl" placeholder="https://example.com/very-long-url">
    </div>

    <div class="input-group">
        <label>свой код (необязательно)</label>
        <input type="text" id="customCode" placeholder="например: mylink" maxlength="50">
    </div>

    <button onclick="createShortLink()">создать короткую ссылку</button>

    <div class="result" id="result">
        <div class="result-title">ваша короткая ссылка:</div>
        <div class="short-url-box">
            <input type="text" id="shortUrl" readonly onclick="this.select()">
            <button class="copy-btn" onclick="copyToClipboard(this, 'shortUrl')">копировать</button>
        </div>
        <div class="result-title" style="margin-top: 1.2rem;">ссылка через uli.c6t.ru:</div>
        <div class="short-url-box">
            <input type="text" id="shortUrlUli" readonly onclick="this.select()">
            <button class="copy-btn" onclick="copyToClipboard(this, 'shortUrlUli')">копировать</button>
        </div>
        <div class="info-text" id="infoText"></div>
        <div class="qr-wrap" id="qrShortWrap">
            <div class="result-title" style="margin-bottom: 0;">QR-код ссылки uli.c6t.ru:</div>
            <img id="qrShort" class="qr-img" alt="QR-код короткой ссылки">
            <button class="copy-btn" onclick="downloadQR('qrShort', 'uli-qr')">скачать QR (PNG)</button>
        </div>
    </div>

    <hr class="divider">

    <div class="section-title">QR-код любой ссылки</div>
    <div class="input-group">
        <label>ссылка или текст</label>
        <input type="text" id="qrInput" placeholder="https://example.com или любой текст" maxlength="2000">
    </div>
    <button onclick="makeQr()">сделать QR-код</button>
    <div class="qr-wrap" id="qrBox" style="display: none;">
        <img id="qrImg" class="qr-img" alt="QR-код">
        <button class="copy-btn" onclick="downloadQR('qrImg', 'uli-qr')">скачать QR (PNG)</button>
    </div>

    <div class="footer-snails">
        <span>🐌</span><span>🐌💚</span><span>🐌</span><span>🐚</span><span>🐌</span><span>🍀🐌</span>
    </div>
    <div class="footer-copyright">© Ули 2025–2026</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTx2Y9ctiWp26YeMmAHAxDZd_gVI_ZMdw",
        authDomain: "kcalls.firebaseapp.com",
        databaseURL: "https://kcalls-default-rtdb.firebaseio.com",
        projectId: "kcalls",
        storageBucket: "kcalls.firebasestorage.app",
        messagingSenderId: "990117089104",
        appId: "1:990117089104:web:278a42c037e975ebb76655",
        measurementId: "G-TK6GVEX9G5"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const baseUrl = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');

    function generateCode(length = 6) {
        const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < length; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    async function isCodeAvailable(code) {
        try {
            const snapshot = await database.ref('links/' + code).once('value');
            return !snapshot.exists();
        } catch (error) {
            console.error('Ошибка проверки кода:', error);
            return false;
        }
    }

    async function createShortLink() {
        const longUrl = document.getElementById('longUrl').value.trim();
        const customCode = document.getElementById('customCode').value.trim();
        const resultDiv = document.getElementById('result');
        const shortUrlInput = document.getElementById('shortUrl');
        const infoText = document.getElementById('infoText');

        if (!longUrl) {
            alert('введите ссылку');
            return;
        }

        try {
            new URL(longUrl);
        } catch {
            alert('ссылка должна начинаться с http:// или https://');
            return;
        }

        let shortCode = customCode;

        if (customCode) {
            const available = await isCodeAvailable(customCode);
            if (!available) {
                alert('этот код уже занят, выберите другой');
                return;
            }
        } else {
            do {
                shortCode = generateCode();
            } while (!(await isCodeAvailable(shortCode)));
        }

        try {
            await database.ref('links/' + shortCode).set({
                url: longUrl,
                createdAt: firebase.database.ServerValue.TIMESTAMP,
                clicks: 0
            });

            const shortUrl = baseUrl + 'redirect?' + shortCode;
            const uliShortUrl = 'https://uli.c6t.ru/r?' + shortCode;
            shortUrlInput.value = shortUrl;
            document.getElementById('shortUrlUli').value = uliShortUrl;
            infoText.innerHTML = `пример перехода через uli.c6t.ru: <a href="${uliShortUrl}" target="_blank">${uliShortUrl}</a>`;
            resultDiv.classList.add('show');

            renderQR(document.getElementById('qrShort'), uliShortUrl);
            document.getElementById('qrShortWrap').style.display =
                document.getElementById('qrShort').src ? 'flex' : 'none';

            document.getElementById('customCode').value = '';

        } catch (error) {
            console.error(error);
            alert('произошла ошибка при создании ссылки');
        }
    }

    function copyToClipboard(btn, id) {
        const shortUrl = document.getElementById(id);
        shortUrl.select();
        document.execCommand('copy');

        const originalText = btn.textContent;
        btn.textContent = 'скопировано!';
        setTimeout(() => {
            btn.textContent = originalText;
        }, 2000);
    }

    function renderQR(imgEl, text) {
        if (typeof qrcode !== 'function') {
            console.error('QR-библиотека не загрузилась');
            return false;
        }
        try {
            const qr = qrcode(0, 'M');
            qr.addData(text);
            qr.make();
            imgEl.src = qr.createDataURL(10, 4);
            return true;
        } catch (error) {
            console.error('Ошибка создания QR:', error);
            return false;
        }
    }

    function makeQr() {
        const value = document.getElementById('qrInput').value.trim();
        if (!value) {
            alert('введите ссылку или текст');
            return;
        }
        const box = document.getElementById('qrBox');
        if (renderQR(document.getElementById('qrImg'), value)) {
            box.style.display = 'flex';
        } else {
            alert('не удалось создать QR-код');
        }
    }

    function downloadQR(id, name) {
        const img = document.getElementById(id);
        if (!img || !img.src) return;
        const a = document.createElement('a');
        a.href = img.src;
        a.download = name + '.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    document.getElementById('longUrl').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') createShortLink();
    });
    document.getElementById('customCode').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') createShortLink();
    });
    document.getElementById('qrInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') makeQr();
    });
</script>
</body>
</html>
