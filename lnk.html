<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ули · сократитель ссылок</title>
    
    <link rel="icon" type="image/png" href="/icon.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background-color: #1b3b1b;
            background-image: radial-gradient(circle at 30% 40%, #2b5a2b 0%, #0e2f0e 90%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
            color: #f0f7da;
        }

        body::before {
            content: "🐌🐌🐌";
            font-size: 8rem;
            position: absolute;
            top: 10px;
            left: 10px;
            opacity: 0.08;
            white-space: nowrap;
            transform: rotate(-10deg);
            pointer-events: none;
            letter-spacing: 2rem;
        }

        body::after {
            content: "🐌🐌🐌";
            font-size: 12rem;
            position: absolute;
            bottom: -20px;
            right: 0;
            opacity: 0.05;
            transform: rotate(15deg);
            pointer-events: none;
            white-space: nowrap;
        }

        .main-container {
            max-width: 700px;
            width: 100%;
            background: rgba(30, 50, 30, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 3px solid #9bbc7b;
            border-radius: 30px;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.6), 0 0 0 2px #6f8c5d inset, 0 0 0 4px #3f6140 inset;
            padding: 3rem 2rem;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem 1.2rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            font-weight: 800;
            text-shadow: 3px 3px 0 #2d4a2d, 5px 5px 0 #1b331b;
            color: #e2f0c0;
            letter-spacing: 2px;
        }

        .snail-icon-big {
            font-size: 3rem;
            transform: rotate(15deg);
            transition: transform 0.2s;
            filter: drop-shadow(2px 4px 4px #0f2a0f);
        }

        .snail-icon-big:hover {
            transform: rotate(25deg) scale(1.1);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #dcedc4;
            font-weight: 600;
            font-size: 1rem;
        }

        input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: #2e4d2e;
            border: 2px solid #7eaf7a;
            border-radius: 20px;
            font-size: 1rem;
            color: #f0f7da;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #c7f0b1;
            background: #386d38;
            box-shadow: 0 0 0 3px rgba(167, 200, 163, 0.3);
        }

        input::placeholder {
            color: #8aaa7a;
        }

        button {
            width: 100%;
            padding: 0.9rem 1.5rem;
            background: #a3c4a3;
            color: #1b3f1b;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #446d44;
            font-family: inherit;
            margin-top: 0.5rem;
        }

        button:hover {
            background: #c3e6b3;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #2f542f;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2f542f;
        }

        .result {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #2f542f;
            border-radius: 24px;
            border: 2px dashed #9bbc7b;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            color: #e2ffb3;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .short-url-box {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .short-url-box input {
            flex: 1;
            background: #1b3b1b;
            border-color: #a3c4a3;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .copy-btn {
            width: auto;
            background: #7eaf7a;
            box-shadow: 0 5px 0 #446d44;
            margin-top: 0;
            padding: 0.9rem 1.5rem;
        }

        .copy-btn:hover {
            background: #9bcb97;
        }

        .info-text {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #b3d49b;
            text-align: center;
            word-break: break-all;
        }

        .info-text a {
            color: #e2ffb3;
            text-decoration: underline wavy #a3d683;
        }

        .footer-snails {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 0.8rem 2rem;
            flex-wrap: wrap;
            font-size: 1.5rem;
            color: #a2c78d;
            border-top: 2px dashed #61855e;
            padding-top: 1.5rem;
            opacity: 0.8;
        }

        .footer-snails span {
            filter: drop-shadow(0 5px 5px #172e17);
            transition: 0.2s;
            cursor: default;
        }

        .footer-snails span:hover {
            transform: scale(1.2) rotate(5deg);
            color: #e2ffb3;
        }

        @media (max-width: 600px) {
            .main-container { padding: 1.5rem 1rem; }
            .header-title { font-size: 1.8rem; }
            .snail-icon-big { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-title">
        <span class="snail-icon-big">🐌</span>
        <span>СОКРАТИТЕЛЬ ССЫЛОК</span>
        <span class="snail-icon-big">🐌</span>
    </div>

    <div class="input-group">
        <label>длинная ссылка</label>
        <input type="url" id="longUrl" placeholder="https://example.com/very-long-url">
    </div>

    <div class="input-group">
        <label>свой код (необязательно)</label>
        <input type="text" id="customCode" placeholder="например: mylink" maxlength="50">
    </div>

    <button onclick="createShortLink()">создать короткую ссылку</button>

    <div class="result" id="result">
        <div class="result-title">ваша короткая ссылка:</div>
        <div class="short-url-box">
            <input type="text" id="shortUrl" readonly onclick="this.select()">
            <button class="copy-btn" onclick="copyToClipboard()">копировать</button>
        </div>
        <div class="info-text" id="infoText"></div>
    </div>

    <div class="footer-snails">
        <span>🐌</span><span>🐌💚</span><span>🐌</span><span>🐚</span><span>🐌</span><span>🍀🐌</span>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTx2Y9ctiWp26YeMmAHAxDZd_gVI_ZMdw",
        authDomain: "kcalls.firebaseapp.com",
        databaseURL: "https://kcalls-default-rtdb.firebaseio.com",
        projectId: "kcalls",
        storageBucket: "kcalls.firebasestorage.app",
        messagingSenderId: "990117089104",
        appId: "1:990117089104:web:278a42c037e975ebb76655",
        measurementId: "G-TK6GVEX9G5"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const baseUrl = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');

    function generateCode(length = 6) {
        const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < length; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    async function isCodeAvailable(code) {
        try {
            const snapshot = await database.ref('links/' + code).once('value');
            return !snapshot.exists();
        } catch (error) {
            console.error('Ошибка проверки кода:', error);
            return false;
        }
    }

    async function createShortLink() {
        const longUrl = document.getElementById('longUrl').value.trim();
        const customCode = document.getElementById('customCode').value.trim();
        const resultDiv = document.getElementById('result');
        const shortUrlInput = document.getElementById('shortUrl');
        const infoText = document.getElementById('infoText');

        if (!longUrl) {
            alert('введите ссылку');
            return;
        }

        try {
            new URL(longUrl);
        } catch {
            alert('ссылка должна начинаться с http:// или https://');
            return;
        }

        let shortCode = customCode;

        if (customCode) {
            const available = await isCodeAvailable(customCode);
            if (!available) {
                alert('этот код уже занят, выберите другой');
                return;
            }
        } else {
            do {
                shortCode = generateCode();
            } while (!(await isCodeAvailable(shortCode)));
        }

        try {
            await database.ref('links/' + shortCode).set({
                url: longUrl,
                createdAt: firebase.database.ServerValue.TIMESTAMP,
                clicks: 0
            });

            const shortUrl = baseUrl + 'redirect?' + shortCode;
            shortUrlInput.value = shortUrl;
            infoText.innerHTML = `пример перехода: <a href="${shortUrl}" target="_blank">${baseUrl}redirect?${shortCode}</a>`;
            resultDiv.classList.add('show');

            document.getElementById('customCode').value = '';

        } catch (error) {
            console.error(error);
            alert('произошла ошибка при создании ссылки');
        }
    }

    function copyToClipboard() {
        const shortUrl = document.getElementById('shortUrl');
        shortUrl.select();
        document.execCommand('copy');

        const copyBtn = document.querySelector('.copy-btn');
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'скопировано!';
        setTimeout(() => {
            copyBtn.textContent = originalText;
        }, 2000);
    }

    document.getElementById('longUrl').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') createShortLink();
    });
    document.getElementById('customCode').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') createShortLink();
    });
</script>
</body>
</html>
