<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b3b1b">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/shared.css">

    <!-- превью в соцсетях -->
    <meta property="og:title" content="Ули · генератор случайных чисел">
    <meta property="og:description" content="Крутите случайное число от и до 🎲">
    <meta property="og:url" content="https://uliigra2.c6t.ru/rnd">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Ули · генератор случайных чисел">
    <meta name="twitter:description" content="Крутите случайное число от и до 🎲">

    <title>Ули · генератор случайных чисел</title>
    <style>
        body {
            justify-content: center;
        }

        .main-container {
            max-width: 520px;
            margin: 0 auto;
            background: rgba(30, 50, 30, 0.8);
            padding: 2rem clamp(16px, 5vw, 34px);
            position: relative;
            z-index: 1;
            text-align: center;
        }

        /* ---- Окно вывода ---- */
        .number-window {
            position: relative;
            background: #0e1f0e;
            border-radius: clamp(10px, 2.5vw, 14px);
            padding: 8px;
            box-shadow:
                inset 0 0 0 2px #3f6140,
                inset 0 4px 20px rgba(0, 0, 0, 0.9),
                0 0 30px rgba(126, 175, 122, 0.2);
            overflow: hidden;
            height: clamp(100px, 26vw, 130px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .number-window::before,
        .number-window::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 34px;
            pointer-events: none;
            z-index: 3;
        }

        .number-window::before {
            top: 0;
            background: linear-gradient(180deg, rgba(14, 31, 14, 0.95), rgba(14, 31, 14, 0));
        }

        .number-window::after {
            bottom: 0;
            background: linear-gradient(0deg, rgba(14, 31, 14, 0.95), rgba(14, 31, 14, 0));
        }

        .number-window .scanline {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 60px;
            transform: translateY(-50%);
            background: linear-gradient(90deg,
                transparent,
                rgba(163, 196, 163, 0.10),
                rgba(199, 240, 177, 0.22),
                rgba(163, 196, 163, 0.10),
                transparent);
            pointer-events: none;
            z-index: 2;
            border-top: 1px solid rgba(199, 240, 177, 0.25);
            border-bottom: 1px solid rgba(199, 240, 177, 0.25);
        }

        .track {
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
        }

        .track .number {
            font-size: clamp(48px, 15vw, 76px);
            font-weight: 800;
            color: #c7f0b1;
            font-variant-numeric: tabular-nums;
            text-shadow:
                0 0 20px rgba(168, 215, 130, 0.55),
                0 0 40px rgba(168, 215, 130, 0.35);
            line-height: 1;
            padding: 8px 0;
            letter-spacing: clamp(1px, 0.4vw, 2px);
            white-space: nowrap;
            user-select: none;
        }

        /* ---- Диапазон ---- */
        .range {
            display: grid;
            grid-template-columns: auto 1fr auto 1fr;
            gap: clamp(6px, 2vw, 10px);
            margin: clamp(16px, 4vw, 22px) 0 8px;
            align-items: center;
        }

        .range label {
            font-size: clamp(10px, 2.8vw, 12px);
            color: #8aaa7a;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .range input {
            width: 100%;
            min-width: 0;
            background: #1b331b;
            border: 2px solid #7eaf7a;
            color: #f0f7da;
            padding: clamp(7px, 2.5vw, 9px);
            border-radius: clamp(8px, 2vw, 10px);
            font-size: clamp(14px, 4vw, 16px);
            text-align: center;
            outline: none;
            transition: 0.2s;
            font-variant-numeric: tabular-nums;
            font-family: inherit;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .range input::-webkit-outer-spin-button,
        .range input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .range input:focus {
            border-color: #d8f0b5;
            box-shadow: 0 0 15px rgba(168, 215, 130, 0.3);
        }

        .error {
            color: #ffb0a0;
            font-size: clamp(11px, 2.8vw, 12px);
            min-height: 16px;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        /* ---- Кнопка ---- */
        button {
            margin-top: clamp(10px, 3vw, 14px);
            background: #a3c4a3;
            border: 2px solid #d6f0be;
            color: #1b3f1b;
            font-weight: 800;
            padding: clamp(11px, 3.5vw, 14px) 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: clamp(13px, 3.8vw, 15px);
            letter-spacing: clamp(1px, 0.4vw, 2px);
            text-transform: uppercase;
            width: 100%;
            transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
            box-shadow: 0 5px 0 #446d44;
            font-family: inherit;
            min-height: 48px;
            touch-action: manipulation;
            user-select: none;
        }

        @media (hover: hover) {
            button:hover:not(:disabled) {
                background: #c3e6b3;
                box-shadow: 0 7px 0 #2f542f;
            }
        }

        button:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2f542f;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.75;
            box-shadow: 0 5px 0 #446d44;
        }

        /* ---- Инфо ---- */
        .info {
            font-size: clamp(11px, 2.8vw, 12px);
            color: #8aaa7a;
            line-height: 1.7;
            text-align: left;
            border-top: 1px dashed #3f6140;
            padding-top: clamp(10px, 3vw, 14px);
            margin-top: clamp(16px, 4vw, 22px);
            font-variant-numeric: tabular-nums;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2px;
        }

        .info span {
            color: #c7e3aa;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        /* ---- Анимации ---- */
        @keyframes winPulse {
            0%, 100% {
                box-shadow:
                    inset 0 0 0 2px #3f6140,
                    inset 0 4px 20px rgba(0, 0, 0, 0.9),
                    0 0 30px rgba(126, 175, 122, 0.2);
            }
            50% {
                box-shadow:
                    inset 0 0 0 2px #c7f0b1,
                    inset 0 4px 20px rgba(0, 0, 0, 0.9),
                    0 0 60px rgba(168, 215, 130, 0.6);
            }
        }

        .number-window.win {
            animation: winPulse 0.5s ease-in-out 3;
        }

        @keyframes numberPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .track .number.pop {
            animation: numberPop 0.35s ease-out;
        }

        .footer-snails {
            margin-top: 2rem;
            padding-top: 1.5rem;
        }

        /* ---- Ландшафт на телефоне / низкие экраны ---- */
        @media (max-height: 640px) and (orientation: landscape) {
            body { align-items: flex-start; padding-top: 12px; }
            .main-container { padding-top: 14px; padding-bottom: 14px; }
            .number-window { height: 84px; }
            .track .number { font-size: clamp(38px, 9vh, 56px); }
            .range { margin: 10px 0 4px; }
            .info { margin-top: 10px; padding-top: 8px; }
            button { min-height: 42px; padding: 10px 20px; }
        }

        /* ---- Очень маленькие телефоны ---- */
        @media (max-width: 340px) {
            .range {
                grid-template-columns: 1fr 1fr;
                grid-template-areas:
                    "lab-min lab-max"
                    "in-min  in-max";
                row-gap: 4px;
            }
            .range label:nth-of-type(1) { grid-area: lab-min; }
            .range label:nth-of-type(2) { grid-area: lab-max; }
            .range input:nth-of-type(1) { grid-area: in-min; }
            .range input:nth-of-type(2) { grid-area: in-max; }
        }

        /* ---- Уменьшение анимаций ---- */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
<div class="main-container">
    <div class="header-row">
        <a class="home-link" href="/home">🐌 УЛИ</a>
        <div class="header-title" style="font-size: 1.8rem; margin-bottom: 1.2rem;">
            <span class="snail-icon-big">🎲</span>
            <span>ГЕНЕРАТОР ЧИСЕЛ</span>
            <span class="snail-icon-big">🐌</span>
        </div>
    </div>

    <div class="number-window" id="numberWindow">
        <div class="scanline"></div>
        <div class="track" id="track">
            <div class="number" id="result">0</div>
        </div>
    </div>

    <div class="range">
        <label for="min">от</label>
        <input type="number" id="min" value="1" inputmode="numeric" enterkeyhint="done">
        <label for="max">до</label>
        <input type="number" id="max" value="100" inputmode="numeric" enterkeyhint="done">
    </div>
    <div class="error" id="error"></div>

    <button id="spinBtn" type="button">Крутить</button>

    <div class="info">
        <div class="info-row"><span>Unix time:</span> <span id="unixtime">—</span></div>
        <div class="info-row"><span>День месяца (итераций):</span> <span id="day">—</span></div>
    </div>

    <div class="footer-snails">
        <span>🐌</span><span>🐌💚</span><span>🐌</span><span>🐚</span><span>🐌</span><span>🍀🐌</span>
    </div>
    <div class="footer-copyright">© Ули 2025–2026</div>
</div>

<script>
/* ============================================================
   LCG-генератор (linear congruential generator)
   ============================================================ */
function createRandom(seed) {
  let state = seed >>> 0;
  return function () {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296; // [0, 1)
  };
}

/* Универсальная функция случайного целого в [min, max] */
function randomInRange(randomFn, min, max) {
  if (min > max) [min, max] = [max, min];
  const lo = Math.ceil(min);
  const hi = Math.floor(max);
  const size = hi - lo + 1;
  return Math.floor(randomFn() * size) + lo;
}

/* ============================================================
   Основная логика
   ============================================================ */
const track        = document.getElementById('track');
const resultEl     = document.getElementById('result');
const numberWindow = document.getElementById('numberWindow');
const spinBtn      = document.getElementById('spinBtn');
const errorEl      = document.getElementById('error');

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let spinning = false;

function getTrueResult(min, max) {
  const now  = new Date();
  const unix = Math.floor(now.getTime() / 1000);
  const day  = now.getDate();

  const random = createRandom(unix);
  let v = 0;
  for (let i = 0; i < day; i++) v = random();

  return {
    value: randomInRange(() => v, min, max),
    unix, day
  };
}

/* ============================================================
   Анимация прокрутки чисел
   ============================================================ */
function animateSpin(min, max, durationMs, onFinish) {
  const start = performance.now();
  const lo = Math.ceil(Math.min(min, max));
  const hi = Math.floor(Math.max(min, max));
  const size = hi - lo + 1;

  let lastSwap = 0;
  let currentInterval = 40;

  function frame(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / durationMs, 1);

    currentInterval = 30 + 260 * Math.pow(progress, 2.5);

    if (elapsed - lastSwap >= currentInterval) {
      lastSwap = elapsed;
      const n = lo + Math.floor(Math.random() * size);

      track.style.transition = 'none';
      track.style.transform = 'translateY(-6px)';
      resultEl.textContent = n;
      resultEl.style.opacity = '0.85';

      requestAnimationFrame(() => {
        track.style.transition = 'transform 60ms linear';
        track.style.transform = 'translateY(0)';
        resultEl.style.opacity = '1';
      });
    }

    if (progress < 1) {
      requestAnimationFrame(frame);
    } else {
      onFinish();
    }
  }

  requestAnimationFrame(frame);
}

/* ============================================================
   Запуск прокрутки
   ============================================================ */
function spin() {
  if (spinning) return;

  errorEl.textContent = '';

  const minInput = document.getElementById('min');
  const maxInput = document.getElementById('max');
  const min = Number(minInput.value);
  const max = Number(maxInput.value);

  if (!Number.isFinite(min) || !Number.isFinite(max) || minInput.value === '' || maxInput.value === '') {
    errorEl.textContent = 'Введите корректные числа';
    return;
  }

  const { value, unix, day } = getTrueResult(min, max);

  spinning = true;
  spinBtn.disabled = true;
  spinBtn.textContent = 'Крутится…';
  numberWindow.classList.remove('win');
  resultEl.classList.remove('pop');

  // Скрываем клавиатуру на мобильных
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }

  const duration = reduceMotion ? 200 : 1600 + Math.random() * 800;

  animateSpin(min, max, duration, () => {
    track.style.transition = 'transform 180ms ease-out';
    track.style.transform = 'translateY(-12px)';
    resultEl.textContent = value;

    setTimeout(() => {
      track.style.transform = 'translateY(0)';
      resultEl.classList.add('pop');
      numberWindow.classList.add('win');

      spinning = false;
      spinBtn.disabled = false;
      spinBtn.textContent = 'Крутить ещё';
    }, reduceMotion ? 0 : 180);

    document.getElementById('unixtime').textContent = unix;
    document.getElementById('day').textContent = day;
  });
}

/* ============================================================
   Обработчики
   ============================================================ */
spinBtn.addEventListener('click', spin);

// Enter в полях — запускает прокрутку
['min', 'max'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      spin();
    }
  });
  document.getElementById(id).addEventListener('change', () => {
    if (spinning) return;
    errorEl.textContent = '';
  });
});

// Защита от зума двойным тапом на iOS
let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });

// Первичное заполнение информации
(function init() {
  const now = new Date();
  document.getElementById('unixtime').textContent = Math.floor(now.getTime() / 1000);
  document.getElementById('day').textContent = now.getDate();
})();

// Автозапуск при загрузке
window.addEventListener('load', () => {
  setTimeout(spin, 300);
});
</script>
</body>
</html>
