<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Улитки не нашли</title>

    <!-- ФАВИКОНКА -->
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/shared.css">

    <style>
        .main-container {
            max-width: 800px;
            text-align: center;
        }

        .header-title {
            font-size: 2.6rem;
        }

        .snail-icon-big {
            font-size: 3rem;
        }

        .error-code {
            font-size: 120px;
            font-weight: 800;
            color: #9bbc7b;
            text-shadow: 3px 3px 0 #2d4a2d, 5px 5px 0 #1b331b;
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }

        .error-message {
            font-size: 24px;
            line-height: 1.6;
            margin: 2rem 0;
            color: #e8f5e9;
            padding: 0 20px;
        }

        .footer-note {
            margin-top: 2.5rem;
            font-size: 16px;
            color: #a2c78d;
            opacity: 0.8;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .header-title { font-size: 2rem; }
            .error-code { font-size: 80px; }
            .error-message { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="main-container">
    <div class="header-title">
        <span class="snail-icon-big">🐌</span>
        <span style="background: transparent; filter: none;">404</span>
        <span class="snail-icon-big">🐌</span>
    </div>

    <div class="error-code">404</div>

    <div class="error-message">
        Улитки не находят данной страницы на серверах...
    </div>

    <a href="/home" class="back-link">← ко всем страницам</a>

    <!-- подвал с декоративными улитками -->
    <div class="footer-snails">
        <span>🐌</span><span>🐌💚</span><span>🐌</span><span>🐚</span><span>🐌</span><span>🍀🐌</span>
    </div>
</div>
</body>
</html>
