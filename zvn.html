<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kcalls - Аудиозвонки</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- SimplePeer для WebRTC -->
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-align: center;
        }

        .setup-section {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .room-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .room-actions .btn {
            width: auto;
            flex: 1;
        }

        .hidden {
            display: none !important;
        }

        .room-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .room-id {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
        }

        .connection-status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s;
        }

        .status-waiting {
            background: #fff3cd;
            color: #856404;
        }

        .status-connecting {
            background: #cce5ff;
            color: #004085;
        }

        .status-connected {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            animation: slideIn 0.3s;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .audio-call-container {
            text-align: center;
            padding: 40px 20px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            transition: all 0.3s;
        }

        .avatar.speaking {
            animation: pulse 1s infinite;
        }

        .avatar.connecting {
            animation: rotate 2s infinite linear;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(102, 126, 234, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0);
            }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .call-timer {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin: 20px 0;
        }

        .participant-name {
            font-size: 20px;
            color: #666;
            margin-bottom: 30px;
        }

        .debug-info {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            text-align: left;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            font-size: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            margin: 0 10px;
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .control-btn.muted {
            background: #ff4b4b;
            color: white;
        }

        .control-btn.end-call {
            background: #dc3545;
            color: white;
        }

        .mic-visualization {
            width: 200px;
            height: 40px;
            background: #f0f0f0;
            border-radius: 20px;
            margin: 20px auto;
            overflow: hidden;
        }

        .mic-level {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #2196f3);
            width: 0%;
            transition: width 0.1s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Kcalls Audio</h1>
        
        <!-- Настройка звонка -->
        <div id="setupSection" class="setup-section">
            <div class="form-group">
                <label>Ваше имя</label>
                <input type="text" id="userNameInput" placeholder="Введите ваше имя" value="Гость">
            </div>
            
            <h2>Присоединиться к звонку</h2>
            <div class="form-group">
                <label>ID комнаты</label>
                <input type="text" id="roomIdInput" placeholder="Введите ID комнаты">
            </div>
            
            <div class="room-actions">
                <button onclick="joinRoom()" class="btn" id="joinBtn">Присоединиться</button>
                <button onclick="createRoom()" class="btn btn-secondary">Создать комнату</button>
            </div>

            <button onclick="toggleDebug()" class="btn btn-secondary" style="margin-top: 20px;">
                🐛 Показать отладку
            </button>
        </div>

        <!-- Звонок -->
        <div id="callSection" class="hidden">
            <div class="room-info">
                <div>
                    <span class="room-id" id="currentRoomId"></span>
                    <button onclick="copyRoomId()" class="copy-btn">📋 Копировать</button>
                </div>
                <div>
                    <span id="userNameDisplay"></span>
                </div>
            </div>

            <div class="connection-status status-waiting" id="connectionStatus">
                <span class="loading"></span>
                Ожидание подключения собеседника...
            </div>

            <div class="audio-call-container">
                <div class="avatar" id="remoteAvatar">
                    👤
                </div>
                
                <div class="participant-name" id="remoteParticipantName">
                    Ожидание собеседника...
                </div>

                <div class="mic-visualization">
                    <div class="mic-level" id="micLevel"></div>
                </div>

                <div class="call-timer" id="callTimer">
                    00:00
                </div>

                <div>
                    <button onclick="toggleMicrophone()" class="control-btn" id="micBtn">
                        🎤
                    </button>
                    <button onclick="endCall()" class="control-btn end-call">
                        📞
                    </button>
                </div>
            </div>

            <div id="debugInfo" class="debug-info hidden">
                <strong>Отладочная информация:</strong><br>
                <div id="debugContent"></div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDTx2Y9ctiWp26YeMmAHAxDZd_gVI_ZMdw",
            authDomain: "kcalls.firebaseapp.com",
            databaseURL: "https://kcalls-default-rtdb.firebaseio.com",
            projectId: "kcalls",
            storageBucket: "kcalls.firebasestorage.app",
            messagingSenderId: "990117089104",
            appId: "1:990117089104:web:278a42c037e975ebb76655",
            measurementId: "G-TK6GVEX9G5"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Глобальные переменные
        let localStream = null;
        let peer = null;
        let currentRoom = null;
        let currentUser = {
            id: generateUserId(),
            name: 'Гость'
        };
        let isMicEnabled = true;
        let roomRef = null;
        let callRef = null;
        let audioContext = null;
        let analyser = null;
        let timerInterval = null;
        let callStartTime = null;
        let remoteUser = null;
        let processedSignals = new Set(); // Для отслеживания обработанных сигналов
        let connectionAttempts = 0;

        // Элементы DOM
        const userNameInput = document.getElementById('userNameInput');
        const joinBtn = document.getElementById('joinBtn');
        const debugInfo = document.getElementById('debugInfo');
        const debugContent = document.getElementById('debugContent');

        userNameInput.addEventListener('input', (e) => {
            currentUser.name = e.target.value || 'Гость';
        });

        // Функции отладки
        function toggleDebug() {
            debugInfo.classList.toggle('hidden');
        }

        function addDebug(message) {
            const timestamp = new Date().toLocaleTimeString();
            debugContent.innerHTML = `[${timestamp}] ${message}<br>` + debugContent.innerHTML;
            console.log(`[DEBUG] ${message}`);
        }

        function generateUserId() {
            return 'user_' + Math.random().toString(36).substring(2, 15);
        }

        function generateRoomId() {
            return Math.random().toString(36).substring(2, 8) + 
                   Math.random().toString(36).substring(2, 8);
        }

        async function createRoom() {
            const roomId = generateRoomId();
            document.getElementById('roomIdInput').value = roomId;
            await joinRoom();
        }

        async function joinRoom() {
            const roomId = document.getElementById('roomIdInput').value.trim();
            
            if (!roomId) {
                showToast('Введите ID комнаты');
                return;
            }

            currentRoom = roomId;
            joinBtn.disabled = true;
            
            try {
                addDebug('Запрос доступа к микрофону');
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false 
                });
                
                addDebug('Доступ к микрофону получен');
                await connectToRoom();
                
            } catch (error) {
                addDebug(`Ошибка микрофона: ${error.message}`);
                showToast('Ошибка доступа к микрофону');
                joinBtn.disabled = false;
            }
        }

        async function connectToRoom() {
            try {
                document.getElementById('currentRoomId').textContent = currentRoom;
                document.getElementById('userNameDisplay').textContent = currentUser.name;
                
                document.getElementById('setupSection').classList.add('hidden');
                document.getElementById('callSection').classList.remove('hidden');

                roomRef = database.ref('rooms/' + currentRoom);
                
                // Получаем текущих пользователей
                const snapshot = await roomRef.child('users').once('value');
                const users = snapshot.val() || {};
                
                addDebug(`Пользователей в комнате: ${Object.keys(users).length}`);
                
                // Добавляем себя
                await roomRef.child('users/' + currentUser.id).set({
                    name: currentUser.name,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });

                roomRef.child('users/' + currentUser.id).onDisconnect().remove();

                // Слушаем изменения
                roomRef.child('users').on('value', handleUsersChange);

                // Очищаем старые сигналы при подключении
                await database.ref('calls/' + currentRoom).remove();
                
                // Слушаем новые сигналы
                callRef = database.ref('calls/' + currentRoom);
                callRef.on('child_added', handleSignal);

                setupAudioVisualization();
                showToast('Подключено к комнате');

            } catch (error) {
                addDebug(`Ошибка подключения: ${error.message}`);
                resetToSetup();
            }
        }

        function setupAudioVisualization() {
            if (!localStream) return;
            
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(localStream);
                source.connect(analyser);
                
                analyser.fftSize = 256;
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                setInterval(() => {
                    if (analyser) {
                        analyser.getByteFrequencyData(dataArray);
                        const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
                        const level = (average / 128) * 100;
                        document.getElementById('micLevel').style.width = Math.min(level, 100) + '%';
                        
                        if (level > 10) {
                            document.getElementById('remoteAvatar').classList.add('speaking');
                        } else {
                            document.getElementById('remoteAvatar').classList.remove('speaking');
                        }
                    }
                }, 100);
            } catch (e) {
                addDebug(`Ошибка визуализации: ${e.message}`);
            }
        }

        function handleUsersChange(snapshot) {
            const users = snapshot.val();
            if (!users) return;
            
            const userIds = Object.keys(users);
            const otherUser = userIds.find(uid => uid !== currentUser.id);
            
            addDebug(`Изменение пользователей: ${userIds.length} в комнате`);
            
            if (otherUser) {
                remoteUser = {
                    id: otherUser,
                    name: users[otherUser].name
                };
                
                document.getElementById('remoteParticipantName').textContent = users[otherUser].name;
                document.getElementById('connectionStatus').className = 'connection-status status-connecting';
                document.getElementById('connectionStatus').innerHTML = '🔄 Установка соединения...';
                document.getElementById('remoteAvatar').classList.add('connecting');
                
                startTimer();
                
                // Если нет peer, создаем его с небольшой задержкой
                if (!peer) {
                    setTimeout(() => {
                        if (!peer && remoteUser) {
                            createPeerConnection();
                        }
                    }, 500);
                }
            } else {
                remoteUser = null;
                document.getElementById('remoteParticipantName').textContent = 'Ожидание собеседника...';
                document.getElementById('connectionStatus').className = 'connection-status status-waiting';
                document.getElementById('connectionStatus').innerHTML = '<span class="loading"></span> Ожидание подключения собеседника...';
                document.getElementById('remoteAvatar').classList.remove('connecting', 'speaking');
                
                stopTimer();
                
                if (peer) {
                    peer.destroy();
                    peer = null;
                }
            }
        }

        function createPeerConnection() {
            addDebug(`Создание peer соединения`);
            
            // Определяем инициатора на основе времени подключения
            const isInitiator = currentUser.id < remoteUser.id;
            addDebug(`Инициатор: ${isInitiator}`);
            
            peer = new SimplePeer({
                initiator: isInitiator,
                stream: localStream,
                trickle: true,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:stun3.l.google.com:19302' },
                        { urls: 'stun:stun4.l.google.com:19302' }
                    ]
                }
            });

            setupPeerEvents();
        }

        function setupPeerEvents() {
            if (!peer) return;

            peer.on('signal', (data) => {
                addDebug('Отправка сигнала');
                
                if (callRef && remoteUser) {
                    const signalId = `${currentUser.id}-${Date.now()}`;
                    callRef.child(signalId).set({
                        from: currentUser.id,
                        to: remoteUser.id,
                        data: data,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        addDebug('Сигнал отправлен');
                        // Удаляем сигнал через 10 секунд
                        setTimeout(() => {
                            callRef.child(signalId).remove();
                        }, 10000);
                    }).catch(e => {
                        addDebug(`Ошибка отправки: ${e.message}`);
                    });
                }
            });

            peer.on('connect', () => {
                addDebug('✅ Peer соединение установлено!');
                connectionAttempts = 0;
                
                document.getElementById('connectionStatus').className = 'connection-status status-connected';
                document.getElementById('connectionStatus').innerHTML = '✅ Соединение установлено';
                document.getElementById('remoteAvatar').classList.remove('connecting');
                document.getElementById('remoteAvatar').textContent = '🎤';
                
                showToast('Соединение установлено!');
            });

            peer.on('stream', (remoteStream) => {
                addDebug('Получен аудиопоток');
                document.getElementById('remoteAvatar').textContent = '🎤';
            });

            peer.on('error', (err) => {
                addDebug(`Ошибка peer: ${err.message}`);
                
                if (err.message.includes('ICE')) {
                    addDebug('Ошибка ICE, пробуем переподключиться');
                    
                    if (connectionAttempts < 3) {
                        connectionAttempts++;
                        setTimeout(() => {
                            if (remoteUser && !peer) {
                                createPeerConnection();
                            }
                        }, 2000);
                    }
                }
            });

            peer.on('close', () => {
                addDebug('Peer соединение закрыто');
                
                if (remoteUser) {
                    addDebug('Попытка переподключения...');
                    peer = null;
                    setTimeout(() => {
                        if (remoteUser && !peer) {
                            createPeerConnection();
                        }
                    }, 1000);
                } else {
                    peer = null;
                }
            });
        }

        function handleSignal(snapshot) {
            const signal = snapshot.val();
            
            if (!signal || signal.from === currentUser.id) return;
            
            const signalId = snapshot.key;
            
            // Проверяем, не обрабатывали ли мы уже этот сигнал
            if (processedSignals.has(signalId)) return;
            processedSignals.add(signalId);
            
            addDebug(`Получен сигнал от ${signal.from}`);
            
            if (peer) {
                try {
                    peer.signal(signal.data);
                    addDebug('Сигнал обработан');
                } catch (e) {
                    addDebug(`Ошибка обработки: ${e.message}`);
                }
            } else {
                addDebug('Peer не готов, сохраняем сигнал');
                // Если peer еще не создан, создаем и затем применяем сигнал
                if (remoteUser) {
                    createPeerConnection();
                    setTimeout(() => {
                        if (peer) {
                            try {
                                peer.signal(signal.data);
                            } catch (e) {
                                addDebug(`Ошибка отложенной обработки: ${e.message}`);
                            }
                        }
                    }, 500);
                }
            }
            
            // Удаляем обработанный сигнал
            setTimeout(() => {
                snapshot.ref.remove();
                processedSignals.delete(signalId);
            }, 1000);
        }

        function toggleMicrophone() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    isMicEnabled = !isMicEnabled;
                    audioTrack.enabled = isMicEnabled;
                    
                    const micBtn = document.getElementById('micBtn');
                    if (isMicEnabled) {
                        micBtn.classList.remove('muted');
                        micBtn.innerHTML = '🎤';
                    } else {
                        micBtn.classList.add('muted');
                        micBtn.innerHTML = '🔇';
                    }
                }
            }
        }

        function startTimer() {
            if (timerInterval) return;
            
            callStartTime = Date.now();
            timerInterval = setInterval(() => {
                if (callStartTime) {
                    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
                    const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                    const seconds = (elapsed % 60).toString().padStart(2, '0');
                    document.getElementById('callTimer').textContent = `${minutes}:${seconds}`;
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById('callTimer').textContent = '00:00';
        }

        function endCall() {
            addDebug('Завершение звонка');
            
            if (roomRef && currentUser.id) {
                roomRef.child('users/' + currentUser.id).remove();
                roomRef.child('users').off('value', handleUsersChange);
            }
            
            if (callRef) {
                callRef.off('child_added', handleSignal);
                callRef.remove();
            }
            
            if (peer) {
                peer.destroy();
                peer = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            
            stopTimer();
            processedSignals.clear();
            connectionAttempts = 0;
            
            resetToSetup();
        }

        function resetToSetup() {
            document.getElementById('setupSection').classList.remove('hidden');
            document.getElementById('callSection').classList.add('hidden');
            
            currentRoom = null;
            roomRef = null;
            callRef = null;
            remoteUser = null;
            joinBtn.disabled = false;
            
            document.getElementById('micBtn').classList.remove('muted');
            document.getElementById('micBtn').innerHTML = '🎤';
            isMicEnabled = true;
            document.getElementById('micLevel').style.width = '0%';
            document.getElementById('remoteAvatar').textContent = '👤';
        }

        function copyRoomId() {
            const roomId = document.getElementById('currentRoomId').textContent;
            navigator.clipboard.writeText(roomId).then(() => {
                showToast('ID комнаты скопирован');
            });
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        window.addEventListener('beforeunload', () => {
            if (roomRef && currentUser.id) {
                roomRef.child('users/' + currentUser.id).remove();
            }
            if (callRef) {
                callRef.remove();
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
