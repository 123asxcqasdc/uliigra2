<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Звонкие Улитки · надёжные звонки</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #0a2f1f;
            color: #e0f2e9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: #1a3f2a;
            border-radius: 32px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px rgba(0, 20, 10, 0.8);
            border: 1px solid #2a5a3a;
        }
        h1 {
            text-align: center;
            color: #8bc34a;
            font-size: 2.8rem;
            margin-bottom: 16px;
        }
        h1::before, h1::after {
            content: "🐌";
            font-size: 2.5rem;
            margin: 0 12px;
            display: inline-block;
            animation: crawl 4s infinite ease-in-out;
        }
        @keyframes crawl {
            0%,100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(6px) rotate(8deg); }
            75% { transform: translateX(-6px) rotate(-8deg); }
        }
        .setup-card, .call-card {
            background: #1e4a2e;
            border-radius: 24px;
            padding: 24px;
            margin: 20px 0;
            border: 1px solid #3a7a4a;
        }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: center;
        }
        input, button {
            background: #2a4a35;
            border: 1px solid #3e9e7a;
            border-radius: 24px;
            padding: 14px 24px;
            font-size: 1rem;
            color: white;
            outline: none;
            transition: 0.2s;
            font-weight: 500;
        }
        input:focus {
            border-color: #8bc34a;
            background: #1e4a2e;
            box-shadow: 0 0 0 3px rgba(139, 195, 74, 0.2);
        }
        button {
            background: #2e7d5e;
            border: none;
            cursor: pointer;
            font-weight: 600;
            min-width: 160px;
            box-shadow: 0 4px 0 #1a4a30;
        }
        button:hover {
            background: #3e9e7a;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1a4a30;
        }
        .room-header {
            background: #1a4a30;
            border-radius: 60px;
            padding: 12px 24px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
        }
        .badge {
            background: #2e7d5e;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
        }
        .participants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 20px 0 30px;
        }
        .participant-card {
            background: linear-gradient(145deg, #1e4a2e, #0e3a1e);
            border-radius: 24px;
            padding: 20px 16px 16px;
            border: 1px solid #3a7a4a;
            position: relative;
        }
        .participant-card.muted {
            opacity: 0.8;
            border-color: #b34a4a;
        }
        .participant-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #a5d6a5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .mute-badge {
            background: #b34a4a;
            color: #ffe0e0;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 40px;
        }
        .participant-avatar {
            font-size: 4rem;
            margin: 8px 0;
        }
        .participant-status {
            background: #1e3a2a;
            border-radius: 40px;
            padding: 6px 12px;
            font-size: 0.85rem;
            display: inline-block;
        }
        audio {
            width: 100%;
            margin: 12px 0 6px;
            border-radius: 30px;
            background: #1a3f2a;
            height: 40px;
        }
        .speaking-indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #6eff6e;
            position: absolute;
            top: 14px;
            right: 14px;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 50% { opacity: 0.6; transform: scale(1.2); } }
        .hidden-indicator { display: none; }
        .volume-indicator {
            width: 100%;
            height: 5px;
            background: #1e3a2a;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }
        .volume-level {
            height: 100%;
            width: 0%;
            background: #8bc34a;
            transition: width 0.1s;
        }
        .log-panel {
            background: #0e2a1a;
            border-radius: 18px;
            padding: 16px;
            margin-top: 24px;
            font-family: monospace;
            font-size: 0.8rem;
            max-height: 160px;
            overflow-y: auto;
        }
        .log-entry {
            border-bottom: 1px solid #1a4a2a;
            padding: 4px 0;
        }
        .unlock-audio {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #8bc34a;
            color: #0a2f1f;
            padding: 16px 28px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            z-index: 999;
            animation: pulse 1.8s infinite;
            border: none;
        }
        .unlock-audio.hidden { display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="unlockAudio" class="unlock-audio hidden">🔊 Нажмите для включения звука</div>

    <div class="container">
        <h1>Звонкие Улитки</h1>

        <div id="setup" class="setup-card">
            <div class="link-info" id="linkInfo"></div>
            <div id="autoJoinMessage" class="flex-row" style="background:#2e6b4e; border-radius:60px; padding:12px; margin-bottom:16px; display:none;">
                <span>🔄 Автоматическое подключение...</span>
            </div>
            <div class="flex-row">
                <input type="text" id="userName" placeholder="Ваше имя" value="Гость">
                <input type="text" id="roomId" placeholder="ID комнаты">
                <button onclick="createRoom()">✨ Создать</button>
                <button onclick="joinRoom()">🔗 Присоединиться</button>
                <button onclick="testMicrophone()" style="background:#1e4a2e;">🎤 Тест</button>
            </div>
        </div>

        <div id="call" class="call-card hidden">
            <div class="room-header">
                <span><strong>🏠 Комната:</strong> <span id="currentRoomDisplay"></span></span>
                <div style="display: flex; gap: 8px;">
                    <button onclick="copyRoomId()" style="padding:8px 16px; min-width:auto;">📋 Копировать ID</button>
                    <button onclick="copyCallLink()" style="padding:8px 16px; min-width:auto;">🔗 Ссылка</button>
                </div>
                <span class="badge" id="participantCount">0 участников</span>
            </div>
            <div id="status" style="text-align:center; background:#1a4a30; padding:12px; border-radius:40px; margin-bottom:16px;">⏳ Ожидание...</div>
            <div id="participantsGrid" class="participants-grid"></div>
            <div class="flex-row" style="justify-content: center; gap: 12px; margin-top: 24px;">
                <button onclick="toggleMic()" id="micBtn">🔇 Выкл микрофон</button>
                <button onclick="testAudioOutput()" style="background:#1e4a2e;">🔊 Тест звука</button>
                <button onclick="endCall()" style="background:#7d3e3e;">📞 Завершить</button>
            </div>
        </div>

        <div class="log-panel" id="log">
            <div class="log-entry">[Система] Готов к работе 🐌</div>
        </div>
    </div>

    <script>
        (function() {
            const firebaseConfig = {
                apiKey: "AIzaSyDTx2Y9ctiWp26YeMmAHAxDZd_gVI_ZMdw",
                authDomain: "kcalls.firebaseapp.com",
                databaseURL: "https://kcalls-default-rtdb.firebaseio.com",
                projectId: "kcalls",
                storageBucket: "kcalls.firebasestorage.app",
                messagingSenderId: "990117089104",
                appId: "1:990117089104:web:278a42c037e975ebb76655"
            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

            let localStream = null;
            let peers = {};
            let currentRoom = null;
            let currentUser = {
                id: 'u_' + Math.random().toString(36).substring(2, 10),
                name: 'Гость'
            };
            let allUsers = {};
            let pendingSignals = {};
            let roomRef = null;
            let callsRef = null;
            let audioElements = {};
            let muteStatus = {};
            let audioUnlocked = false;

            const setupDiv = document.getElementById('setup');
            const callDiv = document.getElementById('call');
            const micBtn = document.getElementById('micBtn');
            const userNameInput = document.getElementById('userName');
            const roomIdInput = document.getElementById('roomId');
            const currentRoomDisplay = document.getElementById('currentRoomDisplay');
            const logDiv = document.getElementById('log');
            const linkInfoDiv = document.getElementById('linkInfo');
            const autoJoinMessageDiv = document.getElementById('autoJoinMessage');
            const participantsGrid = document.getElementById('participantsGrid');
            const participantCountSpan = document.getElementById('participantCount');
            const unlockAudioDiv = document.getElementById('unlockAudio');
            const statusDiv = document.getElementById('status');

            function log(msg) {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                logDiv.appendChild(entry);
                logDiv.scrollTop = logDiv.scrollHeight;
            }

            function getIceServers() {
                return [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' },
                    {
                        urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'],
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    }
                ];
            }

            function updateParticipantsGrid() {
                if (!allUsers) return;
                let html = '';
                const sortedIds = Object.keys(allUsers).sort((a, b) => {
                    if (a === currentUser.id) return -1;
                    if (b === currentUser.id) return 1;
                    return (allUsers[a].name || '').localeCompare(allUsers[b].name || '');
                });

                sortedIds.forEach(userId => {
                    const user = allUsers[userId];
                    const isMe = userId === currentUser.id;
                    const peer = peers[userId];
                    const hasAudio = audioElements[userId] && audioElements[userId].srcObject;
                    const isMuted = muteStatus[userId] || (isMe && localStream && !localStream.getAudioTracks()[0]?.enabled);

                    let statusText = isMe ? (localStream?.getAudioTracks()[0]?.enabled ? '🎤 Микрофон включён' : '🔇 Микрофон выключен') :
                                    (peer?.connected ? (isMuted ? '🔇 Микрофон выключен' : '🎤 Микрофон включён') : '🔄 Соединение...');
                    let muteBadge = (isMe && !localStream?.getAudioTracks()[0]?.enabled) || (!isMe && isMuted) ? '<span class="mute-badge">🔇 Микрофон выкл</span>' : '';

                    html += `
                        <div class="participant-card ${isMuted ? 'muted' : ''}" id="participant-${userId}">
                            <div class="participant-name">${user.name}${isMe ? ' (Вы)' : ''} ${muteBadge}</div>
                            <div class="participant-avatar ${isMuted ? 'muted' : ''}">${isMuted ? '🔇' : '🐌'}</div>
                            <div class="participant-status">${statusText}</div>
                            ${!isMe ? `<audio id="audio-${userId}" controls style="width:100%; margin:10px 0;"></audio>` : ''}
                            <div class="speaking-indicator hidden-indicator" id="speaking-${userId}"></div>
                            <div class="volume-indicator"><div class="volume-level ${isMuted ? 'muted' : ''}" id="volume-${userId}"></div></div>
                        </div>
                    `;
                });
                participantsGrid.innerHTML = html;

                Object.keys(audioElements).forEach(userId => {
                    const newAudio = document.getElementById(`audio-${userId}`);
                    if (newAudio && audioElements[userId]?.srcObject) {
                        newAudio.srcObject = audioElements[userId].srcObject;
                        audioElements[userId] = newAudio;
                        if (audioUnlocked && !muteStatus[userId]) newAudio.play().catch(e => {});
                    }
                });
                participantCountSpan.textContent = `${Object.keys(allUsers).length} участников`;
            }

            function unlockAudio() {
                if (audioUnlocked) return;
                const ac = new (window.AudioContext || window.webkitAudioContext)();
                ac.resume().then(() => {
                    log('🔊 Аудио разблокировано');
                    audioUnlocked = true;
                    unlockAudioDiv.classList.add('hidden');
                    Object.values(audioElements).forEach(a => { if (a.srcObject) a.play().catch(e => {}); });
                });
            }
            unlockAudioDiv.onclick = unlockAudio;
            document.addEventListener('click', () => { if (!audioUnlocked) unlockAudio(); }, { once: true });

            async function testMicrophone() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    log('✅ Микрофон работает');
                    stream.getTracks().forEach(t => t.stop());
                } catch(e) { log('❌ Ошибка микрофона'); alert('Нет доступа к микрофону'); }
            }
            function testAudioOutput() {
                const ac = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ac.createOscillator();
                osc.connect(ac.destination);
                osc.frequency.value = 440;
                osc.start();
                osc.stop(ac.currentTime + 0.3);
                log('🔊 Тест звука');
            }

            function createPeerWith(userId, userName) {
                if (peers[userId]) return;
                log(`🔧 Создаём peer с ${userName}`);
                const isInit = currentUser.id < userId;

                const sendStream = new MediaStream();
                localStream.getAudioTracks().forEach(t => sendStream.addTrack(t.clone()));

                const peer = new SimplePeer({
                    initiator: isInit,
                    stream: sendStream,
                    trickle: false,
                    config: { iceServers: getIceServers() }
                });

                const audioEl = document.createElement('audio');
                audioEl.id = `audio-${userId}`;
                audioEl.autoplay = true;
                audioEl.controls = true;
                audioEl.style.display = 'none';
                document.body.appendChild(audioEl);
                audioElements[userId] = audioEl;

                peer.on('signal', data => {
                    log(`📤 Отправка сигнала для ${userName}`);
                    callsRef.push({ from: currentUser.id, to: userId, data });
                });

                peer.on('stream', stream => {
                    log(`🎵 Поток от ${userName}`);
                    audioElements[userId].srcObject = stream;
                    if (audioUnlocked) audioElements[userId].play().catch(e => {});
                    updateParticipantsGrid();

                    let interval = setInterval(() => {
                        if (!audioElements[userId]?.srcObject) return clearInterval(interval);
                        const ctx = new AudioContext();
                        const analyser = ctx.createAnalyser();
                        const src = ctx.createMediaStreamSource(stream);
                        src.connect(analyser);
                        const data = new Uint8Array(analyser.frequencyBinCount);
                        setInterval(() => {
                            analyser.getByteFrequencyData(data);
                            const avg = data.reduce((a,b)=>a+b)/data.length;
                            const vol = document.getElementById(`volume-${userId}`);
                            if (vol) vol.style.width = Math.min(100, (avg/128)*100) + '%';
                            const spk = document.getElementById(`speaking-${userId}`);
                            if (spk) spk.classList.toggle('hidden-indicator', avg <= 20);
                        }, 100);
                        clearInterval(interval);
                    }, 100);
                });

                peer.on('connect', () => log(`✅ Соединение с ${userName} установлено!`));
                peer.on('error', e => log(`❌ Ошибка: ${e.message}`));
                peer.on('close', () => {
                    log(`🔒 Peer с ${userName} закрыт`);
                    delete peers[userId];
                    if (audioElements[userId]) audioElements[userId].remove();
                    delete audioElements[userId];
                });

                peers[userId] = peer;

                if (pendingSignals[userId]?.length) {
                    setTimeout(() => {
                        if (peers[userId]) {
                            pendingSignals[userId].forEach(s => peers[userId].signal(s));
                            delete pendingSignals[userId];
                        }
                    }, 500);
                }
            }

            async function joinRoom() {
                const roomId = roomIdInput.value.trim();
                if (!roomId) return alert('Введите ID комнаты');
                autoJoinMessageDiv.style.display = 'none';

                try {
                    statusDiv.textContent = '🎤 Запрос микрофона...';
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    localStream.getAudioTracks().forEach(t => t.enabled = true);
                    log('✅ Микрофон получен');

                    currentRoom = roomId;
                    currentRoomDisplay.textContent = roomId;
                    setupDiv.classList.add('hidden');
                    callDiv.classList.remove('hidden');

                    roomRef = db.ref('rooms/' + roomId);
                    await roomRef.child('users/' + currentUser.id).set({ name: currentUser.name, timestamp: Date.now() });
                    roomRef.child('users/' + currentUser.id).onDisconnect().remove();

                    roomRef.child('mute').on('value', snap => {
                        const mutes = snap.val() || {};
                        Object.keys(mutes).forEach(uid => { if (uid !== currentUser.id) muteStatus[uid] = mutes[uid].muted; });
                        updateParticipantsGrid();
                    });

                    callsRef = db.ref('calls/' + roomId);
                    callsRef.on('child_added', snap => {
                        const signal = snap.val();
                        if (signal.from !== currentUser.id) {
                            log(`📨 Сигнал от ${signal.from}`);
                            if (peers[signal.from]) {
                                peers[signal.from].signal(signal.data);
                            } else {
                                if (!pendingSignals[signal.from]) pendingSignals[signal.from] = [];
                                pendingSignals[signal.from].push(signal.data);
                            }
                            snap.ref.remove();
                        }
                    });

                    roomRef.child('users').on('value', snap => {
                        const users = snap.val() || {};
                        const old = Object.keys(allUsers);
                        allUsers = users;

                        Object.keys(users).forEach(uid => {
                            if (uid !== currentUser.id && !peers[uid]) {
                                log(`🔔 Новый участник: ${users[uid].name}`);
                                createPeerWith(uid, users[uid].name);
                            }
                        });

                        old.forEach(uid => {
                            if (uid !== currentUser.id && !users[uid]) {
                                log(`🔔 Участник отключился: ${allUsers[uid]?.name || uid}`);
                                if (peers[uid]) peers[uid].destroy();
                                delete peers[uid];
                                if (audioElements[uid]) audioElements[uid].remove();
                                delete audioElements[uid];
                            }
                        });

                        updateParticipantsGrid();
                        statusDiv.textContent = `👥 В комнате: ${Object.keys(users).length} участников`;
                    });

                } catch(e) {
                    log('❌ Ошибка: ' + e.message);
                    alert('Ошибка доступа к микрофону');
                    setupDiv.classList.remove('hidden');
                    callDiv.classList.add('hidden');
                }
            }

            window.createRoom = () => {
                roomIdInput.value = Math.random().toString(36).substring(2, 8);
                updateLinkInfo(roomIdInput.value);
                log('Создана комната: ' + roomIdInput.value);
                joinRoom();
            };
            window.joinRoom = joinRoom;
            window.toggleMic = () => {
                if (!localStream) return;
                const track = localStream.getAudioTracks()[0];
                track.enabled = !track.enabled;
                micBtn.textContent = track.enabled ? '🔇 Выкл микрофон' : '🎤 Вкл микрофон';
                muteStatus[currentUser.id] = !track.enabled;
                if (roomRef) roomRef.child('mute/' + currentUser.id).set({ muted: !track.enabled });
                updateParticipantsGrid();
            };
            window.endCall = () => {
                log('Завершение звонка');
                if (roomRef) {
                    roomRef.child('users').off();
                    roomRef.child('mute').off();
                    roomRef.child('users/' + currentUser.id).remove();
                }
                if (callsRef) callsRef.off();
                Object.values(peers).forEach(p => p.destroy());
                Object.values(audioElements).forEach(a => a.remove());
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                peers = {}; audioElements = {}; allUsers = {}; muteStatus = {}; pendingSignals = {};
                currentRoom = null; localStream = null; roomRef = null; callsRef = null;
                setupDiv.classList.remove('hidden');
                callDiv.classList.add('hidden');
                unlockAudioDiv.classList.add('hidden');
                log('✅ Звонок завершён');
            };
            window.copyRoomId = () => {
                const id = currentRoomDisplay.textContent;
                navigator.clipboard.writeText(id).then(() => alert('ID скопирован'));
            };
            window.copyCallLink = () => {
                const link = window.location.origin + window.location.pathname + '?call=' + currentRoom;
                navigator.clipboard.writeText(link).then(() => alert('Ссылка скопирована'));
            };
            window.testMicrophone = testMicrophone;
            window.testAudioOutput = testAudioOutput;

            function updateLinkInfo(roomId) {
                if (roomId) linkInfoDiv.innerHTML = `🔗 Ссылка: ${window.location.origin + window.location.pathname}?call=${roomId}`;
                else linkInfoDiv.innerHTML = '';
            }
            function getUrlParams() { return new URLSearchParams(window.location.search).get('call'); }

            (function autoJoin() {
                const call = getUrlParams();
                if (call) {
                    roomIdInput.value = call;
                    updateLinkInfo(call);
                    autoJoinMessageDiv.style.display = 'flex';
                    setTimeout(() => joinRoom(), 1000);
                }
            })();

            userNameInput.oninput = e => currentUser.name = e.target.value || 'Гость';
        })();
    </script>
</body>
</html>
