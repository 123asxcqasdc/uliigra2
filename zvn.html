<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kcalls - Групповые звонки</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- SimplePeer -->
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
            background: #0a2f1f;
            color: #e0f2e9;
        }
        .container {
            background: #1a3f2a;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 1px solid #2a5a3a;
        }
        h1 {
            color: #8bc34a;
            margin-bottom: 25px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        input, button {
            padding: 12px 18px;
            margin: 8px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #2a5a3a;
            background: #2a4a35;
            color: #e0f2e9;
            transition: all 0.3s;
        }
        input {
            width: 250px;
            background: #1a3f2a;
            border: 1px solid #3a6b4a;
        }
        input::placeholder {
            color: #8fbc8f;
        }
        button {
            background: #2e7d5e;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid #3e9e7a;
        }
        button:hover {
            background: #3e9e7a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,100,50,0.4);
        }
        .hidden { display: none; }
        .status {
            padding: 12px;
            margin: 15px 0;
            background: #1a4a30;
            border-radius: 8px;
            color: #b8e0b8;
            border-left: 4px solid #8bc34a;
            font-weight: bold;
        }
        .room-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #1a4a30;
            padding: 12px;
            border-radius: 8px;
        }
        .participants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }
        .participant-card {
            background: linear-gradient(145deg, #1e4a2e, #0e3a1e);
            color: #e8f5e8;
            padding: 18px;
            border-radius: 12px;
            position: relative;
            border: 1px solid #3a7a4a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .participant-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,80,40,0.4);
        }
        .participant-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #a5d6a5;
        }
        .participant-status {
            font-size: 13px;
            background: #1e3a2a;
            padding: 4px 8px;
            border-radius: 15px;
            display: inline-block;
            color: #b8e0b8;
        }
        .participant-avatar {
            font-size: 45px;
            margin: 10px 0;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }
        .speaking-indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #6eff6e;
            position: absolute;
            top: 12px;
            right: 12px;
            box-shadow: 0 0 10px #00ff00;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .hidden-indicator {
            display: none;
        }
        .log {
            margin-top: 25px;
            text-align: left;
            background: #0e2a1a;
            color: #a0e0a0;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #2a5a3a;
        }
        .log-entry {
            margin: 3px 0;
            border-bottom: 1px solid #1a4a2a;
            padding-bottom: 2px;
        }
        .link-info {
            background: #1a4a30;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            border: 1px solid #3a7a4a;
        }
        .auto-join-message {
            background: #2e6b4e;
            color: #e0ffe0;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
            border-left: 4px solid #8bc34a;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .user-count {
            background: #1a4a30;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            color: #b8e0b8;
            border: 1px solid #3a7a4a;
        }
        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 Kcalls — Групповые звонки</h1>
        
        <div id="setup">
            <div class="link-info" id="linkInfo"></div>
            <div id="autoJoinMessage" class="auto-join-message hidden"></div>
            <input type="text" id="userName" placeholder="Ваше имя" value="Гость">
            <br>
            <input type="text" id="roomId" placeholder="ID комнаты">
            <br>
            <button onclick="createRoom()">✨ Создать комнату</button>
            <button onclick="joinRoom()">🔗 Присоединиться</button>
        </div>

        <div id="call" class="hidden">
            <div class="room-header">
                <strong>🏠 Комната: <span id="currentRoomDisplay"></span></strong>
                <button onclick="copyRoomId()" style="padding: 6px 12px;">📋 Копировать ID</button>
                <button onclick="copyCallLink()" style="padding: 6px 12px;">🔗 Скопировать ссылку</button>
                <span id="participantCount" class="user-count">0 участников</span>
            </div>
            
            <div id="status" class="status">Ожидание...</div>
            
            <!-- Сетка участников -->
            <div id="participantsGrid" class="participants-grid"></div>
            
            <div class="controls">
                <button onclick="toggleMic()" id="micBtn">🔇 Выкл микрофон</button>
                <button onclick="endCall()" style="background: #7d3e3e;">📞 Завершить</button>
                <button onclick="retryAllConnections()" style="background: #7d6b3e;">🔄 Переподключить всех</button>
            </div>
        </div>

        <!-- Блок логов -->
        <div id="log" class="log">
            <div class="log-entry">[Система] Лог загружен</div>
        </div>
    </div>

    <script>
        // Firebase
        firebase.initializeApp({
            apiKey: "AIzaSyDTx2Y9ctiWp26YeMmAHAxDZd_gVI_ZMdw",
            authDomain: "kcalls.firebaseapp.com",
            databaseURL: "https://kcalls-default-rtdb.firebaseio.com",
            projectId: "kcalls",
            storageBucket: "kcalls.firebasestorage.app",
            messagingSenderId: "990117089104",
            appId: "1:990117089104:web:278a42c037e975ebb76655"
        });
        const db = firebase.database();

        // Переменные
        let localStream = null;
        let peers = {};
        let currentRoom = null;
        let currentUser = {
            id: 'user_' + Math.random().toString(36).substring(2, 10),
            name: 'Гость'
        };
        let allUsers = {};
        let autoJoinAttempted = false;
        let reconnectTimeouts = {};
        let pendingSignals = {};

        // Элементы
        const setupDiv = document.getElementById('setup');
        const callDiv = document.getElementById('call');
        const statusDiv = document.getElementById('status');
        const micBtn = document.getElementById('micBtn');
        const userNameInput = document.getElementById('userName');
        const roomIdInput = document.getElementById('roomId');
        const currentRoomDisplay = document.getElementById('currentRoomDisplay');
        const logDiv = document.getElementById('log');
        const linkInfoDiv = document.getElementById('linkInfo');
        const autoJoinMessageDiv = document.getElementById('autoJoinMessage');
        const participantsGrid = document.getElementById('participantsGrid');
        const participantCountSpan = document.getElementById('participantCount');

        // ==================== ЗВУКОВЫЕ ЭФФЕКТЫ ====================
        function playSound(type) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Возобновляем контекст, если он приостановлен (нужно для некоторых браузеров)
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                // Настройки звука в зависимости от типа события
                switch(type) {
                    case 'join': // Вход в комнату
                        oscillator.frequency.value = 880; // Нота Ля
                        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.3);
                        break;
                        
                    case 'participant-joined': // Подключился участник
                        oscillator.frequency.value = 659.25; // Нота Ми
                        gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.2);
                        
                        // Добавляем второй короткий звук через 0.1 сек
                        setTimeout(() => {
                            const osc2 = audioContext.createOscillator();
                            const gain2 = audioContext.createGain();
                            osc2.connect(gain2);
                            gain2.connect(audioContext.destination);
                            osc2.frequency.value = 880; // Ля
                            gain2.gain.setValueAtTime(0.1, audioContext.currentTime);
                            gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                            osc2.start();
                            osc2.stop(audioContext.currentTime + 0.15);
                        }, 100);
                        break;
                        
                    case 'participant-left': // Отключился участник
                        oscillator.frequency.value = 440; // Нота Ля (октавой ниже)
                        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.25);
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.25);
                        break;
                        
                    case 'message': // Получение сигнала (тихий)
                        oscillator.frequency.value = 523.25; // До
                        gainNode.gain.setValueAtTime(0.03, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.1);
                        break;
                        
                    case 'connected': // Соединение установлено
                        oscillator.frequency.value = 1046.5; // До (высокое)
                        gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.4);
                        
                        // Трель из двух нот
                        setTimeout(() => {
                            const osc2 = audioContext.createOscillator();
                            const gain2 = audioContext.createGain();
                            osc2.connect(gain2);
                            gain2.connect(audioContext.destination);
                            osc2.frequency.value = 1318.5; // Ми
                            gain2.gain.setValueAtTime(0.15, audioContext.currentTime);
                            gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                            osc2.start();
                            osc2.stop(audioContext.currentTime + 0.3);
                        }, 150);
                        break;
                }
            } catch (e) {
                console.log('Ошибка воспроизведения звука:', e);
            }
        }

        // Логирование
        function log(message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            
            // Воспроизводим звук для некоторых типов сообщений
            if (message.includes('Получен сигнал')) {
                playSound('message');
            }
        }

        // Получаем параметры из URL
        function getUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('call');
        }

        // Обновляем информацию о ссылке
        function updateLinkInfo(roomId) {
            if (roomId) {
                const link = window.location.origin + window.location.pathname + '?call=' + roomId;
                linkInfoDiv.innerHTML = `🔗 Ссылка для приглашения: <br><small style="color: #b8e0b8;">${link}</small>`;
            } else {
                linkInfoDiv.innerHTML = '';
            }
        }

        // Обновление сетки участников
        function updateParticipantsGrid() {
            if (!allUsers) return;
            
            let html = '';
            const userIds = Object.keys(allUsers);
            
            const sortedIds = userIds.sort((a, b) => {
                if (a === currentUser.id) return -1;
                if (b === currentUser.id) return 1;
                return (allUsers[a].name || '').localeCompare(allUsers[b].name || '');
            });
            
            sortedIds.forEach(userId => {
                const user = allUsers[userId];
                if (!user) return;
                
                const isMe = userId === currentUser.id;
                const peer = peers[userId];
                
                let statusText = '⏳ Подключение...';
                
                if (isMe) {
                    statusText = localStream?.getAudioTracks()[0]?.enabled ? '🎤 Готов' : '🔇 Микрофон выключен';
                } else if (peer) {
                    if (peer.connected || peer._remoteStreams?.length > 0) {
                        statusText = '✅ Подключён';
                    } else if (peer.destroyed) {
                        statusText = '❌ Ошибка';
                    } else {
                        statusText = '🔄 Соединение...';
                    }
                }
                
                html += `
                    <div class="participant-card" id="participant-${userId}">
                        <div class="participant-name">${user.name}${isMe ? ' (Вы)' : ''}</div>
                        <div class="participant-avatar">👤</div>
                        <div class="participant-status">${statusText}</div>
                        <div class="speaking-indicator hidden-indicator" id="speaking-${userId}"></div>
                    </div>
                `;
            });
            
            participantsGrid.innerHTML = html;
            
            const count = Object.keys(allUsers).length;
            participantCountSpan.textContent = `${count} ${count === 1 ? 'участник' : (count < 5 ? 'участника' : 'участников')}`;
        }

        // Автоматическое подключение при загрузке
        async function autoJoin() {
            const callParam = getUrlParams();
            if (callParam && !autoJoinAttempted) {
                autoJoinAttempted = true;
                roomIdInput.value = callParam;
                updateLinkInfo(callParam);
                
                autoJoinMessageDiv.textContent = `🔄 Автоматическое подключение к комнате ${callParam}...`;
                autoJoinMessageDiv.classList.remove('hidden');
                
                log('🔗 Обнаружена ссылка на комнату: ' + callParam);
                log('🔄 Автоматическое подключение...');
                
                setTimeout(() => {
                    joinRoom();
                }, 1000);
            }
        }

        window.addEventListener('load', autoJoin);

        userNameInput.oninput = (e) => currentUser.name = e.target.value || 'Гость';

        function copyRoomId() {
            const roomId = currentRoomDisplay.textContent;
            navigator.clipboard.writeText(roomId).then(() => {
                log('ID комнаты скопирован');
                alert('ID комнаты скопирован');
            }).catch(() => {
                log('Ошибка копирования ID');
                alert('Не удалось скопировать');
            });
        }

        function copyCallLink() {
            const roomId = currentRoomDisplay.textContent;
            const link = window.location.origin + window.location.pathname + '?call=' + roomId;
            navigator.clipboard.writeText(link).then(() => {
                log('Ссылка на звонок скопирована');
                alert('Ссылка на звонок скопирована');
            }).catch(() => {
                log('Ошибка копирования ссылки');
                alert('Не удалось скопировать ссылку');
            });
        }

        function createRoom() {
            roomIdInput.value = Math.random().toString(36).substring(2, 8);
            updateLinkInfo(roomIdInput.value);
            log('Создана новая комната: ' + roomIdInput.value);
            joinRoom();
        }

        // ICE серверы
        function getIceServers() {
            return [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
                {
                    urls: 'turn:openrelay.metered.ca:80',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ];
        }

        async function joinRoom() {
            const roomId = roomIdInput.value.trim();
            if (!roomId) {
                log('Ошибка: не введен ID комнаты');
                return alert('Введите ID комнаты');
            }

            autoJoinMessageDiv.classList.add('hidden');

            try {
                statusDiv.textContent = '🎤 Запрашиваем микрофон...';
                log('Запрос доступа к микрофону...');
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }, 
                    video: false 
                });
                log('✅ Микрофон получен');
                
                // Звук входа
                playSound('join');
                
                currentRoom = roomId;
                currentRoomDisplay.textContent = roomId;
                updateLinkInfo(roomId);
                setupDiv.classList.add('hidden');
                callDiv.classList.remove('hidden');
                
                const roomRef = db.ref('rooms/' + roomId);
                
                // Добавляем себя
                await roomRef.child('users/' + currentUser.id).set({ 
                    name: currentUser.name,
                    timestamp: Date.now()
                });
                roomRef.child('users/' + currentUser.id).onDisconnect().remove();
                log('Подключен к комнате ' + roomId);

                // Слушаем сигналы
                db.ref('calls/' + roomId).on('child_added', (snap) => {
                    const signal = snap.val();
                    if (signal.from !== currentUser.id) {
                        log(`📨 Получен сигнал от ${signal.from}`);
                        
                        if (peers[signal.from] && !peers[signal.from].destroyed) {
                            try {
                                peers[signal.from].signal(signal.data);
                                log('✅ Сигнал применен');
                            } catch (e) {
                                log(`❌ Ошибка применения сигнала: ${e.message}`);
                                if (!pendingSignals[signal.from]) pendingSignals[signal.from] = [];
                                pendingSignals[signal.from].push(signal.data);
                            }
                        } else {
                            if (!pendingSignals[signal.from]) pendingSignals[signal.from] = [];
                            pendingSignals[signal.from].push(signal.data);
                            log(`📦 Сигнал сохранен в очередь (${pendingSignals[signal.from].length})`);
                        }
                        snap.ref.remove();
                    }
                });

                // Следим за пользователями
                roomRef.child('users').on('value', (snap) => {
                    const users = snap.val();
                    if (!users) return;
                    
                    // Определяем новых пользователей (которые появились сейчас)
                    const newUsers = Object.keys(users).filter(id => 
                        id !== currentUser.id && !allUsers[id]
                    );
                    
                    // Определяем отключившихся пользователей
                    const leftUsers = Object.keys(allUsers).filter(id => 
                        id !== currentUser.id && !users[id]
                    );
                    
                    // Обновляем список всех пользователей
                    allUsers = users;
                    
                    // Звуки для новых участников
                    newUsers.forEach(userId => {
                        playSound('participant-joined');
                        log(`🔔 Новый участник: ${users[userId].name}`);
                    });
                    
                    // Звуки для отключившихся
                    leftUsers.forEach(userId => {
                        playSound('participant-left');
                        log(`🔔 Участник отключился: ${allUsers[userId]?.name || userId}`);
                    });
                    
                    // Находим новых пользователей и создаем peer
                    Object.keys(users).forEach(userId => {
                        if (userId !== currentUser.id && !peers[userId]) {
                            const newUser = users[userId];
                            createPeerWith(userId, newUser.name);
                        }
                    });
                    
                    // Удаляем отключившихся
                    Object.keys(peers).forEach(userId => {
                        if (!users[userId]) {
                            if (reconnectTimeouts[userId]) {
                                clearTimeout(reconnectTimeouts[userId]);
                                delete reconnectTimeouts[userId];
                            }
                            if (peers[userId] && !peers[userId].destroyed) {
                                peers[userId].destroy();
                            }
                            delete peers[userId];
                            
                            const audioEl = document.getElementById(`audio-${userId}`);
                            if (audioEl) audioEl.remove();
                        }
                    });
                    
                    updateParticipantsGrid();
                    
                    const count = Object.keys(users).length;
                    statusDiv.textContent = `👥 В комнате: ${count} ${count === 1 ? 'участник' : (count < 5 ? 'участника' : 'участников')}`;
                });

            } catch (err) {
                log('❌ Ошибка: ' + err.message);
                alert('Ошибка: ' + err.message);
                autoJoinMessageDiv.classList.add('hidden');
            }
        }

        function createPeerWith(userId, userName) {
            log(`🔧 Создаем peer с ${userName} (${userId})`);
            
            const isInit = currentUser.id < userId;
            
            try {
                const peer = new SimplePeer({ 
                    initiator: isInit, 
                    stream: localStream,
                    trickle: true,
                    config: { iceServers: getIceServers() }
                });
                
                peer.remoteName = userName;
                
                const audioEl = document.createElement('audio');
                audioEl.id = `audio-${userId}`;
                audioEl.autoplay = true;
                audioEl.style.display = 'none';
                document.body.appendChild(audioEl);

                peer.on('signal', data => {
                    log(`📤 Отправка сигнала для ${userName}`);
                    db.ref('calls/' + currentRoom).push({
                        from: currentUser.id,
                        to: userId,
                        data: data
                    });
                });

                peer.on('stream', stream => {
                    log(`🎵 Получен аудиопоток от ${userName}`);
                    audioEl.srcObject = stream;
                    updateParticipantsGrid();
                    
                    // Звук успешного подключения
                    playSound('connected');
                    
                    // Визуализация говорящего
                    try {
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const analyser = audioContext.createAnalyser();
                        const source = audioContext.createMediaStreamSource(stream);
                        source.connect(analyser);
                        
                        analyser.fftSize = 256;
                        const dataArray = new Uint8Array(analyser.frequencyBinCount);
                        
                        const interval = setInterval(() => {
                            analyser.getByteFrequencyData(dataArray);
                            const avg = dataArray.reduce((a, b) => a + b) / dataArray.length;
                            const indicator = document.getElementById(`speaking-${userId}`);
                            if (indicator) {
                                if (avg > 15) {
                                    indicator.classList.remove('hidden-indicator');
                                } else {
                                    indicator.classList.add('hidden-indicator');
                                }
                            }
                        }, 150);
                        
                        peer.once('close', () => clearInterval(interval));
                    } catch (e) {
                        log(`Ошибка анализатора: ${e.message}`);
                    }
                    
                    // Применяем накопленные сигналы
                    if (pendingSignals[userId] && pendingSignals[userId].length > 0) {
                        log(`📦 Применяем ${pendingSignals[userId].length} накопленных сигналов`);
                        pendingSignals[userId].forEach(signalData => {
                            try {
                                peer.signal(signalData);
                            } catch (e) {
                                log(`Ошибка при накопленном сигнале: ${e.message}`);
                            }
                        });
                        delete pendingSignals[userId];
                    }
                });

                peer.on('connect', () => {
                    log(`✅ Peer соединение с ${userName} установлено`);
                    updateParticipantsGrid();
                    
                    if (reconnectTimeouts[userId]) {
                        clearTimeout(reconnectTimeouts[userId]);
                        delete reconnectTimeouts[userId];
                    }
                });

                peer.on('error', (err) => {
                    log(`❌ Ошибка peer с ${userName}: ${err.message}`);
                    updateParticipantsGrid();
                    
                    if (!reconnectTimeouts[userId] && allUsers[userId]) {
                        reconnectTimeouts[userId] = setTimeout(() => {
                            log(`🔄 Переподключение к ${userName}...`);
                            if (peers[userId] && !peers[userId].destroyed) {
                                peers[userId].destroy();
                            }
                            delete peers[userId];
                            createPeerWith(userId, userName);
                            delete reconnectTimeouts[userId];
                        }, 3000);
                    }
                });

                peer.on('close', () => {
                    log(`🔒 Peer с ${userName} закрыт`);
                    audioEl.remove();
                    updateParticipantsGrid();
                });

                peers[userId] = peer;
                
                // Проверяем накопленные сигналы
                if (pendingSignals[userId] && pendingSignals[userId].length > 0) {
                    log(`📦 Есть ${pendingSignals[userId].length} накопленных сигналов для ${userName}`);
                    setTimeout(() => {
                        if (peers[userId] && !peers[userId].destroyed) {
                            pendingSignals[userId].forEach(signalData => {
                                try {
                                    peers[userId].signal(signalData);
                                } catch (e) {
                                    log(`Ошибка при накопленном сигнале: ${e.message}`);
                                }
                            });
                            delete pendingSignals[userId];
                        }
                    }, 1000);
                }

            } catch (err) {
                log(`❌ Ошибка создания peer с ${userName}: ${err.message}`);
            }
        }

        function toggleMic() {
            if (localStream) {
                const track = localStream.getAudioTracks()[0];
                track.enabled = !track.enabled;
                micBtn.textContent = track.enabled ? '🔇 Выкл микрофон' : '🎤 Вкл микрофон';
                log('Микрофон ' + (track.enabled ? 'включен' : 'выключен'));
                updateParticipantsGrid();
            }
        }

        function retryAllConnections() {
            log('🔄 Переподключение ко всем участникам');
            
            Object.values(reconnectTimeouts).forEach(timeout => clearTimeout(timeout));
            reconnectTimeouts = {};
            
            const users = { ...allUsers };
            Object.keys(peers).forEach(userId => {
                const userName = peers[userId]?.remoteName || users[userId]?.name || userId;
                if (peers[userId] && !peers[userId].destroyed) {
                    peers[userId].destroy();
                }
                delete peers[userId];
                
                const audioEl = document.getElementById(`audio-${userId}`);
                if (audioEl) audioEl.remove();
                
                if (users[userId]) {
                    createPeerWith(userId, userName);
                }
            });
        }

        function endCall() {
            log('Завершение звонка');
            
            Object.values(reconnectTimeouts).forEach(timeout => clearTimeout(timeout));
            reconnectTimeouts = {};
            
            if (currentRoom) {
                db.ref('rooms/' + currentRoom + '/users/' + currentUser.id).remove();
                db.ref('calls/' + currentRoom).remove();
            }
            
            Object.values(peers).forEach(peer => {
                if (peer && !peer.destroyed) peer.destroy();
            });
            peers = {};
            
            document.querySelectorAll('audio[id^="audio-"]').forEach(el => el.remove());
            
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            
            pendingSignals = {};
            allUsers = {};
            
            setupDiv.classList.remove('hidden');
            callDiv.classList.add('hidden');
            updateLinkInfo(roomIdInput.value);
            autoJoinAttempted = false;
        }
    </script>
</body>
</html>
