<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kcalls - Групповые звонки</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- SimplePeer -->
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
            background: #0a2f1f;
            color: #e0f2e9;
        }
        .container {
            background: #1a3f2a;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 1px solid #2a5a3a;
        }
        h1 {
            color: #8bc34a;
            margin-bottom: 25px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        input, button {
            padding: 12px 18px;
            margin: 8px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #2a5a3a;
            background: #2a4a35;
            color: #e0f2e9;
            transition: all 0.3s;
        }
        input {
            width: 250px;
            background: #1a3f2a;
            border: 1px solid #3a6b4a;
        }
        input::placeholder {
            color: #8fbc8f;
        }
        button {
            background: #2e7d5e;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid #3e9e7a;
        }
        button:hover {
            background: #3e9e7a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,100,50,0.4);
        }
        .hidden { display: none; }
        .status {
            padding: 12px;
            margin: 15px 0;
            background: #1a4a30;
            border-radius: 8px;
            color: #b8e0b8;
            border-left: 4px solid #8bc34a;
            font-weight: bold;
        }
        .room-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #1a4a30;
            padding: 12px;
            border-radius: 8px;
        }
        .participants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }
        .participant-card {
            background: linear-gradient(145deg, #1e4a2e, #0e3a1e);
            color: #e8f5e8;
            padding: 18px;
            border-radius: 12px;
            position: relative;
            border: 1px solid #3a7a4a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .participant-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,80,40,0.4);
        }
        .participant-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #a5d6a5;
        }
        .participant-status {
            font-size: 13px;
            background: #1e3a2a;
            padding: 4px 8px;
            border-radius: 15px;
            display: inline-block;
            color: #b8e0b8;
        }
        .participant-avatar {
            font-size: 45px;
            margin: 10px 0;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }
        .speaking-indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #6eff6e;
            position: absolute;
            top: 12px;
            right: 12px;
            box-shadow: 0 0 10px #00ff00;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .hidden-indicator {
            display: none;
        }
        .log {
            margin-top: 25px;
            text-align: left;
            background: #0e2a1a;
            color: #a0e0a0;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #2a5a3a;
        }
        .log-entry {
            margin: 3px 0;
            border-bottom: 1px solid #1a4a2a;
            padding-bottom: 2px;
        }
        .link-info {
            background: #1a4a30;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            border: 1px solid #3a7a4a;
        }
        .auto-join-message {
            background: #2e6b4e;
            color: #e0ffe0;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
            border-left: 4px solid #8bc34a;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .user-count {
            background: #1a4a30;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            color: #b8e0b8;
            border: 1px solid #3a7a4a;
        }
        .unlock-audio {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #8bc34a;
            color: #0a2f1f;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: pulse 2s infinite;
        }
        .unlock-audio:hover {
            background: #a5d6a5;
        }
        audio {
            display: none;
        }
        .volume-indicator {
            width: 100%;
            height: 4px;
            background: #1e3a2a;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }
        .volume-level {
            height: 100%;
            width: 0%;
            background: #8bc34a;
            transition: width 0.1s;
        }
        .debug-panel {
            margin-top: 10px;
            font-size: 11px;
            color: #a0d0a0;
            text-align: left;
            background: #1a3f2a;
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="unlockAudio" class="unlock-audio hidden">🔊 Нажмите для включения звука</div>

    <div class="container">
        <h1>🌿 Kcalls — Групповые звонки</h1>
        
        <div id="setup">
            <div class="link-info" id="linkInfo"></div>
            <div id="autoJoinMessage" class="auto-join-message hidden"></div>
            <input type="text" id="userName" placeholder="Ваше имя" value="Гость">
            <br>
            <input type="text" id="roomId" placeholder="ID комнаты">
            <br>
            <button onclick="createRoom()">✨ Создать комнату</button>
            <button onclick="joinRoom()">🔗 Присоединиться</button>
            <button onclick="testMicrophone()" style="background: #1e4a2e;">🎤 Тест микрофона</button>
        </div>

        <div id="call" class="hidden">
            <div class="room-header">
                <strong>🏠 Комната: <span id="currentRoomDisplay"></span></strong>
                <button onclick="copyRoomId()" style="padding: 6px 12px;">📋 Копировать ID</button>
                <button onclick="copyCallLink()" style="padding: 6px 12px;">🔗 Скопировать ссылку</button>
                <span id="participantCount" class="user-count">0 участников</span>
            </div>
            
            <div id="status" class="status">Ожидание...</div>
            
            <!-- Сетка участников -->
            <div id="participantsGrid" class="participants-grid"></div>
            
            <div class="controls">
                <button onclick="toggleMic()" id="micBtn">🔇 Выкл микрофон</button>
                <button onclick="testAudioOutput()" id="testAudioBtn" style="background: #1e4a2e;">🔊 Тест звука</button>
                <button onclick="forceAudioRestart()" style="background: #7d6b3e;">🔄 Перезапустить аудио</button>
                <button onclick="endCall()" style="background: #7d3e3e;">📞 Завершить</button>
            </div>
            
            <div class="debug-panel" id="debugPanel"></div>
        </div>

        <!-- Блок логов -->
        <div id="log" class="log">
            <div class="log-entry">[Система] Лог загружен</div>
        </div>
    </div>

    <script>
        // Firebase
        firebase.initializeApp({
            apiKey: "AIzaSyDTx2Y9ctiWp26YeMmAHAxDZd_gVI_ZMdw",
            authDomain: "kcalls.firebaseapp.com",
            databaseURL: "https://kcalls-default-rtdb.firebaseio.com",
            projectId: "kcalls",
            storageBucket: "kcalls.firebasestorage.app",
            messagingSenderId: "990117089104",
            appId: "1:990117089104:web:278a42c037e975ebb76655"
        });
        const db = firebase.database();

        // Переменные
        let localStream = null;
        let peers = {};
        let currentRoom = null;
        let currentUser = {
            id: 'user_' + Math.random().toString(36).substring(2, 10),
            name: 'Гость'
        };
        let allUsers = {};
        let autoJoinAttempted = false;
        let reconnectTimeouts = {};
        let pendingSignals = {};
        let roomRef = null;
        let callsRef = null;
        let analyserIntervals = {};
        let audioElements = {};
        let peerStreams = {}; // Отслеживаем, от кого получили поток

        // Элементы
        const setupDiv = document.getElementById('setup');
        const callDiv = document.getElementById('call');
        const statusDiv = document.getElementById('status');
        const micBtn = document.getElementById('micBtn');
        const userNameInput = document.getElementById('userName');
        const roomIdInput = document.getElementById('roomId');
        const currentRoomDisplay = document.getElementById('currentRoomDisplay');
        const logDiv = document.getElementById('log');
        const linkInfoDiv = document.getElementById('linkInfo');
        const autoJoinMessageDiv = document.getElementById('autoJoinMessage');
        const participantsGrid = document.getElementById('participantsGrid');
        const participantCountSpan = document.getElementById('participantCount');
        const unlockAudioDiv = document.getElementById('unlockAudio');
        const debugPanel = document.getElementById('debugPanel');

        // ==================== РАЗБЛОКИРОВКА АУДИО ====================
        let audioUnlocked = false;

        function unlockAudio() {
            if (audioUnlocked) return;
            
            // Создаем пустой аудио контекст для разблокировки
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioContext.resume().then(() => {
                log('🔊 Аудио разблокировано');
                audioUnlocked = true;
                unlockAudioDiv.classList.add('hidden');
                
                // Пробуем воспроизвести все аудио элементы
                Object.values(audioElements).forEach(audio => {
                    audio.play().catch(e => log(`Ошибка воспроизведения: ${e.message}`));
                });
            });
        }

        unlockAudioDiv.addEventListener('click', unlockAudio);

        // Разблокируем аудио при первом взаимодействии с страницей
        document.addEventListener('click', function once() {
            unlockAudio();
            document.removeEventListener('click', once);
        }, { once: true });

        // ==================== ЗВУКОВЫЕ ЭФФЕКТЫ ====================
        function playSound(type) {
            if (!audioUnlocked) return;
            
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                switch(type) {
                    case 'join':
                        oscillator.frequency.value = 880;
                        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.3);
                        break;
                        
                    case 'participant-joined':
                        oscillator.frequency.value = 659.25;
                        gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.2);
                        
                        setTimeout(() => {
                            const osc2 = audioContext.createOscillator();
                            const gain2 = audioContext.createGain();
                            osc2.connect(gain2);
                            gain2.connect(audioContext.destination);
                            osc2.frequency.value = 880;
                            gain2.gain.setValueAtTime(0.1, audioContext.currentTime);
                            gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                            osc2.start();
                            osc2.stop(audioContext.currentTime + 0.15);
                        }, 100);
                        break;
                        
                    case 'participant-left':
                        oscillator.frequency.value = 440;
                        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.25);
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.25);
                        break;
                        
                    case 'connected':
                        oscillator.frequency.value = 1046.5;
                        gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.4);
                        
                        setTimeout(() => {
                            const osc2 = audioContext.createOscillator();
                            const gain2 = audioContext.createGain();
                            osc2.connect(gain2);
                            gain2.connect(audioContext.destination);
                            osc2.frequency.value = 1318.5;
                            gain2.gain.setValueAtTime(0.15, audioContext.currentTime);
                            gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                            osc2.start();
                            osc2.stop(audioContext.currentTime + 0.3);
                        }, 150);
                        break;
                }
            } catch (e) {
                console.log('Ошибка воспроизведения звука:', e);
            }
        }

        // Логирование
        function log(message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateDebugInfo() {
            let html = '<strong>Отладка:</strong><br>';
            html += `Локальный поток: ${localStream ? '✅' : '❌'}<br>`;
            html += `Аудио треков: ${localStream?.getAudioTracks().length || 0}<br>`;
            html += `Peer соединений: ${Object.keys(peers).length}<br>`;
            html += `Аудио элементов: ${Object.keys(audioElements).length}<br>`;
            html += `Потоки получены от: ${Object.keys(peerStreams).join(', ') || 'никого'}<br>`;
            debugPanel.innerHTML = html;
        }

        // Получаем параметры из URL
        function getUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('call');
        }

        // Обновляем информацию о ссылке
        function updateLinkInfo(roomId) {
            if (roomId) {
                const link = window.location.origin + window.location.pathname + '?call=' + roomId;
                linkInfoDiv.innerHTML = `🔗 Ссылка для приглашения: <br><small style="color: #b8e0b8;">${link}</small>`;
            } else {
                linkInfoDiv.innerHTML = '';
            }
        }

        // Обновление сетки участников
        function updateParticipantsGrid() {
            if (!allUsers) return;
            
            let html = '';
            const userIds = Object.keys(allUsers);
            
            const sortedIds = userIds.sort((a, b) => {
                if (a === currentUser.id) return -1;
                if (b === currentUser.id) return 1;
                return (allUsers[a].name || '').localeCompare(allUsers[b].name || '');
            });
            
            sortedIds.forEach(userId => {
                const user = allUsers[userId];
                if (!user) return;
                
                const isMe = userId === currentUser.id;
                const peer = peers[userId];
                const hasStream = peerStreams[userId];
                
                let statusText = '⏳ Подключение...';
                
                if (isMe) {
                    statusText = localStream?.getAudioTracks()[0]?.enabled ? '🎤 Готов' : '🔇 Микрофон выключен';
                } else if (peer) {
                    if (peer.connected && hasStream) {
                        statusText = '✅ Аудио активно';
                    } else if (peer.connected) {
                        statusText = '🔄 Ожидание аудио';
                    } else if (peer.destroyed) {
                        statusText = '❌ Ошибка';
                    } else {
                        statusText = '🔄 Соединение...';
                    }
                }
                
                html += `
                    <div class="participant-card" id="participant-${userId}">
                        <div class="participant-name">${user.name}${isMe ? ' (Вы)' : ''}</div>
                        <div class="participant-avatar">👤</div>
                        <div class="participant-status">${statusText}</div>
                        <div class="speaking-indicator hidden-indicator" id="speaking-${userId}"></div>
                        <div class="volume-indicator">
                            <div class="volume-level" id="volume-${userId}" style="width: 0%"></div>
                        </div>
                    </div>
                `;
            });
            
            participantsGrid.innerHTML = html;
            
            const count = Object.keys(allUsers).length;
            participantCountSpan.textContent = `${count} ${count === 1 ? 'участник' : (count < 5 ? 'участника' : 'участников')}`;
            updateDebugInfo();
        }

        // Автоматическое подключение при загрузке
        async function autoJoin() {
            const callParam = getUrlParams();
            if (callParam && !autoJoinAttempted) {
                autoJoinAttempted = true;
                roomIdInput.value = callParam;
                updateLinkInfo(callParam);
                
                autoJoinMessageDiv.textContent = `🔄 Автоматическое подключение к комнате ${callParam}...`;
                autoJoinMessageDiv.classList.remove('hidden');
                
                log('🔗 Обнаружена ссылка на комнату: ' + callParam);
                log('🔄 Автоматическое подключение...');
                
                setTimeout(() => {
                    joinRoom();
                }, 1000);
            }
        }

        window.addEventListener('load', autoJoin);

        userNameInput.oninput = (e) => currentUser.name = e.target.value || 'Гость';

        function copyRoomId() {
            const roomId = currentRoomDisplay.textContent;
            navigator.clipboard.writeText(roomId).then(() => {
                log('ID комнаты скопирован');
                alert('ID комнаты скопирован');
            }).catch(() => {
                log('Ошибка копирования ID');
                alert('Не удалось скопировать');
            });
        }

        function copyCallLink() {
            const roomId = currentRoomDisplay.textContent;
            const link = window.location.origin + window.location.pathname + '?call=' + roomId;
            navigator.clipboard.writeText(link).then(() => {
                log('Ссылка на звонок скопирована');
                alert('Ссылка на звонок скопирована');
            }).catch(() => {
                log('Ошибка копирования ссылки');
                alert('Не удалось скопировать ссылку');
            });
        }

        function createRoom() {
            roomIdInput.value = Math.random().toString(36).substring(2, 8);
            updateLinkInfo(roomIdInput.value);
            log('Создана новая комната: ' + roomIdInput.value);
            joinRoom();
        }

        // Тест микрофона
        async function testMicrophone() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                log('✅ Микрофон работает');
                
                const audioContext = new AudioContext();
                const analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                analyser.fftSize = 256;
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                const indicator = document.createElement('div');
                indicator.style.position = 'fixed';
                indicator.style.top = '10px';
                indicator.style.right = '10px';
                indicator.style.background = '#1a4a30';
                indicator.style.padding = '10px';
                indicator.style.borderRadius = '5px';
                indicator.style.zIndex = '1000';
                document.body.appendChild(indicator);
                
                const interval = setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    const avg = dataArray.reduce((a, b) => a + b) / dataArray.length;
                    indicator.textContent = `🎤 Уровень: ${Math.round(avg)}`;
                    if (avg > 10) {
                        indicator.style.background = '#2e7d5e';
                    } else {
                        indicator.style.background = '#7d3e3e';
                    }
                }, 100);
                
                setTimeout(() => {
                    clearInterval(interval);
                    indicator.remove();
                    stream.getTracks().forEach(t => t.stop());
                }, 3000);
                
            } catch (err) {
                log('❌ Ошибка микрофона: ' + err.message);
                alert('Ошибка доступа к микрофону: ' + err.message);
            }
        }

        // Тест вывода звука
        function testAudioOutput() {
            try {
                unlockAudio();
                
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 440;
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.5);
                
                log('✅ Тестовый звук воспроизведен');
            } catch (err) {
                log('❌ Ошибка воспроизведения: ' + err.message);
            }
        }

        // Принудительный перезапуск аудио
        function forceAudioRestart() {
            log('🔄 Принудительный перезапуск аудио');
            
            // Пересоздаем все аудио элементы
            Object.keys(audioElements).forEach(userId => {
                const oldAudio = audioElements[userId];
                const stream = oldAudio.srcObject;
                
                if (stream) {
                    const newAudio = document.createElement('audio');
                    newAudio.id = `audio-${userId}`;
                    newAudio.autoplay = true;
                    newAudio.controls = false;
                    newAudio.style.display = 'none';
                    newAudio.srcObject = stream;
                    document.body.appendChild(newAudio);
                    
                    oldAudio.remove();
                    audioElements[userId] = newAudio;
                    
                    if (audioUnlocked) {
                        newAudio.play().catch(e => log(`Ошибка: ${e.message}`));
                    }
                }
            });
            
            log('✅ Аудио перезапущено');
        }

        // ==================== ICE СЕРВЕРЫ ====================
        function getIceServers() {
            return [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
                {
                    urls: [
                        'turn:openrelay.metered.ca:80',
                        'turn:openrelay.metered.ca:443'
                    ],
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ];
        }

        async function joinRoom() {
            const roomId = roomIdInput.value.trim();
            if (!roomId) {
                log('Ошибка: не введен ID комнаты');
                return alert('Введите ID комнаты');
            }

            autoJoinMessageDiv.classList.add('hidden');

            try {
                statusDiv.textContent = '🎤 Запрашиваем микрофон...';
                log('Запрос доступа к микрофону...');
                
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        channelCount: 1,
                        sampleRate: 48000
                    }, 
                    video: false 
                });
                
                log('✅ Микрофон получен');
                log(`🎵 Аудио треков: ${localStream.getAudioTracks().length}`);
                
                localStream.getAudioTracks().forEach(track => {
                    track.enabled = true;
                    log(`🎤 Трек: ${track.label}, готов: ${track.readyState}`);
                });
                
                playSound('join');
                
                currentRoom = roomId;
                currentRoomDisplay.textContent = roomId;
                updateLinkInfo(roomId);
                setupDiv.classList.add('hidden');
                callDiv.classList.remove('hidden');
                
                roomRef = db.ref('rooms/' + roomId);
                
                await roomRef.child('users/' + currentUser.id).set({ 
                    name: currentUser.name,
                    timestamp: Date.now()
                });
                roomRef.child('users/' + currentUser.id).onDisconnect().remove();
                log('Подключен к комнате ' + roomId);

                callsRef = db.ref('calls/' + roomId);
                callsRef.on('child_added', (snap) => {
                    const signal = snap.val();
                    if (signal.from !== currentUser.id) {
                        log(`📨 Получен сигнал от ${signal.from}`);
                        
                        if (peers[signal.from] && !peers[signal.from].destroyed) {
                            try {
                                peers[signal.from].signal(signal.data);
                                log('✅ Сигнал применен');
                            } catch (e) {
                                log(`❌ Ошибка применения сигнала: ${e.message}`);
                                if (!pendingSignals[signal.from]) pendingSignals[signal.from] = [];
                                pendingSignals[signal.from].push(signal.data);
                            }
                        } else {
                            if (!pendingSignals[signal.from]) pendingSignals[signal.from] = [];
                            pendingSignals[signal.from].push(signal.data);
                            log(`📦 Сигнал сохранен в очередь (${pendingSignals[signal.from].length})`);
                        }
                        snap.ref.remove();
                    }
                });

                roomRef.child('users').on('value', (snap) => {
                    const users = snap.val();
                    if (!users) return;
                    
                    const newUsers = Object.keys(users).filter(id => 
                        id !== currentUser.id && !allUsers[id]
                    );
                    
                    const leftUsers = Object.keys(allUsers).filter(id => 
                        id !== currentUser.id && !users[id]
                    );
                    
                    allUsers = users;
                    
                    newUsers.forEach(userId => {
                        playSound('participant-joined');
                        log(`🔔 Новый участник: ${users[userId].name}`);
                    });
                    
                    leftUsers.forEach(userId => {
                        playSound('participant-left');
                        log(`🔔 Участник отключился: ${allUsers[userId]?.name || userId}`);
                    });
                    
                    Object.keys(users).forEach(userId => {
                        if (userId !== currentUser.id && !peers[userId]) {
                            const newUser = users[userId];
                            createPeerWith(userId, newUser.name);
                        }
                    });
                    
                    Object.keys(peers).forEach(userId => {
                        if (!users[userId]) {
                            if (reconnectTimeouts[userId]) {
                                clearTimeout(reconnectTimeouts[userId]);
                                delete reconnectTimeouts[userId];
                            }
                            if (peers[userId] && !peers[userId].destroyed) {
                                peers[userId].destroy();
                            }
                            delete peers[userId];
                            
                            if (analyserIntervals[userId]) {
                                clearInterval(analyserIntervals[userId]);
                                delete analyserIntervals[userId];
                            }
                            
                            if (audioElements[userId]) {
                                audioElements[userId].remove();
                                delete audioElements[userId];
                            }
                            
                            delete peerStreams[userId];
                        }
                    });
                    
                    updateParticipantsGrid();
                    
                    const count = Object.keys(users).length;
                    statusDiv.textContent = `👥 В комнате: ${count} ${count === 1 ? 'участник' : (count < 5 ? 'участника' : 'участников')}`;
                });

            } catch (err) {
                log('❌ Ошибка: ' + err.message);
                alert('Ошибка: ' + err.message);
                autoJoinMessageDiv.classList.add('hidden');
            }
        }

        function createPeerWith(userId, userName) {
            if (peers[userId] && !peers[userId].destroyed) {
                log(`⚠️ Peer с ${userName} уже существует`);
                return;
            }
            
            log(`🔧 Создаем peer с ${userName} (${userId})`);
            
            const isInit = currentUser.id < userId;
            
            try {
                const peer = new SimplePeer({ 
                    initiator: isInit, 
                    stream: localStream,
                    trickle: true,
                    config: { 
                        iceServers: getIceServers(),
                        iceTransportPolicy: 'all',
                        iceCandidatePoolSize: 10
                    }
                });
                
                peer.remoteName = userName;
                
                // Создаем аудио элемент
                const audioEl = document.createElement('audio');
                audioEl.id = `audio-${userId}`;
                audioEl.autoplay = true;
                audioEl.controls = false;
                audioEl.style.display = 'none';
                document.body.appendChild(audioEl);
                audioElements[userId] = audioEl;

                peer.on('signal', data => {
                    log(`📤 Отправка сигнала для ${userName}`);
                    db.ref('calls/' + currentRoom).push({
                        from: currentUser.id,
                        to: userId,
                        data: data
                    });
                });

                peer.on('stream', stream => {
                    log(`🎵 Получен аудиопоток от ${userName}`);
                    log(`📊 Треков в потоке: ${stream.getAudioTracks().length}`);
                    
                    // Проверяем, есть ли аудиотреки
                    if (stream.getAudioTracks().length === 0) {
                        log('⚠️ Внимание: получен поток без аудиотреков!');
                    }
                    
                    peerStreams[userId] = true;
                    
                    // Подключаем поток к аудио элементу
                    audioEl.srcObject = stream;
                    
                    // Показываем кнопку разблокировки если нужно
                    if (!audioUnlocked) {
                        unlockAudioDiv.classList.remove('hidden');
                        log('🔇 Аудио заблокировано браузером, нажмите кнопку');
                    } else {
                        // Пробуем воспроизвести
                        audioEl.play().then(() => {
                            log(`✅ Аудио от ${userName} воспроизводится`);
                        }).catch(e => {
                            log(`❌ Ошибка воспроизведения: ${e.message}`);
                        });
                    }
                    
                    updateParticipantsGrid();
                    playSound('connected');
                    
                    // Анализируем уровень звука
                    try {
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const analyser = audioContext.createAnalyser();
                        const source = audioContext.createMediaStreamSource(stream);
                        source.connect(analyser);
                        
                        analyser.fftSize = 256;
                        const dataArray = new Uint8Array(analyser.frequencyBinCount);
                        
                        if (analyserIntervals[userId]) {
                            clearInterval(analyserIntervals[userId]);
                        }
                        
                        analyserIntervals[userId] = setInterval(() => {
                            analyser.getByteFrequencyData(dataArray);
                            const avg = dataArray.reduce((a, b) => a + b) / dataArray.length;
                            
                            const volumeEl = document.getElementById(`volume-${userId}`);
                            if (volumeEl) {
                                const percent = Math.min(100, (avg / 128) * 100);
                                volumeEl.style.width = percent + '%';
                            }
                            
                            const indicator = document.getElementById(`speaking-${userId}`);
                            if (indicator) {
                                if (avg > 20) {
                                    indicator.classList.remove('hidden-indicator');
                                } else {
                                    indicator.classList.add('hidden-indicator');
                                }
                            }
                        }, 100);
                    } catch (e) {
                        log(`Ошибка анализатора: ${e.message}`);
                    }
                    
                    // Применяем накопленные сигналы
                    if (pendingSignals[userId] && pendingSignals[userId].length > 0) {
                        log(`📦 Применяем ${pendingSignals[userId].length} накопленных сигналов`);
                        pendingSignals[userId].forEach(signalData => {
                            try {
                                peer.signal(signalData);
                            } catch (e) {
                                log(`Ошибка при накопленном сигнале: ${e.message}`);
                            }
                        });
                        delete pendingSignals[userId];
                    }
                });

                peer.on('connect', () => {
                    log(`✅ Peer соединение с ${userName} установлено`);
                    updateParticipantsGrid();
                    
                    if (reconnectTimeouts[userId]) {
                        clearTimeout(reconnectTimeouts[userId]);
                        delete reconnectTimeouts[userId];
                    }
                });

                peer.on('error', (err) => {
                    log(`❌ Ошибка peer с ${userName}: ${err.message}`);
                    updateParticipantsGrid();
                    
                    if (!reconnectTimeouts[userId] && allUsers[userId]) {
                        reconnectTimeouts[userId] = setTimeout(() => {
                            log(`🔄 Переподключение к ${userName}...`);
                            if (peers[userId] && !peers[userId].destroyed) {
                                peers[userId].destroy();
                            }
                            delete peers[userId];
                            
                            if (analyserIntervals[userId]) {
                                clearInterval(analyserIntervals[userId]);
                                delete analyserIntervals[userId];
                            }
                            
                            if (audioElements[userId]) {
                                audioElements[userId].remove();
                                delete audioElements[userId];
                            }
                            
                            delete peerStreams[userId];
                            
                            createPeerWith(userId, userName);
                            delete reconnectTimeouts[userId];
                        }, 3000);
                    }
                });

                peer.on('close', () => {
                    log(`🔒 Peer с ${userName} закрыт`);
                    
                    if (audioElements[userId]) {
                        audioElements[userId].remove();
                        delete audioElements[userId];
                    }
                    
                    delete peerStreams[userId];
                    updateParticipantsGrid();
                    
                    if (analyserIntervals[userId]) {
                        clearInterval(analyserIntervals[userId]);
                        delete analyserIntervals[userId];
                    }
                });

                peers[userId] = peer;
                
                if (pendingSignals[userId] && pendingSignals[userId].length > 0) {
                    log(`📦 Есть ${pendingSignals[userId].length} накопленных сигналов для ${userName}`);
                    setTimeout(() => {
                        if (peers[userId] && !peers[userId].destroyed) {
                            pendingSignals[userId].forEach(signalData => {
                                try {
                                    peers[userId].signal(signalData);
                                } catch (e) {
                                    log(`Ошибка при накопленном сигнале: ${e.message}`);
                                }
                            });
                            delete pendingSignals[userId];
                        }
                    }, 1000);
                }

            } catch (err) {
                log(`❌ Ошибка создания peer с ${userName}: ${err.message}`);
            }
        }

        function toggleMic() {
            if (localStream) {
                const track = localStream.getAudioTracks()[0];
                if (track) {
                    track.enabled = !track.enabled;
                    micBtn.textContent = track.enabled ? '🔇 Выкл микрофон' : '🎤 Вкл микрофон';
                    log('Микрофон ' + (track.enabled ? 'включен' : 'выключен'));
                    updateParticipantsGrid();
                }
            }
        }

        function endCall() {
            log('Завершение звонка');
            
            if (roomRef) {
                roomRef.child('users').off();
                roomRef.child('users/' + currentUser.id).remove();
                roomRef = null;
            }
            
            if (callsRef) {
                callsRef.off();
                callsRef.remove();
                callsRef = null;
            }
            
            Object.values(reconnectTimeouts).forEach(timeout => clearTimeout(timeout));
            reconnectTimeouts = {};
            
            Object.values(analyserIntervals).forEach(interval => clearInterval(interval));
            analyserIntervals = {};
            
            Object.values(peers).forEach(peer => {
                if (peer && !peer.destroyed) peer.destroy();
            });
            peers = {};
            
            Object.values(audioElements).forEach(audio => audio.remove());
            audioElements = {};
            
            peerStreams = {};
            
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            
            pendingSignals = {};
            allUsers = {};
            currentRoom = null;
            
            setupDiv.classList.remove('hidden');
            callDiv.classList.add('hidden');
            updateLinkInfo(roomIdInput.value);
            autoJoinAttempted = false;
            unlockAudioDiv.classList.add('hidden');
            
            log('✅ Звонок завершен');
            updateDebugInfo();
        }
    </script>
