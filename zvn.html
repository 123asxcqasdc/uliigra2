<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Звонкие Улитки · простая версия</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #0a2f1f;
            color: #e0f2e9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #1a3f2a;
            border-radius: 32px;
            padding: 24px;
            border: 1px solid #2a5a3a;
        }
        h1 {
            text-align: center;
            color: #8bc34a;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        h1::before, h1::after {
            content: "🐌";
            font-size: 2rem;
            margin: 0 10px;
            display: inline-block;
        }
        .setup-card, .call-card {
            background: #1e4a2e;
            border-radius: 24px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #3a7a4a;
        }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        input, button {
            background: #2a4a35;
            border: 1px solid #3e9e7a;
            border-radius: 40px;
            padding: 12px 20px;
            font-size: 1rem;
            color: white;
            outline: none;
        }
        button {
            background: #2e7d5e;
            border: none;
            cursor: pointer;
            font-weight: bold;
            min-width: 140px;
        }
        button:hover {
            background: #3e9e7a;
            transform: translateY(-2px);
        }
        .room-header {
            background: #1a4a30;
            border-radius: 40px;
            padding: 10px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        .participants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }
        .participant-card {
            background: linear-gradient(145deg, #1e4a2e, #0e3a1e);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            position: relative;
            border: 1px solid #3a7a4a;
        }
        .participant-card.muted {
            opacity: 0.7;
            border-color: #b34a4a;
        }
        .participant-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #a5d6a5;
        }
        .participant-avatar {
            font-size: 3rem;
            margin: 8px 0;
        }
        .participant-status {
            background: #1e3a2a;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
            display: inline-block;
        }
        .mute-badge {
            background: #b34a4a;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 8px;
        }
        audio {
            width: 100%;
            margin: 8px 0;
            border-radius: 20px;
            height: 36px;
        }
        .speaking-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #6eff6e;
            position: absolute;
            top: 12px;
            right: 12px;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 50% { opacity: 0.5; transform: scale(1.2); } }
        .hidden-indicator { display: none; }
        .volume-indicator {
            width: 100%;
            height: 4px;
            background: #1e3a2a;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }
        .volume-level {
            height: 100%;
            width: 0%;
            background: #8bc34a;
            transition: width 0.1s;
        }
        .log-panel {
            background: #0e2a1a;
            border-radius: 16px;
            padding: 12px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.75rem;
            max-height: 150px;
            overflow-y: auto;
        }
        .log-entry {
            border-bottom: 1px solid #1a4a2a;
            padding: 3px 0;
        }
        .unlock-audio {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #8bc34a;
            color: #0a2f1f;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 999;
            border: none;
        }
        .unlock-audio.hidden { display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="unlockAudio" class="unlock-audio hidden">🔊 Нажмите для включения звука</div>

    <div class="container">
        <h1>Звонкие Улитки</h1>

        <div id="setup" class="setup-card">
            <div class="link-info" id="linkInfo"></div>
            <div id="autoJoinMessage" style="background:#2e6b4e; border-radius:40px; padding:10px; margin-bottom:12px; display:none;">
                🔄 Автоматическое подключение...
            </div>
            <div class="flex-row">
                <input type="text" id="userName" placeholder="Ваше имя" value="Гость">
                <input type="text" id="roomId" placeholder="ID комнаты">
                <button onclick="createRoom()">✨ Создать</button>
                <button onclick="joinRoom()">🔗 Присоединиться</button>
                <button onclick="testMic()" style="background:#1e4a2e;">🎤 Тест</button>
            </div>
        </div>

        <div id="call" class="call-card hidden">
            <div class="room-header">
                <span><strong>🏠 Комната: <span id="currentRoomDisplay"></span></strong></span>
                <div style="display: flex; gap: 8px;">
                    <button onclick="copyRoomId()" style="padding:6px 12px;">📋 ID</button>
                    <button onclick="copyCallLink()" style="padding:6px 12px;">🔗 Ссылка</button>
                </div>
                <span class="badge" id="participantCount">0 участников</span>
            </div>
            <div id="status" style="text-align:center; background:#1a4a30; padding:10px; border-radius:40px;">⏳ Ожидание...</div>
            <div id="participantsGrid" class="participants-grid"></div>
            <div class="flex-row" style="margin-top: 20px;">
                <button onclick="toggleMic()" id="micBtn">🔇 Выкл микрофон</button>
                <button onclick="testSound()" style="background:#1e4a2e;">🔊 Тест звука</button>
                <button onclick="endCall()" style="background:#7d3e3e;">📞 Завершить</button>
            </div>
        </div>

        <div class="log-panel" id="log">
            <div class="log-entry">[Система] Готов 🐌</div>
        </div>
    </div>

    <script>
        (function() {
            // Firebase
            const firebaseConfig = {
                apiKey: "AIzaSyDTx2Y9ctiWp26YeMmAHAxDZd_gVI_ZMdw",
                authDomain: "kcalls.firebaseapp.com",
                databaseURL: "https://kcalls-default-rtdb.firebaseio.com",
                projectId: "kcalls",
                storageBucket: "kcalls.firebasestorage.app",
                messagingSenderId: "990117089104",
                appId: "1:990117089104:web:278a42c037e975ebb76655"
            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

            // Состояние
            let localStream = null;
            let peers = {};
            let currentRoom = null;
            let currentUser = {
                id: 'u_' + Math.random().toString(36).substring(2, 10),
                name: 'Гость'
            };
            let allUsers = {};
            let roomRef = null;
            let callsRef = null;
            let audioElements = {};
            let muteStatus = {};
            let audioUnlocked = false;

            // DOM
            const setupDiv = document.getElementById('setup');
            const callDiv = document.getElementById('call');
            const micBtn = document.getElementById('micBtn');
            const userNameInput = document.getElementById('userName');
            const roomIdInput = document.getElementById('roomId');
            const currentRoomDisplay = document.getElementById('currentRoomDisplay');
            const logDiv = document.getElementById('log');
            const linkInfoDiv = document.getElementById('linkInfo');
            const autoJoinMessageDiv = document.getElementById('autoJoinMessage');
            const participantsGrid = document.getElementById('participantsGrid');
            const participantCountSpan = document.getElementById('participantCount');
            const unlockAudioDiv = document.getElementById('unlockAudio');
            const statusDiv = document.getElementById('status');

            function log(msg) {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                logDiv.appendChild(entry);
                logDiv.scrollTop = logDiv.scrollHeight;
            }

            function getIceServers() {
                return [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
                ];
            }

            function updateParticipantsGrid() {
                if (!allUsers) return;
                let html = '';
                const userIds = Object.keys(allUsers).sort((a,b) => a === currentUser.id ? -1 : b === currentUser.id ? 1 : 0);
                
                userIds.forEach(userId => {
                    const user = allUsers[userId];
                    const isMe = userId === currentUser.id;
                    const peer = peers[userId];
                    const hasAudio = audioElements[userId] && audioElements[userId].srcObject;
                    const isMuted = muteStatus[userId] || (isMe && localStream && !localStream.getAudioTracks()[0]?.enabled);
                    
                    let statusText = isMe ? (localStream?.getAudioTracks()[0]?.enabled ? '🎤 Микрофон включён' : '🔇 Микрофон выключен') :
                                    (peer?.connected && hasAudio ? (isMuted ? '🔇 Микрофон выключен' : '🎤 Микрофон включён') : '🔄 Соединение...');
                    
                    html += `
                        <div class="participant-card ${isMuted ? 'muted' : ''}">
                            <div class="participant-name">${user.name}${isMe ? ' (Вы)' : ''} ${isMuted ? '<span class="mute-badge">🔇 выкл</span>' : ''}</div>
                            <div class="participant-avatar">${isMuted ? '🔇' : '🐌'}</div>
                            <div class="participant-status">${statusText}</div>
                            ${!isMe ? `<audio id="audio-${userId}" controls style="width:100%; margin:8px 0;"></audio>` : ''}
                            <div class="speaking-indicator hidden-indicator" id="speaking-${userId}"></div>
                            <div class="volume-indicator"><div class="volume-level" id="volume-${userId}"></div></div>
                        </div>
                    `;
                });
                participantsGrid.innerHTML = html;
                
                // Подключаем существующие аудио
                Object.keys(audioElements).forEach(userId => {
                    const el = document.getElementById(`audio-${userId}`);
                    if (el && audioElements[userId]?.srcObject) {
                        el.srcObject = audioElements[userId].srcObject;
                        audioElements[userId] = el;
                        if (audioUnlocked) el.play().catch(e => {});
                    }
                });
                participantCountSpan.textContent = `${Object.keys(allUsers).length} участников`;
            }

            function unlockAudio() {
                if (audioUnlocked) return;
                const ac = new (window.AudioContext || window.webkitAudioContext)();
                ac.resume().then(() => {
                    audioUnlocked = true;
                    unlockAudioDiv.classList.add('hidden');
                    Object.values(audioElements).forEach(a => a.play().catch(e => {}));
                    log('🔊 Аудио разблокировано');
                });
            }
            unlockAudioDiv.onclick = unlockAudio;
            document.addEventListener('click', () => { if (!audioUnlocked) unlockAudio(); }, { once: true });

            async function testMic() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    log('✅ Микрофон работает');
                    stream.getTracks().forEach(t => t.stop());
                } catch(e) { alert('Нет доступа к микрофону'); log('❌ Ошибка микрофона'); }
            }
            function testSound() {
                const ac = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ac.createOscillator();
                osc.connect(ac.destination);
                osc.frequency.value = 440;
                osc.start();
                osc.stop(ac.currentTime + 0.3);
                log('🔊 Тест звука');
            }

            function createPeerWith(userId, userName) {
                if (peers[userId]) return;
                log(`🔧 Создаём peer для ${userName}`);
                
                const isInit = currentUser.id < userId;
                
                // Не клонируем, используем исходный поток
                const peer = new SimplePeer({
                    initiator: isInit,
                    stream: localStream,
                    trickle: false,
                    config: { iceServers: getIceServers() }
                });
                
                const audioEl = document.createElement('audio');
                audioEl.id = `audio-${userId}`;
                audioEl.autoplay = true;
                audioEl.controls = true;
                audioEl.style.display = 'none';
                document.body.appendChild(audioEl);
                audioElements[userId] = audioEl;
                
                peer.on('signal', data => {
                    log(`📤 Отправка сигнала для ${userName}`);
                    callsRef.push({ from: currentUser.id, to: userId, data });
                });
                
                peer.on('stream', stream => {
                    log(`🎵 Получен аудиопоток от ${userName}`);
                    audioElements[userId].srcObject = stream;
                    if (audioUnlocked) audioElements[userId].play().catch(e => {});
                    updateParticipantsGrid();
                    
                    // Визуализация
                    setTimeout(() => {
                        try {
                            const ctx = new AudioContext();
                            const analyser = ctx.createAnalyser();
                            const src = ctx.createMediaStreamSource(stream);
                            src.connect(analyser);
                            const data = new Uint8Array(analyser.frequencyBinCount);
                            setInterval(() => {
                                analyser.getByteFrequencyData(data);
                                const avg = data.reduce((a,b)=>a+b)/data.length;
                                const vol = document.getElementById(`volume-${userId}`);
                                if (vol) vol.style.width = Math.min(100, (avg/128)*100) + '%';
                                const spk = document.getElementById(`speaking-${userId}`);
                                if (spk) spk.classList.toggle('hidden-indicator', avg <= 20);
                            }, 100);
                        } catch(e) {}
                    }, 500);
                });
                
                peer.on('connect', () => log(`✅ Соединение с ${userName} установлено!`));
                peer.on('error', e => log(`❌ Ошибка: ${e.message}`));
                peer.on('close', () => {
                    log(`🔒 Peer с ${userName} закрыт`);
                    delete peers[userId];
                    if (audioElements[userId]) audioElements[userId].remove();
                    delete audioElements[userId];
                });
                
                peers[userId] = peer;
            }

            async function joinRoom() {
                const roomId = roomIdInput.value.trim();
                if (!roomId) return alert('Введите ID комнаты');
                autoJoinMessageDiv.style.display = 'none';
                
                try {
                    statusDiv.textContent = '🎤 Запрос микрофона...';
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    localStream.getAudioTracks().forEach(t => t.enabled = true);
                    log('✅ Микрофон получен');
                    
                    currentRoom = roomId;
                    currentRoomDisplay.textContent = roomId;
                    setupDiv.classList.add('hidden');
                    callDiv.classList.remove('hidden');
                    
                    roomRef = db.ref('rooms/' + roomId);
                    await roomRef.child('users/' + currentUser.id).set({ name: currentUser.name, timestamp: Date.now() });
                    roomRef.child('users/' + currentUser.id).onDisconnect().remove();
                    
                    // Статус микрофона
                    roomRef.child('mute').on('value', snap => {
                        const mutes = snap.val() || {};
                        Object.keys(mutes).forEach(uid => { if (uid !== currentUser.id) muteStatus[uid] = mutes[uid].muted; });
                        updateParticipantsGrid();
                    });
                    
                    // Сигналы
                    callsRef = db.ref('calls/' + roomId);
                    callsRef.on('child_added', snap => {
                        const signal = snap.val();
                        if (signal.from !== currentUser.id) {
                            log(`📨 Получен сигнал от ${signal.from}`);
                            if (peers[signal.from]) {
                                peers[signal.from].signal(signal.data);
                            } else {
                                // Если peer ещё не создан, создаём сейчас
                                if (allUsers[signal.from]) {
                                    createPeerWith(signal.from, allUsers[signal.from].name);
                                    setTimeout(() => {
                                        if (peers[signal.from]) peers[signal.from].signal(signal.data);
                                    }, 500);
                                }
                            }
                            snap.ref.remove();
                        }
                    });
                    
                    // Список участников
                    roomRef.child('users').on('value', snap => {
                        const users = snap.val() || {};
                        const oldUsers = Object.keys(allUsers);
                        allUsers = users;
                        
                        Object.keys(users).forEach(uid => {
                            if (uid !== currentUser.id && !peers[uid]) {
                                log(`🔔 Новый участник: ${users[uid].name}`);
                                createPeerWith(uid, users[uid].name);
                            }
                        });
                        
                        oldUsers.forEach(uid => {
                            if (uid !== currentUser.id && !users[uid]) {
                                log(`🔔 Участник отключился: ${allUsers[uid]?.name || uid}`);
                                if (peers[uid]) peers[uid].destroy();
                                delete peers[uid];
                                if (audioElements[uid]) audioElements[uid].remove();
                                delete audioElements[uid];
                            }
                        });
                        
                        updateParticipantsGrid();
                        statusDiv.textContent = `👥 В комнате: ${Object.keys(users).length} участников`;
                    });
                    
                } catch(e) {
                    log('❌ Ошибка: ' + e.message);
                    alert('Ошибка доступа к микрофону');
                    setupDiv.classList.remove('hidden');
                    callDiv.classList.add('hidden');
                }
            }
            
            window.createRoom = () => {
                roomIdInput.value = Math.random().toString(36).substring(2, 8);
                updateLinkInfo(roomIdInput.value);
                log('Создана комната: ' + roomIdInput.value);
                joinRoom();
            };
            window.joinRoom = joinRoom;
            window.toggleMic = () => {
                if (!localStream) return;
                const track = localStream.getAudioTracks()[0];
                track.enabled = !track.enabled;
                micBtn.textContent = track.enabled ? '🔇 Выкл микрофон' : '🎤 Вкл микрофон';
                muteStatus[currentUser.id] = !track.enabled;
                if (roomRef) roomRef.child('mute/' + currentUser.id).set({ muted: !track.enabled });
                updateParticipantsGrid();
            };
            window.endCall = () => {
                log('Завершение звонка');
                if (roomRef) {
                    roomRef.child('users').off();
                    roomRef.child('mute').off();
                    roomRef.child('users/' + currentUser.id).remove();
                }
                if (callsRef) callsRef.off();
                Object.values(peers).forEach(p => p.destroy());
                Object.values(audioElements).forEach(a => a.remove());
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                peers = {}; audioElements = {}; allUsers = {}; muteStatus = {};
                currentRoom = null; localStream = null; roomRef = null; callsRef = null;
                setupDiv.classList.remove('hidden');
                callDiv.classList.add('hidden');
                unlockAudioDiv.classList.add('hidden');
                log('✅ Звонок завершён');
            };
            window.copyRoomId = () => navigator.clipboard.writeText(currentRoomDisplay.textContent).then(() => alert('ID скопирован'));
            window.copyCallLink = () => {
                const link = window.location.origin + window.location.pathname + '?call=' + currentRoom;
                navigator.clipboard.writeText(link).then(() => alert('Ссылка скопирована'));
            };
            window.testMic = testMic;
            window.testSound = testSound;
            
            function updateLinkInfo(roomId) {
                if (roomId) linkInfoDiv.innerHTML = `🔗 Ссылка: ${window.location.origin + window.location.pathname}?call=${roomId}`;
                else linkInfoDiv.innerHTML = '';
            }
            function getUrlParams() { return new URLSearchParams(window.location.search).get('call'); }
            
            (function autoJoin() {
                const call = getUrlParams();
                if (call) {
                    roomIdInput.value = call;
                    updateLinkInfo(call);
                    autoJoinMessageDiv.style.display = 'block';
                    setTimeout(() => joinRoom(), 1000);
                }
            })();
            
            userNameInput.oninput = e => currentUser.name = e.target.value || 'Гость';
        })();
    </script>
</body>
</html>
